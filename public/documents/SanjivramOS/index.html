<!DOCTYPE html>
<html lang="en" data-theme="dark" data-icons="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SanjivramOS</title>
<!-- Fira Sans / Fira Mono: the Pop!_OS typefaces (falls back to locally installed fonts when offline) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500&family=Fira+Sans:wght@300;400;500;600;700&display=swap">
<style>
/* =====================================================================
   SanjivramOS — a web-based operating system in one file.
   Sections: 1. Theme tokens  2. Base  3. Boot/Lock/Power  4. Desktop
             5. Windows  6. Top panel & dock  7. App Library & overview  8. Menus/Toasts/Dialogs
             9. Shared controls  10. Apps  11. Responsive
   ===================================================================== */

/* ---------- 1. Theme tokens (Pop!_OS palette: warm greys, Pop orange, teal) ---------- */
:root {
  --accent: #faa41a;
  --accent-rgb: 250, 164, 26;
  --on-accent: #1b1a19;
  --font: "Fira Sans", "Fira Sans Book", Ubuntu, Cantarell, "Noto Sans", "Segoe UI", -apple-system, Roboto, sans-serif;
  --mono: "Fira Mono", "Fira Code", "Ubuntu Mono", "DejaVu Sans Mono", Menlo, Consolas, monospace;
  --panel-h: 32px;   /* top panel */
  --dock-h: 76px;    /* space reserved for the floating dock */
  --radius: 10px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --panel-bg: rgba(17, 16, 15, .97);
  --dock-bg: rgba(32, 30, 29, .92);

  --text: #2b2826; --text-2: #625d59; --text-3: #8f8984;
  --glass: rgba(246, 245, 244, .9); --glass-strong: rgba(250, 250, 249, .97);
  --glass-border: rgba(0, 0, 0, .08);
  --surface: #fbfaf9; --surface-2: #f1efed; --surface-3: #e2dfdc;
  --headerbar: #ebe9e7; --menu-bg: #f8f7f6; --wc-bg: rgba(0, 0, 0, .07); --win-edge: rgba(0, 0, 0, .14);
  --border: rgba(0, 0, 0, .09);
  --hover: rgba(0, 0, 0, .055); --active: rgba(0, 0, 0, .1);
  --shadow: 0 18px 46px rgba(0, 0, 0, .24), 0 2px 6px rgba(0, 0, 0, .1);
  --shadow-sm: 0 6px 18px rgba(0, 0, 0, .14);
  --input-bg: #ffffff;
  --wp: #2b2928;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --text: #f2f0ee; --text-2: #b3ada8; --text-3: #857f7a;
  --glass: rgba(36, 34, 33, .9); --glass-strong: rgba(43, 41, 40, .97);
  --glass-border: rgba(255, 255, 255, .07);
  --surface: #333130; --surface-2: #2b2928; --surface-3: #43403e;
  --headerbar: #282625; --menu-bg: #2d2b2a; --wc-bg: rgba(255, 255, 255, .08); --win-edge: rgba(0, 0, 0, .65);
  --border: rgba(255, 255, 255, .07);
  --hover: rgba(255, 255, 255, .07); --active: rgba(255, 255, 255, .13);
  --shadow: 0 22px 56px rgba(0, 0, 0, .55), 0 2px 8px rgba(0, 0, 0, .3);
  --shadow-sm: 0 8px 22px rgba(0, 0, 0, .42);
  --input-bg: #242221;
  color-scheme: dark;
}

/* ---------- 2. Base ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  font-family: var(--font); font-size: 14px; color: var(--text); background: #000;
  user-select: none; -webkit-user-select: none; -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
input, textarea, select, [contenteditable] { user-select: text; -webkit-user-select: text; }
button { font: inherit; color: inherit; }
svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: rgba(128, 128, 128, .35); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }
body.wm-busy, body.wm-busy * { user-select: none !important; }
body.wm-busy iframe { pointer-events: none !important; }

/* App icon tiles. Five styles: Pop (default, full-colour artwork), Circles, Monochrome (new) and
   Graphite, Colorful (older). Every style sets the same properties so previews can override the page style. */
.app-tile { width: 48px; height: 48px; border-radius: 24%; display: grid; place-items: center; flex: none; position: relative; }
.app-tile svg { width: 58%; height: 58%; stroke-width: 1.9; grid-area: 1 / 1; }
.app-tile .art { width: 100%; height: 100%; stroke: none; }
:root[data-icons="pop"] .app-tile, .ic-prev[data-icons="pop"].ic-prev.ic-prev .app-tile { background: var(--tile); border-radius: 26%; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18), inset 0 2px 0 rgba(255,255,255,.28), 0 3px 8px rgba(0,0,0,.28); }
:root[data-icons="pop"] .app-tile .g, .ic-prev[data-icons="pop"].ic-prev.ic-prev .app-tile .g { display: block; stroke: #fff; filter: drop-shadow(0 1.5px 1px rgba(0,0,0,.28)); }
:root[data-icons="pop"] .app-tile .art, .ic-prev[data-icons="pop"].ic-prev.ic-prev .app-tile .art { display: none; }
:root[data-icons="pop"] .app-tile.has-art, .ic-prev[data-icons="pop"].ic-prev.ic-prev .app-tile.has-art { background: none; box-shadow: none; border-radius: 0; filter: drop-shadow(0 2px 3px rgba(0,0,0,.3)); }
:root[data-icons="pop"] .app-tile.has-art .g, .ic-prev[data-icons="pop"].ic-prev.ic-prev .app-tile.has-art .g { display: none; }
:root[data-icons="pop"] .app-tile.has-art .art, .ic-prev[data-icons="pop"].ic-prev.ic-prev .app-tile.has-art .art { display: block; }
:root[data-icons="circle"] .app-tile, .ic-prev[data-icons="circle"].ic-prev.ic-prev .app-tile { background: var(--tile); border-radius: 50%; box-shadow: inset 0 2px 0 rgba(255,255,255,.25), 0 2px 6px rgba(0,0,0,.25); filter: none; }
:root[data-icons="circle"] .app-tile .g, .ic-prev[data-icons="circle"].ic-prev.ic-prev .app-tile .g { display: block; stroke: #fff; filter: none; }
:root[data-icons="circle"] .app-tile .art, .ic-prev[data-icons="circle"].ic-prev.ic-prev .app-tile .art { display: none; }
:root[data-icons="mono"] .app-tile, .ic-prev[data-icons="mono"].ic-prev.ic-prev .app-tile { background: var(--surface-3); border-radius: 24%; box-shadow: inset 0 0 0 1px var(--border); filter: none; }
:root[data-icons="mono"] .app-tile .g, .ic-prev[data-icons="mono"].ic-prev.ic-prev .app-tile .g { display: block; stroke: var(--text); filter: none; }
:root[data-icons="mono"] .app-tile .art, .ic-prev[data-icons="mono"].ic-prev.ic-prev .app-tile .art { display: none; }
:root[data-icons="dark"] .app-tile, .ic-prev[data-icons="dark"].ic-prev.ic-prev .app-tile { background: linear-gradient(160deg, var(--tile-a, #2c303b), var(--tile-b, #15171d)); border-radius: 24%; box-shadow: inset 0 0 0 1px rgba(255,255,255,.09), inset 0 1px 0 rgba(255,255,255,.1), 0 2px 8px rgba(0,0,0,.35); filter: none; }
:root[data-icons="dark"] .app-tile .g, .ic-prev[data-icons="dark"].ic-prev.ic-prev .app-tile .g { display: block; stroke: var(--glyph, #e5e7eb); filter: none; }
:root[data-icons="dark"] .app-tile.file-tile .g, .ic-prev[data-icons="dark"].ic-prev.ic-prev .app-tile.file-tile .g { stroke: #60a5fa; }
:root[data-icons="dark"] .app-tile .art, .ic-prev[data-icons="dark"].ic-prev.ic-prev .app-tile .art { display: none; }
:root[data-icons="color"] .app-tile, .ic-prev[data-icons="color"].ic-prev.ic-prev .app-tile { background: var(--tile); border-radius: 24%; box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 2px 6px rgba(0,0,0,.22); filter: none; }
:root[data-icons="color"] .app-tile.file-tile, .ic-prev[data-icons="color"].ic-prev.ic-prev .app-tile.file-tile { background: linear-gradient(160deg, #ffffff, #dfe5ef); }
:root[data-icons="color"] .app-tile .g, .ic-prev[data-icons="color"].ic-prev.ic-prev .app-tile .g { display: block; stroke: #fff; filter: none; }
:root[data-icons="color"] .app-tile.file-tile .g, .ic-prev[data-icons="color"].ic-prev.ic-prev .app-tile.file-tile .g { stroke: #3b82f6; }
:root[data-icons="color"] .app-tile .art, .ic-prev[data-icons="color"].ic-prev.ic-prev .app-tile .art { display: none; }

/* ---------- 3. Boot / Lock / Power ---------- */
#boot {
  position: fixed; inset: 0; z-index: 30000; background: #05060a; color: #fff;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  transition: opacity .6s ease, visibility 0s linear 0s;
}
#boot.hidden { opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .6s ease, visibility 0s linear .6s; }
.boot-logo { width: 84px; height: 84px; color: var(--accent); filter: drop-shadow(0 0 28px rgba(var(--accent-rgb), .6)); animation: bootPulse 2s ease-in-out infinite; }
.boot-logo svg { width: 100%; height: 100%; }
.boot-name { font-size: 34px; font-weight: 700; letter-spacing: -.5px; text-transform: lowercase; }
.boot-name span { color: var(--accent); }
.boot-track { width: 220px; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .12); overflow: hidden; margin-top: 10px; }
#boot-bar { height: 100%; width: 0; border-radius: 4px; background: linear-gradient(90deg, var(--accent), #48b9c7); transition: width .15s linear; }
#boot-status { font-size: 12.5px; color: rgba(255, 255, 255, .55); min-height: 18px; }
@keyframes bootPulse { 50% { transform: scale(.94); opacity: .8; } }

#lock {
  position: fixed; inset: 0; z-index: 20000; color: #fff; overflow: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  padding: 11vh 20px 7vh; cursor: pointer;
  transition: opacity .5s ease, transform .6s var(--ease), visibility 0s 0s;
}
#lock::before { content: ""; position: absolute; inset: -40px; background: var(--wp); background-size: cover; background-position: center; filter: blur(22px) brightness(.72); z-index: -1; }
#lock.hidden { opacity: 0; transform: translateY(-40px); visibility: hidden; pointer-events: none; transition: opacity .5s ease, transform .6s var(--ease), visibility 0s .6s; }
.lock-top { text-align: center; text-shadow: 0 2px 20px rgba(0, 0, 0, .3); }
#lock-time { font-size: clamp(64px, 14vw, 120px); font-weight: 600; line-height: 1; letter-spacing: -2px; font-variant-numeric: tabular-nums; }
#lock-date { font-size: clamp(16px, 3vw, 22px); margin-top: 10px; opacity: .9; }
.lock-user { display: flex; flex-direction: column; align-items: center; gap: 12px; }
#lock-name { font-size: 22px; font-weight: 600; text-shadow: 0 2px 12px rgba(0, 0, 0, .3); }
.lock-btn {
  margin-top: 4px; padding: 9px 26px; border-radius: 22px; border: 1px solid rgba(255, 255, 255, .35);
  background: rgba(255, 255, 255, .16); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  color: #fff; font-size: 14px; cursor: pointer; transition: background .2s;
}
.lock-btn:hover { background: rgba(255, 255, 255, .28); }
.lock-hint { font-size: 13px; opacity: .7; animation: hintBlink 2.6s ease-in-out infinite; }
@keyframes hintBlink { 50% { opacity: .35; } }

#power {
  position: fixed; inset: 0; z-index: 25000; background: #05060a; color: #fff;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  transition: opacity .5s;
}
#power.hidden { opacity: 0; pointer-events: none; visibility: hidden; transition: opacity .4s, visibility 0s .4s; }
#power-text { font-size: 18px; font-weight: 300; }
#power.off .spinner, #power.off #power-text { display: none; }
.power-on {
  width: 74px; height: 74px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .25); background: transparent;
  color: rgba(255, 255, 255, .8); display: grid; place-items: center; cursor: pointer; transition: all .2s;
}
.power-on svg { width: 30px; height: 30px; }
.power-on:hover { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 30px rgba(var(--accent-rgb), .5); }
.power-caption { font-size: 13px; color: rgba(255, 255, 255, .45); }

/* Display effects */
#screen-dim { position: fixed; inset: 0; z-index: 40000; background: #000; opacity: 0; pointer-events: none; transition: opacity .2s; }
#night-light { position: fixed; inset: 0; z-index: 39999; background: #ff9a3c; mix-blend-mode: multiply; opacity: 0; pointer-events: none; transition: opacity .6s; }
#night-light.on { opacity: .28; }
#sleep { position: fixed; inset: 0; z-index: 39000; background: #000; opacity: 0; visibility: hidden; transition: opacity .6s, visibility 0s .6s; cursor: none; }
#sleep.on { opacity: 1; visibility: visible; transition: opacity .6s; }
#lock-pin { display: flex; flex-direction: column; align-items: center; gap: 8px; }
#lock-pin[hidden] { display: none; }
#pin-in { width: 220px; height: 40px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, .35); background: rgba(255, 255, 255, .15); color: #fff; text-align: center; font: 600 18px var(--font); letter-spacing: 6px; outline: none; backdrop-filter: blur(10px); }
#pin-in::placeholder { letter-spacing: 0; font-weight: 400; font-size: 14px; color: rgba(255, 255, 255, .7); }
#pin-msg { min-height: 18px; font-size: 13px; color: #ffd3d3; }
.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
#desk-clock { position: absolute; top: 28px; right: 34px; z-index: 0; text-align: right; color: #fff; pointer-events: none; text-shadow: 0 2px 16px rgba(0, 0, 0, .35); }
#desk-clock[hidden] { display: none; }
.dc-time { font-size: 72px; font-weight: 300; line-height: 1; letter-spacing: -2px; font-variant-numeric: tabular-nums; }
.dc-date { font-size: 18px; margin-top: 6px; opacity: .9; }
.window.on-top .title-text::after { content: " · on top"; font-weight: 400; color: var(--text-3); }
/* Dock size */
:root[data-dock="s"] { --dock-h: 64px; }
:root[data-dock="s"] .tb-btn { width: 42px; height: 42px; }
:root[data-dock="s"] .tb-btn .app-tile { width: 32px; height: 32px; }
:root[data-dock="l"] { --dock-h: 90px; }
:root[data-dock="l"] .tb-btn { width: 64px; height: 64px; }
:root[data-dock="l"] .tb-btn .app-tile { width: 50px; height: 50px; }

/* ---------- 4. Desktop ---------- */
#wallpaper { position: fixed; inset: 0; background: var(--wp); background-size: cover; background-position: center; }
#desktop { position: fixed; inset: var(--panel-h) var(--dock-wr, 0px) var(--dock-h) var(--dock-w, 0px); z-index: 1; }
#icons { position: absolute; inset: 0; }
#icons.refreshing .d-icon { animation: iconRefresh .4s ease; }
@keyframes iconRefresh { 0% { opacity: 0; transform: scale(.9); } }
.d-icon {
  position: absolute; width: 88px; padding: 8px 2px 6px; border-radius: 10px;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  border: 1px solid transparent; cursor: default; touch-action: none;
  transition: background .15s, left .22s var(--ease), top .22s var(--ease);
}
.d-icon:hover { background: rgba(255, 255, 255, .12); }
.d-icon.selected { background: rgba(var(--accent-rgb), .3); border-color: rgba(var(--accent-rgb), .65); }
.d-icon.dragging { transition: none; opacity: .85; z-index: 5; }
.d-icon .app-tile { width: 46px; height: 46px; pointer-events: none; }
.d-icon span {
  font-size: 12px; color: #fff; text-align: center; line-height: 1.25; text-shadow: 0 1px 3px rgba(0, 0, 0, .85);
  word-break: break-word; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; pointer-events: none;
}
#sel-rect { position: absolute; display: none; z-index: 3; pointer-events: none; border: 1px solid rgba(var(--accent-rgb), .9); background: rgba(var(--accent-rgb), .18); border-radius: 2px; }
#windows { position: absolute; inset: 0; pointer-events: none; }
#snap-preview {
  position: absolute; z-index: 2000000; pointer-events: none; opacity: 0; border-radius: 14px;
  background: rgba(var(--accent-rgb), .16); border: 2px solid rgba(var(--accent-rgb), .55);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  transition: opacity .15s, left .18s var(--ease), top .18s var(--ease), width .18s var(--ease), height .18s var(--ease);
}
#snap-preview.show { opacity: 1; }

/* ---------- 5. Windows (GTK headerbar style, Pop Shell active hint) ---------- */
.window {
  position: absolute; pointer-events: auto; display: flex; min-width: 0; min-height: 0;
  transition: transform .26s var(--ease), opacity .22s ease;
}
.win-frame {
  flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden;
  border-radius: var(--radius); background: var(--surface);
  box-shadow: 0 0 0 1px var(--win-edge), var(--shadow); transition: box-shadow .2s;
}
.window:not(.active) .win-frame { box-shadow: 0 0 0 1px var(--win-edge), var(--shadow-sm); }
/* Pop Shell "active hint": an accent border around the focused window */
:root[data-active-hint="on"] .window.active:not(.maximized) .win-frame { box-shadow: 0 0 0 3px var(--accent), var(--shadow); }
.window:not(.active) .title-text, .window:not(.active) .win-controls, .window:not(.active) .titlebar .app-tile { opacity: .55; }
.window.anim { transition: left .26s var(--ease), top .26s var(--ease), width .26s var(--ease), height .26s var(--ease), transform .26s var(--ease), opacity .22s ease; }
.window.maximized { left: 0 !important; top: 0 !important; width: 100% !important; height: 100% !important; }
.window.maximized .win-frame { border-radius: 0; }
.window.opening { animation: winOpen .3s var(--ease); }
.window.closing { animation: winClose .2s ease forwards; pointer-events: none; }
.window.minimized {
  transform: translate(var(--mx, 0px), var(--my, 400px)) scale(.12); opacity: 0; visibility: hidden; pointer-events: none;
  transition: transform .32s cubic-bezier(.4, 0, .2, 1), opacity .3s ease, visibility 0s linear .32s;
}
.window.dragging .win-frame { box-shadow: 0 0 0 3px var(--accent), 0 30px 70px rgba(0, 0, 0, .45); }
.window.tiled .rh { display: none; }
@keyframes winOpen { from { opacity: 0; transform: scale(.92) translateY(14px); } }
@keyframes winClose { to { opacity: 0; transform: scale(.94) translateY(8px); } }

.titlebar {
  position: relative; height: 44px; flex: none; display: flex; align-items: center; gap: 9px; padding: 0 9px 0 12px;
  background: var(--headerbar); border-bottom: 1px solid var(--border); touch-action: none;
}
.titlebar .app-tile { width: 20px; height: 20px; }
.titlebar .app-tile svg { width: 70%; height: 70%; stroke-width: 2.3; }
.title-text {
  position: absolute; left: 50%; transform: translateX(-50%); max-width: calc(100% - 230px);
  font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none;
}
.win-controls { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.wc { width: 24px; height: 24px; border-radius: 50%; border: none; background: var(--wc-bg); color: var(--text); display: grid; place-items: center; cursor: pointer; transition: background .12s, color .12s; }
.wc svg { width: 12px; height: 12px; stroke-width: 2.6; }
.wc:hover { background: var(--active); }
.wc.close:hover { background: var(--accent); color: var(--on-accent); }
.win-body { flex: 1; min-height: 0; position: relative; overflow: hidden; display: flex; flex-direction: column; background: var(--surface); container-type: inline-size; }
.rh { position: absolute; z-index: 3; touch-action: none; }
.rh.n { top: -4px; left: 10px; right: 10px; height: 8px; cursor: ns-resize; }
.rh.s { bottom: -4px; left: 10px; right: 10px; height: 8px; cursor: ns-resize; }
.rh.e { right: -4px; top: 10px; bottom: 10px; width: 8px; cursor: ew-resize; }
.rh.w { left: -4px; top: 10px; bottom: 10px; width: 8px; cursor: ew-resize; }
.rh.ne { top: -5px; right: -5px; width: 15px; height: 15px; cursor: nesw-resize; }
.rh.nw { top: -5px; left: -5px; width: 15px; height: 15px; cursor: nwse-resize; }
.rh.se { bottom: -5px; right: -5px; width: 15px; height: 15px; cursor: nwse-resize; }
.rh.sw { bottom: -5px; left: -5px; width: 15px; height: 15px; cursor: nesw-resize; }
.window.maximized .rh { display: none; }
.app-error { padding: 24px; color: #f06e6e; font-size: 13px; }

/* ---------- 6. Top panel & dock ---------- */
#panel {
  position: fixed; top: 0; left: 0; right: 0; height: var(--panel-h); z-index: 10000;
  display: flex; align-items: center; padding: 0 4px; background: var(--panel-bg); color: #f2f0ee;
  font-size: 13.5px; font-weight: 500;
}
.pn-left, .pn-right { flex: 1; display: flex; align-items: center; gap: 2px; min-width: 0; }
.pn-right { justify-content: flex-end; }
.pn-btn {
  height: 26px; padding: 0 12px; border: none; border-radius: 13px; background: transparent; color: inherit;
  font: inherit; cursor: pointer; display: flex; align-items: center; gap: 9px; white-space: nowrap; transition: background .15s;
}
.pn-btn:hover { background: rgba(255, 255, 255, .12); }
.pn-btn.on { background: rgba(255, 255, 255, .2); }
.pn-btn svg { width: 16px; height: 16px; }
.pn-btn.pn-icon { padding: 0 9px; }
#pn-tile.on { color: var(--accent); }
#pn-clock { flex: none; font-variant-numeric: tabular-nums; }
#pn-status span { display: flex; }
#pn-status span:empty { display: none; }

#dock { position: fixed; left: 50%; bottom: 8px; transform: translateX(-50%); z-index: 10000; max-width: calc(100vw - 16px); }
#dock-inner {
  display: flex; align-items: center; gap: 4px; padding: 6px; border-radius: 18px;
  background: var(--dock-bg); border: 1px solid rgba(255, 255, 255, .08); box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
  backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4);
}
.dock-sep { width: 1px; height: 36px; margin: 0 4px; flex: none; background: rgba(255, 255, 255, .14); }
#tb-apps { display: flex; align-items: center; gap: 4px; overflow-x: auto; scrollbar-width: none; }
#tb-apps::-webkit-scrollbar { display: none; }
.tb-btn {
  position: relative; width: 52px; height: 52px; flex: none; border-radius: 13px; border: none; background: transparent;
  display: grid; place-items: center; cursor: pointer; transition: background .15s;
}
.tb-btn:hover { background: rgba(255, 255, 255, .1); }
.tb-btn .app-tile { width: 40px; height: 40px; border-radius: 11px; transition: transform .18s var(--ease); }
.tb-btn:hover .app-tile { transform: translateY(-2px) scale(1.05); }
.tb-btn:active .app-tile { transform: scale(.88); }
.tb-btn::after {
  content: ""; position: absolute; bottom: 1px; left: 50%; width: 0; height: 4px; border-radius: 4px;
  background: #d8d4d0; transform: translateX(-50%); transition: width .2s var(--ease), background .2s;
}
.tb-btn.running::after { width: 5px; }
.tb-btn.active::after { width: 14px; background: var(--accent); }
.tb-btn.on { background: rgba(255, 255, 255, .14); }
.tb-btn.launch .app-tile { animation: tbBounce .5s var(--ease); }
@keyframes tbBounce { 40% { transform: translateY(-8px); } }

.popover {
  position: fixed; z-index: 10005; padding: 12px; border-radius: 14px; border: 1px solid var(--glass-border);
  background: var(--menu-bg); box-shadow: var(--shadow); color: var(--text);
  opacity: 0; transform: translateY(-6px); visibility: hidden; pointer-events: none;
  transition: opacity .16s, transform .16s var(--ease), visibility 0s .16s;
}
.popover.open { opacity: 1; transform: none; visibility: visible; pointer-events: auto; transition: opacity .16s, transform .16s var(--ease); }

/* System menu (top right) */
#sys-menu { top: calc(var(--panel-h) + 6px); right: 6px; width: 340px; display: flex; flex-direction: column; gap: 10px; }
.sys-row { display: flex; align-items: center; gap: 10px; }
.sys-row input { flex: 1; }
#vol-val { width: 34px; text-align: right; font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.qs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.qs { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: none; border-radius: 22px; background: var(--wc-bg); cursor: pointer; text-align: left; min-width: 0; transition: background .15s; }
.qs:hover { box-shadow: inset 0 0 0 100px var(--hover); }
.qs.on { background: var(--accent); color: var(--on-accent); }
.qs.on small { color: inherit; opacity: .8; }
.qs svg { width: 17px; height: 17px; flex: none; }
.qs b { display: block; font-size: 13px; font-weight: 600; }
.qs small { display: block; font-size: 11.5px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qs > span:last-child { min-width: 0; }
.sys-sep { height: 1px; background: var(--border); margin: 0 -4px; }
.sys-item { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border: none; border-radius: 8px; background: transparent; cursor: pointer; text-align: left; font-size: 13.5px; margin: -4px 0; }
.sys-item:hover { background: var(--hover); }
.sys-item svg { width: 16px; height: 16px; color: var(--text-2); }
.sys-item .si, .qs-ico, .pn-ico { display: flex; }
.sys-batt { margin-left: auto; font-size: 12px; color: var(--text-2); }

/* Calendar + notifications (under the clock) */
#cal-pop { top: calc(var(--panel-h) + 6px); left: 50%; width: min(640px, calc(100vw - 12px)); margin-left: max(-320px, calc(-50vw + 6px)); display: flex; gap: 14px; padding: 14px; }
.cal-notes { flex: 1.2; min-width: 0; display: flex; flex-direction: column; }
.cal-h { display: flex; align-items: center; justify-content: space-between; font-weight: 600; margin-bottom: 8px; }
#notif-list { flex: 1; max-height: 330px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
.notif { display: flex; gap: 10px; padding: 9px 10px; border-radius: 10px; background: var(--wc-bg); font-size: 12.5px; }
.notif svg { width: 16px; height: 16px; flex: none; color: var(--accent); margin-top: 1px; }
.notif b { display: block; font-weight: 600; }
.notif small { color: var(--text-2); }
.notif-empty { flex: 1; display: grid; place-items: center; color: var(--text-3); font-size: 13px; padding: 40px 0; text-align: center; }
.cal-side { width: 260px; flex: none; display: flex; flex-direction: column; gap: 8px; border-left: 1px solid var(--border); padding-left: 14px; }
#cal-dow { font-size: 12.5px; color: var(--text-2); }
#cal-date { font-size: 18px; font-weight: 600; }
.cal-nav { display: flex; align-items: center; justify-content: space-between; }
.cal-nav b { font-size: 13px; }
.cal-nav .icon-btn { width: 28px; height: 28px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.cal-grid .dow { color: var(--text-3); font-size: 11px; font-weight: 600; padding: 4px 0; }
.cal-grid .d { padding: 6px 0; border-radius: 50%; aspect-ratio: 1; display: grid; place-items: center; }
.cal-grid .d.other { color: var(--text-3); opacity: .55; }
.cal-grid .d.today { background: var(--accent); color: var(--on-accent); font-weight: 700; }
@media (max-width: 620px) { #cal-pop { flex-direction: column; } .cal-side { width: auto; border-left: none; padding-left: 0; } }

/* ---------- 7. App Library (applications launcher) ---------- */
#start-menu {
  position: fixed; left: 50%; top: calc(var(--panel-h) + (100vh - var(--panel-h) - var(--dock-h)) / 2); z-index: 10001;
  width: min(780px, calc(100vw - 20px)); height: min(600px, calc(100vh - var(--panel-h) - var(--dock-h) - 24px));
  display: flex; flex-direction: column; border-radius: 18px; border: 1px solid var(--glass-border);
  background: var(--glass-strong); box-shadow: var(--shadow);
  backdrop-filter: blur(30px) saturate(1.4); -webkit-backdrop-filter: blur(30px) saturate(1.4);
  opacity: 0; visibility: hidden; pointer-events: none; transform: translate(-50%, -50%) scale(.96);
  transition: opacity .18s ease, transform .22s var(--ease), visibility 0s .22s;
}
#start-menu.open { opacity: 1; visibility: visible; pointer-events: auto; transform: translate(-50%, -50%); transition: opacity .18s ease, transform .22s var(--ease); }
.sm-search { margin: 20px auto 6px; width: min(420px, calc(100% - 40px)); display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 16px; border-radius: 19px; background: var(--input-bg); border: 1px solid var(--border); }
.sm-search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--accent-rgb), .22); }
.sm-search svg { width: 16px; height: 16px; color: var(--text-2); }
.sm-search input { flex: 1; border: none; outline: none; background: transparent; color: var(--text); font: inherit; }
.sm-scroll { flex: 1; overflow-y: auto; padding: 4px 22px 12px; }
.sm-head { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .6px; color: var(--text-2); margin: 16px 8px 8px; }
.sm-head em { font-style: normal; font-weight: 500; color: var(--text-3); }
.sm-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding: 6px 22px 2px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 14px; border: 1px solid var(--border); background: transparent; cursor: pointer; font-size: 12.5px; transition: background .12s; }
.chip:hover { background: var(--hover); }
.chip .n { font-size: 11px; color: var(--text-3); }
.chip.on { background: var(--accent); border-color: transparent; color: var(--on-accent); }
.chip.on .n { color: inherit; opacity: .7; }
.sm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); gap: 6px; }
.sm-app { display: flex; flex-direction: column; align-items: center; gap: 9px; padding: 14px 4px 12px; border-radius: 12px; border: none; background: transparent; cursor: pointer; font-size: 12.5px; text-align: center; transition: background .12s; }
.sm-app:hover, .sm-app.kbd { background: var(--hover); }
.sm-app.kbd { box-shadow: inset 0 0 0 2px var(--accent); }
.sm-app .app-tile { width: 56px; height: 56px; border-radius: 15px; }
.sm-get { opacity: .85; }
.sm-get small { display: inline-flex; align-items: center; gap: 4px; margin-top: -4px; font-size: 11px; color: var(--accent); }
.sm-get small svg { width: 12px; height: 12px; }
.sm-empty { padding: 30px; text-align: center; color: var(--text-2); font-size: 13px; grid-column: 1 / -1; }
.sm-recent { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 4px; }
.sm-file { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 10px; border: none; background: transparent; cursor: pointer; text-align: left; transition: background .12s; min-width: 0; }
.sm-file:hover, .sm-file.kbd { background: var(--hover); }
.sm-file .app-tile { width: 32px; height: 32px; border-radius: 8px; }
.sm-file b { display: block; font-weight: 500; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sm-file small { color: var(--text-2); font-size: 11.5px; }
.sm-file > div { min-width: 0; }
.sm-foot { display: flex; align-items: center; justify-content: space-between; padding: 10px 22px; border-top: 1px solid var(--border); }
.sm-user { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 10px; border: none; background: transparent; cursor: pointer; font-size: 13px; }
.sm-user:hover { background: var(--hover); }
.sm-power-wrap { position: relative; }
#power-menu { position: absolute; right: 0; bottom: 46px; min-width: 180px; padding: 5px; }
#power-menu button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 8px 10px; border: none; border-radius: 8px; background: transparent; cursor: pointer; font-size: 13px; text-align: left; }
#power-menu button:hover { background: var(--hover); }
#power-menu svg { width: 16px; height: 16px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; flex: none; color: #fff; font-weight: 600; font-size: 14px; background: linear-gradient(135deg, var(--accent), #48b9c7); box-shadow: 0 2px 8px rgba(0, 0, 0, .2); }
.avatar.xl { width: 112px; height: 112px; font-size: 44px; box-shadow: 0 10px 40px rgba(0, 0, 0, .35); border: 3px solid rgba(255, 255, 255, .35); }
.avatar.lg { width: 64px; height: 64px; font-size: 26px; }

/* Workspaces overview */
#overview {
  position: fixed; inset: var(--panel-h) 0 0 0; z-index: 9500; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 18px; padding: 30px 20px calc(var(--dock-h) + 20px); background: rgba(12, 11, 10, .55); color: #f2f0ee;
  backdrop-filter: blur(16px) saturate(1.2); -webkit-backdrop-filter: blur(16px) saturate(1.2);
  opacity: 0; visibility: hidden; transition: opacity .2s, visibility 0s .2s;
}
#overview.open { opacity: 1; visibility: visible; transition: opacity .2s; }
.ov-title { font-size: 15px; font-weight: 600; }
.ov-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; max-width: 1100px; max-height: 100%; overflow-y: auto; padding: 6px; }
.ov-card {
  position: relative; width: 220px; height: 150px; border-radius: 14px; padding: 16px 12px 12px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center;
  background: rgba(51, 49, 48, .92); border: 1px solid rgba(255, 255, 255, .08); box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
  transition: transform .15s var(--ease), box-shadow .15s; animation: pop .22s var(--ease);
}
.ov-card:hover { transform: translateY(-3px); box-shadow: 0 0 0 3px var(--accent), 0 14px 34px rgba(0, 0, 0, .4); }
.ov-card .app-tile { width: 56px; height: 56px; border-radius: 15px; }
.ov-card b { font-size: 13px; font-weight: 500; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ov-card small { font-size: 11.5px; color: #b3ada8; }
.ov-card.min { opacity: .65; }
.ov-close { position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border-radius: 50%; border: none; background: rgba(255, 255, 255, .12); color: #fff; display: grid; place-items: center; cursor: pointer; opacity: 0; transition: opacity .15s; }
.ov-close svg { width: 12px; height: 12px; stroke-width: 2.6; }
.ov-card:hover .ov-close { opacity: 1; }
.ov-close:hover { background: var(--accent); color: var(--on-accent); }
.ov-empty { color: #b3ada8; font-size: 14px; }
.ov-hint { font-size: 12px; color: #b3ada8; }

/* ---------- 8. Context menu, notifications, dialogs, alt-tab ---------- */
.ctx {
  position: fixed; z-index: 10010; min-width: 210px; padding: 6px; border-radius: 12px; border: 1px solid var(--glass-border);
  background: var(--menu-bg); box-shadow: var(--shadow); font-size: 13.5px;
  animation: pop .13s var(--ease); max-height: 70vh; overflow-y: auto;
}
@keyframes pop { from { opacity: 0; transform: scale(.96) translateY(-4px); } }
.ctx-item { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 7px; cursor: default; white-space: nowrap; }
.ctx-item:hover { background: var(--hover); }
.ctx-item svg, .ctx-blank { width: 16px; height: 16px; flex: none; }
.ctx-item span { flex: 1; }
.ctx-item kbd { font: 11.5px var(--font); color: var(--text-3); }
.ctx-item.danger { color: #f06e6e; }
.ctx-item.disabled { opacity: .4; pointer-events: none; }
.ctx-sep { height: 1px; background: var(--border); margin: 4px 6px; }
.ctx-title { padding: 6px 10px 4px; font-size: 11.5px; color: var(--text-3); font-weight: 600; }

/* GNOME-style notification banners drop from the top panel */
#toasts { position: fixed; top: calc(var(--panel-h) + 10px); left: 50%; transform: translateX(-50%); z-index: 10003; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast {
  pointer-events: auto; width: min(390px, calc(100vw - 24px)); display: flex; gap: 12px; align-items: flex-start; padding: 12px 12px 12px 14px;
  border-radius: 14px; border: 1px solid var(--glass-border); background: var(--menu-bg); box-shadow: var(--shadow);
  animation: toastIn .35s var(--ease); cursor: pointer;
}
.toast.out { animation: toastOut .25s ease forwards; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-18px) scale(.98); } }
@keyframes toastOut { to { opacity: 0; transform: translateY(-14px); } }
.toast-ico { width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center; background: rgba(var(--accent-rgb), .18); color: var(--accent); }
.toast-ico svg { width: 17px; height: 17px; }
.toast-body { flex: 1; min-width: 0; }
.toast-title { font-weight: 600; font-size: 13.5px; }
.toast-msg { font-size: 12.5px; color: var(--text-2); margin-top: 2px; line-height: 1.4; }
.toast-x { border: none; background: transparent; padding: 2px; border-radius: 5px; cursor: pointer; color: var(--text-3); }
.toast-x svg { width: 14px; height: 14px; display: block; }

.dialog-backdrop { position: fixed; inset: 0; z-index: 15000; background: rgba(0, 0, 0, .45); display: grid; place-items: center; animation: fade .15s; padding: 16px; }
.dialog-backdrop.out { animation: fadeOut .15s forwards; }
@keyframes fade { from { opacity: 0; } }
@keyframes fadeOut { to { opacity: 0; } }
.dialog {
  width: min(420px, 100%); padding: 24px; border-radius: 16px; border: 1px solid var(--glass-border);
  background: var(--menu-bg); box-shadow: var(--shadow); animation: pop .2s var(--ease); text-align: center;
}
.dialog-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
.dialog-msg { font-size: 13.5px; color: var(--text-2); line-height: 1.5; margin-bottom: 16px; }
.dialog-input { width: 100%; margin-bottom: 16px; }
.dialog-btns { display: flex; justify-content: center; gap: 8px; }
.dialog-btns .btn { flex: 1; height: 36px; }

#alttab { position: fixed; inset: 0; z-index: 12000; display: none; align-items: center; justify-content: center; pointer-events: none; padding: 20px; }
#alttab.open { display: flex; }
.at-panel {
  pointer-events: auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; padding: 16px; max-width: 900px;
  border-radius: 18px; border: 1px solid var(--glass-border); background: var(--menu-bg); box-shadow: var(--shadow); animation: pop .15s var(--ease);
}
.at-card { width: 132px; padding: 14px 8px 10px; border-radius: 12px; border: 2px solid transparent; display: flex; flex-direction: column; align-items: center; gap: 9px; cursor: pointer; font-size: 12px; text-align: center; }
.at-card span { width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.at-card.min { opacity: .6; }
.at-card.sel { border-color: var(--accent); background: rgba(var(--accent-rgb), .12); }
.switch { position: relative; width: 42px; height: 24px; flex: none; border-radius: 12px; border: none; background: var(--surface-3); cursor: pointer; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .2s var(--ease); }
.switch.on { background: var(--accent); }
.switch.on::after { transform: translateX(18px); }

/* ---------- 9. Shared controls ---------- */
.btn {
  height: 32px; padding: 0 14px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
  font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
  transition: background .12s, box-shadow .12s, transform .08s;
}
.btn:hover { box-shadow: inset 0 0 0 100px var(--hover); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); border-color: transparent; color: var(--on-accent); font-weight: 500; }
.btn.danger { background: #e5534b; border-color: transparent; color: #fff; font-weight: 500; }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12px; }
.btn:disabled { opacity: .45; pointer-events: none; }
.btn svg { width: 15px; height: 15px; }
.input {
  height: 32px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text);
  font: inherit; font-size: 13px; outline: none; min-width: 0; transition: border-color .15s, box-shadow .15s;
}
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--accent-rgb), .18); }
select.input { padding-right: 6px; }
.icon-btn { width: 32px; height: 32px; flex: none; border-radius: 7px; border: none; background: transparent; color: var(--text); display: grid; place-items: center; cursor: pointer; transition: background .12s; }
.icon-btn:hover { background: var(--hover); }
.icon-btn:active { background: var(--active); }
.icon-btn:disabled { opacity: .35; pointer-events: none; }
.icon-btn svg { width: 17px; height: 17px; }
input[type="range"] { accent-color: var(--accent); }
.toolbar { display: flex; align-items: center; gap: 4px; padding: 6px 8px; flex: none; border-bottom: 1px solid var(--border); background: var(--surface-2); }
.tbtn { height: 30px; padding: 0 10px; border-radius: 6px; border: none; background: transparent; color: var(--text); font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; flex: none; transition: background .12s; }
.tbtn:hover { background: var(--hover); }
.tbtn svg { width: 16px; height: 16px; }
.tbtn.on { background: rgba(var(--accent-rgb), .18); color: var(--accent); }
.tb-sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; flex: none; }
.tb-spacer { flex: 1; }
.statusbar { display: flex; justify-content: space-between; gap: 12px; padding: 4px 12px; flex: none; font-size: 12px; color: var(--text-2); border-top: 1px solid var(--border); background: var(--surface-2); }
.spinner { width: 38px; height: 38px; border-radius: 50%; border: 3px solid rgba(128, 128, 128, .25); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.addr { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid var(--border); background: var(--input-bg); font-size: 13px; color: var(--text-2); }
.addr:focus-within { border-color: var(--accent); }
.addr svg { width: 14px; height: 14px; flex: none; }
.addr input { flex: 1; min-width: 0; border: none; outline: none; background: transparent; color: var(--text); font: inherit; }
.addr-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
.frame-wrap { position: relative; flex: 1; min-height: 0; background: var(--surface); }
.frame-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--surface); }
.drop-hint { position: absolute; inset: 8px; z-index: 5; display: none; place-items: center; border-radius: 12px; border: 2px dashed var(--accent); background: rgba(var(--accent-rgb), .14); color: var(--text); font-size: 14px; font-weight: 500; pointer-events: none; }
body.file-drag .drop-hint { display: grid; }
.loader { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: var(--surface); transition: opacity .3s, visibility 0s 0s; font-size: 13px; color: var(--text-2); text-align: center; padding: 20px; }
.loader.done { opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .3s, visibility 0s .3s; }
.loader-hint { display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 12.5px; max-width: 360px; }

/* ---------- 10. Apps ---------- */
/* Notepad */
.np-name { margin-left: auto; width: 190px; }
.np-text { flex: 1; resize: none; border: none; outline: none; padding: 14px 16px; background: var(--surface); color: var(--text); font: 14px/1.65 var(--mono); tab-size: 4; }
@container (max-width: 520px) { .np-bar .tbtn span { display: none; } .np-name { width: 120px; } }

/* Calculator */
.calc { height: 100%; display: flex; flex-direction: column; gap: 6px; padding: 8px; background: var(--surface-2); }
.calc-display { flex: none; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end; min-height: 96px; padding: 8px 10px 4px; }
.calc-expr { font-size: 14px; color: var(--text-2); min-height: 20px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.calc-val { font-size: 44px; font-weight: 600; max-width: 100%; white-space: nowrap; overflow: hidden; font-variant-numeric: tabular-nums; }
.calc-keys { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 1fr; gap: 4px; }
.ck { border: none; border-radius: 7px; background: var(--surface); color: var(--text); font-size: 17px; cursor: pointer; box-shadow: 0 1px 0 var(--border); transition: box-shadow .1s, transform .08s; }
.ck:hover { box-shadow: inset 0 0 0 100px var(--hover); }
.ck.fn { background: var(--surface-3); font-size: 15px; }
.ck.num { font-weight: 600; }
.ck.eq { background: var(--accent); color: var(--on-accent); }
.ck.pressed, .ck:active { transform: scale(.95); }

/* Terminal */
.term { height: 100%; overflow-y: auto; padding: 10px 12px; background: var(--term-bg, #1e1c1b); color: #e8e6e3; font: 13.5px/1.5 var(--mono); cursor: text; user-select: text; -webkit-user-select: text; }
.term-out > div { white-space: pre-wrap; word-break: break-word; }
.term-line { display: flex; gap: 8px; }
.term-prompt { color: #73c48f; font-weight: 500; white-space: nowrap; }
.term-prompt b { color: #6aa7f8; font-weight: 500; }
.term-in { flex: 1; min-width: 0; padding: 0; border: none; outline: none; background: transparent; color: inherit; font: inherit; caret-color: var(--accent); }
.t-dim { color: #6b7385; } .t-err { color: #ff6b7a; } .t-ok { color: #7fdb8a; } .t-cyan { color: #5fd7ff; } .t-yel { color: #ffd166; } .t-mag { color: #c792ea; } .t-acc { color: var(--accent); }
.neo { display: flex; gap: 22px; flex-wrap: wrap; margin: 4px 0; }
.neo pre { margin: 0; font: inherit; }
.neo-blocks span { display: inline-block; width: 22px; height: 12px; }

/* Browser */
.notice { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 12px; flex: none; font-size: 12px; border-bottom: 1px solid var(--border); background: rgba(var(--accent-rgb), .1); }
.notice svg { width: 15px; height: 15px; flex: none; color: var(--accent); }
.notice span { flex: 1; }
.notice .icon-btn { width: 24px; height: 24px; }
.notice .icon-btn svg { width: 13px; height: 13px; color: var(--text-2); }
.start-page { position: absolute; inset: 0; z-index: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 56px 20px 30px; background: radial-gradient(ellipse at 50% 0%, rgba(var(--accent-rgb), .18), transparent 65%), var(--surface); }
.start-page h1 { margin: 0; font-size: 30px; font-weight: 600; }
.start-page h1 span { color: var(--accent); }
.sp-search { width: min(520px, 100%); height: 44px; border-radius: 22px; padding: 0 18px; font-size: 14px; }
.sp-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 12px; width: min(560px, 100%); }
.sp-tile { display: flex; flex-direction: column; align-items: center; gap: 9px; padding: 16px 8px 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2); cursor: pointer; font-size: 12.5px; transition: transform .15s var(--ease), box-shadow .15s; }
.sp-tile:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); }
.sp-fav { width: 42px; height: 42px; border-radius: 11px; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 18px; }
.sp-fav svg { width: 20px; height: 20px; }
.sp-note { font-size: 12px; color: var(--text-3); text-align: center; max-width: 480px; line-height: 1.5; }

/* Settings */
.settings { display: flex; height: 100%; }
.set-nav { width: 210px; flex: none; display: flex; flex-direction: column; gap: 2px; padding: 14px 8px; border-right: 1px solid var(--border); background: var(--surface-2); overflow-y: auto; }
.set-user { display: flex; align-items: center; gap: 10px; padding: 6px 10px 16px; }
.set-user b { display: block; font-size: 14px; font-weight: 600; }
.set-user small { font-size: 11.5px; color: var(--text-2); }
.set-nav button { position: relative; display: flex; align-items: center; gap: 11px; padding: 9px 12px; border: none; border-radius: 7px; background: transparent; cursor: pointer; font-size: 13.5px; text-align: left; }
.set-nav button:hover { background: var(--hover); }
.set-nav button.on { background: var(--active); }
.set-nav button.on::before { content: ""; position: absolute; left: 0; top: 30%; bottom: 30%; width: 3px; border-radius: 3px; background: var(--accent); }
.set-nav button svg { width: 17px; height: 17px; flex: none; }
.set-main { flex: 1; min-width: 0; overflow-y: auto; padding: 22px 26px 30px; }
.set-main h2 { margin: 0 0 16px; font-size: 22px; font-weight: 600; }
.set-card { padding: 14px 16px; margin-bottom: 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.set-label { font-size: 14px; font-weight: 500; }
.set-label.big { font-size: 20px; font-weight: 600; }
.set-desc { font-size: 12px; color: var(--text-2); margin-top: 2px; }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 9px; background: var(--surface-3); }
.seg button { display: flex; align-items: center; gap: 6px; padding: 6px 14px; border: none; border-radius: 7px; background: transparent; cursor: pointer; font-size: 13px; color: var(--text-2); }
.seg button svg { width: 15px; height: 15px; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 4px rgba(0, 0, 0, .15); }
.swatches { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 12px; }
.swatch { position: relative; width: 30px; height: 30px; border-radius: 50%; border: none; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12); transition: transform .12s; }
.swatch:hover { transform: scale(1.1); }
.swatch.on { box-shadow: 0 0 0 2px var(--surface-2), 0 0 0 4px var(--text); }
.swatch.custom { background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red); overflow: hidden; }
.swatch.custom input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.wp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; margin-top: 12px; }
.wp-thumb { position: relative; aspect-ratio: 16 / 10; border-radius: 8px; border: 2px solid transparent; cursor: pointer; overflow: hidden; background-size: cover !important; background-position: center !important; transition: transform .15s var(--ease); }
.wp-thumb:hover { transform: scale(1.03); }
.wp-thumb.on { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--accent-rgb), .3); }
.wp-thumb span { position: absolute; left: 7px; bottom: 5px; font-size: 11px; color: #fff; text-shadow: 0 1px 3px #000; }
.acct { display: flex; align-items: center; gap: 18px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; font-size: 13px; margin-top: 10px; }
.kv span:nth-child(odd) { color: var(--text-2); }
.about-head { display: flex; align-items: center; gap: 14px; }
.about-head .start-logo { width: 44px; height: 44px; color: var(--accent); }
@container (max-width: 600px) {
  .set-nav { width: 58px; padding: 14px 6px; }
  .set-nav button span, .set-user > div { display: none; }
  .set-user { padding: 6px 4px 14px; justify-content: center; }
  .set-main { padding: 16px; }
}

/* Settings: stacked rows, icon styles, layouts */
.set-stack .set-row + .set-row { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
.set-text { flex: 1; min-width: 200px; }
.set-range { width: 200px; }
.set-card select.input { min-width: 170px; }
.danger-card { border-color: rgba(229, 83, 75, .45); }
.icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 14px; }
.icon-style, .layout-card { display: flex; flex-direction: column; gap: 4px; padding: 10px; border-radius: 12px; border: 2px solid transparent; background: var(--surface); cursor: pointer; text-align: left; transition: transform .12s var(--ease); }
.icon-style:hover, .layout-card:hover { transform: translateY(-2px); }
.icon-style.on, .layout-card.on { border-color: var(--accent); }
.icon-style b, .layout-card b { font-size: 13px; font-weight: 600; margin-top: 4px; }
.icon-style small, .layout-card small { font-size: 11.5px; color: var(--text-2); line-height: 1.35; }
.ic-prev { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px; border-radius: 9px; background: var(--surface-2); }
.ic-prev .app-tile { width: 30px; height: 30px; }
.layout-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; margin-top: 14px; }

/* Colour scheme picker */
.scheme-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 10px; margin-top: 14px; }
.scheme { display: flex; flex-direction: column; gap: 7px; padding: 7px; border-radius: 11px; border: 2px solid transparent; background: var(--surface); cursor: pointer; text-align: left; transition: transform .12s var(--ease); }
.scheme:hover { transform: translateY(-2px); }
.scheme.on { border-color: var(--accent); }
.sc-prev { position: relative; display: block; height: 62px; border-radius: 7px; overflow: hidden; background: var(--b); box-shadow: inset 0 0 0 1px rgba(128, 128, 128, .3); }
.sc-prev::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 12px; background: var(--a); }
.sc-prev::after { content: ""; position: absolute; left: 0; top: 12px; bottom: 0; width: 26%; background: var(--c); }
.sc-prev i { position: absolute; left: 34%; height: 5px; border-radius: 3px; background: var(--f); opacity: .85; }
.sc-prev i:nth-child(1) { top: 20px; width: 50%; }
.sc-prev i:nth-child(2) { top: 30px; width: 34%; opacity: .45; }
.sc-prev i:nth-child(3) { top: 42px; width: 24px; height: 11px; border-radius: 4px; background: var(--x); opacity: 1; }
.sc-name { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Paint */
.paint { height: 100%; display: flex; flex-direction: column; }
.paint .toolbar { flex-wrap: wrap; row-gap: 6px; }
.paint-wrap { position: relative; flex: 1; min-height: 0; overflow: hidden; background: #d4d8e0; }
:root[data-theme="dark"] .paint-wrap { background: #14161c; }
.paint-wrap canvas { position: absolute; left: 0; top: 0; cursor: crosshair; touch-action: none; }
.pswatch { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--border); cursor: pointer; flex: none; padding: 0; }
.pswatch.on { box-shadow: 0 0 0 2px var(--accent); }
.color-in { width: 30px; height: 28px; padding: 0; border: none; background: transparent; cursor: pointer; flex: none; }
.size-ctl { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); }
.size-ctl input { width: 90px; }
.size-ctl span { width: 34px; font-variant-numeric: tabular-nums; }
@container (max-width: 980px) { .paint [data-act] span { display: none; } }
@container (max-width: 640px) { .paint .tbtn span { display: none; } }

/* Music */
.music { height: 100%; display: flex; }
.mu-main { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px; background: radial-gradient(ellipse at 50% 0%, rgba(var(--accent-rgb), .22), transparent 65%), var(--surface); }
.mu-art { width: 160px; height: 160px; border-radius: 20px; display: grid; place-items: center; box-shadow: var(--shadow-sm); transition: transform .4s var(--ease); }
.mu-art svg { width: 62px; height: 62px; stroke: #fff; stroke-width: 1.6; }
.music.playing .mu-art { animation: artPulse 1.6s ease-in-out infinite; }
@keyframes artPulse { 50% { transform: scale(1.04); } }
.mu-title { font-size: 18px; font-weight: 600; text-align: center; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mu-artist { font-size: 13px; color: var(--text-2); margin-top: -8px; }
.mu-viz { width: 100%; max-width: 360px; height: 54px; }
.mu-seek { width: 100%; max-width: 360px; display: flex; align-items: center; gap: 10px; font-size: 11.5px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.mu-seek input { flex: 1; }
.mu-ctrls { display: flex; align-items: center; gap: 14px; }
.mu-ctrls .icon-btn { width: 40px; height: 40px; border-radius: 50%; }
.mu-play { width: 54px !important; height: 54px !important; background: var(--accent) !important; color: var(--on-accent) !important; box-shadow: 0 6px 20px rgba(var(--accent-rgb), .45); }
.mu-play svg { width: 22px !important; height: 22px !important; }
.mu-vol { display: flex; align-items: center; gap: 8px; width: 100%; max-width: 220px; color: var(--text-2); }
.mu-vol svg { width: 16px; height: 16px; flex: none; }
.mu-vol input { flex: 1; }
.mu-side { width: 260px; flex: none; display: flex; flex-direction: column; border-left: 1px solid var(--border); background: var(--surface-2); }
.mu-side h4 { margin: 0; padding: 14px 14px 6px; font-size: 13px; }
.mu-list { flex: 1; overflow-y: auto; padding: 4px 6px; }
.mu-item { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 8px; cursor: pointer; font-size: 13px; }
.mu-item:hover { background: var(--hover); }
.mu-item.on { background: rgba(var(--accent-rgb), .16); }
.mu-item .app-tile { width: 32px; height: 32px; border-radius: 8px; }
.mu-item .app-tile svg { width: 50%; height: 50%; }
.mu-item .mu-meta { flex: 1; min-width: 0; }
.mu-item b { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mu-item small { color: var(--text-2); font-size: 11.5px; }
.mu-item .icon-btn { width: 24px; height: 24px; opacity: 0; }
.mu-item:hover .icon-btn { opacity: 1; }
.mu-item .icon-btn svg { width: 13px; height: 13px; }
.mu-add { display: flex; gap: 6px; padding: 10px; border-top: 1px solid var(--border); }
.mu-add .input { flex: 1; }
@container (max-width: 620px) {
  .music { flex-direction: column; }
  .mu-side { width: auto; height: 38%; border-left: none; border-top: 1px solid var(--border); }
  .mu-art { width: 96px; height: 96px; }
  .mu-art svg { width: 40px; height: 40px; }
  .mu-viz { height: 34px; }
}

/* Clock */
.clockapp { height: 100%; display: flex; flex-direction: column; }
.tabs { display: flex; justify-content: center; gap: 4px; padding: 8px; flex: none; border-bottom: 1px solid var(--border); background: var(--surface-2); }
.tab { padding: 7px 16px; border: none; border-radius: 7px; background: transparent; color: var(--text-2); font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 7px; }
.tab svg { width: 15px; height: 15px; }
.tab:hover { background: var(--hover); }
.tab.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 4px rgba(0, 0, 0, .12); }
.tab-panel { flex: 1; min-height: 0; overflow-y: auto; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 20px; }
.tab-panel.on { display: flex; }
.analog { position: relative; width: 180px; height: 180px; flex: none; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--border); box-shadow: inset 0 2px 12px rgba(0, 0, 0, .1), var(--shadow-sm); }
.analog .tick { position: absolute; left: 50%; top: 6px; width: 2px; height: 8px; margin-left: -1px; background: var(--text-3); transform-origin: 50% 84px; border-radius: 2px; }
.analog .tick.major { height: 12px; width: 3px; margin-left: -1.5px; background: var(--text-2); }
.hand { position: absolute; left: 50%; bottom: 50%; transform-origin: 50% 100%; border-radius: 4px; background: var(--text); }
.hand.h { width: 5px; height: 25%; margin-left: -2.5px; }
.hand.m { width: 3px; height: 36%; margin-left: -1.5px; }
.hand.s { width: 2px; height: 41%; margin-left: -1px; background: var(--accent); }
.analog .cap { position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: var(--accent); }
.big-time { font-size: 46px; font-weight: 300; font-variant-numeric: tabular-nums; line-height: 1; }
.big-date { color: var(--text-2); font-size: 14px; margin-top: -8px; }
.world { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; width: 100%; max-width: 520px; }
.world div { padding: 8px 10px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--border); font-size: 11.5px; color: var(--text-2); }
.world b { display: block; font-size: 16px; font-weight: 500; color: var(--text); font-variant-numeric: tabular-nums; }
.sw-time { font-size: 58px; font-weight: 300; font-variant-numeric: tabular-nums; line-height: 1; }
.sw-btns { display: flex; gap: 8px; }
.laps { width: 100%; max-width: 320px; max-height: 170px; overflow-y: auto; font-size: 13px; font-variant-numeric: tabular-nums; }
.laps div { display: flex; justify-content: space-between; padding: 6px 10px; border-bottom: 1px solid var(--border); }
.timer-ring { position: relative; width: 210px; height: 210px; flex: none; }
.timer-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.timer-ring circle { stroke-width: 8; fill: none; }
.timer-ring .bg { stroke: var(--surface-3); }
.timer-ring .fg { stroke: var(--accent); transition: stroke-dashoffset .2s linear; }
.timer-ring .tr-text { position: absolute; inset: 0; display: grid; place-items: center; font-size: 40px; font-weight: 300; font-variant-numeric: tabular-nums; }
.timer-inputs { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); }
.timer-inputs .input { width: 64px; text-align: center; }
.presets { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.timer-done .timer-ring { animation: ringFlash .5s ease 6; }
@keyframes ringFlash { 50% { transform: scale(1.06); filter: drop-shadow(0 0 16px var(--accent)); } }

/* Snake */
.snake { height: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px; background: var(--surface-2); }
.snake-hud { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--text-2); }
.snake-hud b { color: var(--text); font-size: 16px; margin-left: 4px; font-variant-numeric: tabular-nums; }
.snake-stage { position: relative; flex: none; touch-action: none; }
.snake-stage canvas { width: 100%; height: 100%; display: block; border-radius: 10px; }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; border-radius: 10px; background: rgba(5, 8, 15, .55); color: #fff; cursor: pointer; backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }
.overlay[hidden] { display: none; }
.overlay .o-title { font-size: 26px; font-weight: 700; margin-bottom: 6px; }
.overlay .o-sub { font-size: 13px; opacity: .85; line-height: 1.6; }
.dpad { display: none; gap: 6px; }
.dpad .btn { width: 46px; height: 40px; padding: 0; }
@media (pointer: coarse) { .dpad { display: flex; } }

/* Minesweeper */
.ms { height: 100%; overflow: auto; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px; background: var(--surface-2); }
.ms-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.ms-led { min-width: 58px; padding: 4px 8px; border-radius: 6px; background: #12141a; color: #ff5a5a; font: 600 18px var(--mono); text-align: center; letter-spacing: 1px; }
.ms-face { width: 38px; height: 38px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface); font-size: 20px; cursor: pointer; display: grid; place-items: center; }
.ms-board { display: grid; gap: 2px; padding: 6px; border-radius: 10px; background: var(--surface-3); flex: none; }
.ms-cell { width: var(--cs); height: var(--cs); border-radius: 4px; display: grid; place-items: center; font-weight: 700; font-size: calc(var(--cs) * .55); line-height: 1; cursor: pointer; background: linear-gradient(180deg, var(--surface), var(--surface-2)); box-shadow: 0 1px 0 var(--border); transition: background .1s; }
.ms-cell:hover:not(.rev) { background: rgba(var(--accent-rgb), .18); }
.ms-cell.rev { background: var(--surface-2); box-shadow: none; cursor: default; }
:root[data-theme="dark"] .ms-cell.rev { background: #1a1c24; }
.ms-cell.boom { background: #ef4444 !important; }
.ms-cell.wrong { background: rgba(239, 68, 68, .3) !important; }
.n1 { color: #2563eb; } .n2 { color: #16a34a; } .n3 { color: #dc2626; } .n4 { color: #7c3aed; } .n5 { color: #b45309; } .n6 { color: #0891b2; } .n7 { color: #374151; } .n8 { color: #6b7280; }
:root[data-theme="dark"] .n1 { color: #60a5fa; } :root[data-theme="dark"] .n2 { color: #4ade80; } :root[data-theme="dark"] .n3 { color: #f87171; } :root[data-theme="dark"] .n4 { color: #c084fc; } :root[data-theme="dark"] .n7 { color: #e5e7eb; }
.ms-help { font-size: 11.5px; color: var(--text-3); text-align: center; }

/* App Store (Pop!_Shop style) */
.store { display: flex; height: 100%; }
.st-nav { width: 210px; flex: none; display: flex; flex-direction: column; gap: 2px; padding: 12px 8px; overflow-y: auto; background: var(--surface-2); border-right: 1px solid var(--border); }
.st-nav button { position: relative; display: flex; align-items: center; gap: 11px; padding: 8px 12px; border: none; border-radius: 8px; background: transparent; cursor: pointer; font-size: 13.5px; text-align: left; }
.st-nav button:hover { background: var(--hover); }
.st-nav button.on { background: var(--active); }
.st-nav button.on::before { content: ""; position: absolute; left: 0; top: 28%; bottom: 28%; width: 3px; border-radius: 3px; background: var(--accent); }
.st-nav button[data-view="installed"] { margin-top: 10px; }
.st-nav svg { width: 17px; height: 17px; flex: none; }
.st-count { margin-left: auto; font-style: normal; font-size: 11.5px; color: var(--text-3); }
.st-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.st-top { display: flex; align-items: center; gap: 8px; padding: 10px 18px; flex: none; border-bottom: 1px solid var(--border); }
.st-search { max-width: 460px; margin: 0 auto; }
.st-back[hidden] { display: none; }
.st-body { flex: 1; overflow-y: auto; padding: 20px 22px 28px; }
.st-h { margin: 2px 0 16px; font-size: 22px; font-weight: 600; }
.st-lead { margin: -6px 0 16px; color: var(--text-2); font-size: 13.5px; line-height: 1.5; max-width: 560px; }
.st-shelf { display: flex; align-items: center; justify-content: space-between; }
.st-shelf .btn { text-transform: none; letter-spacing: 0; }
.st-sub { margin: 26px 0 10px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .7px; color: var(--text-2); }
.st-hero {
  position: relative; display: flex; align-items: center; gap: 24px; padding: 28px; border-radius: 18px; color: #fff; overflow: hidden; cursor: pointer;
  background: radial-gradient(circle at 85% 20%, rgba(255, 255, 255, .22), transparent 40%), radial-gradient(circle at 10% 110%, rgba(250, 164, 26, .45), transparent 45%), linear-gradient(120deg, #2e1065, #6d28d9 55%, #a855f7);
  box-shadow: var(--shadow-sm);
}
.st-hero .app-tile { width: 104px; height: 104px; border-radius: 26px; }
.st-hero .tag { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; opacity: .9; }
.st-hero .tag svg { width: 14px; height: 14px; }
.st-hero h3 { margin: 4px 0 0; font-size: 30px; font-weight: 700; }
.st-hero p { margin: 6px 0 14px; max-width: 540px; line-height: 1.5; opacity: .92; }
.st-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.st-card { display: flex; gap: 14px; align-items: flex-start; padding: 14px; border-radius: 14px; cursor: pointer; background: var(--surface-2); border: 1px solid var(--border); transition: transform .15s var(--ease), box-shadow .15s; }
.st-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); }
.st-card .app-tile { width: 54px; height: 54px; border-radius: 15px; }
.st-info { flex: 1; min-width: 0; }
.st-info b { display: block; font-size: 14.5px; font-weight: 600; }
.st-info small { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 3px; font-size: 12.5px; line-height: 1.4; color: var(--text-2); }
.st-act { margin-top: 10px; }
.st-progress { width: 100%; max-width: 220px; height: 6px; border-radius: 6px; overflow: hidden; background: var(--surface-3); margin-top: 6px; }
.st-progress div { height: 100%; border-radius: 6px; background: var(--accent); transition: width .09s linear; }
.st-badge { display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 10px; vertical-align: 2px; font-size: 10.5px; font-weight: 600; color: var(--text-2); background: var(--wc-bg); }
.st-detail-head { display: flex; align-items: center; gap: 22px; }
.st-detail-head .app-tile { width: 108px; height: 108px; border-radius: 28px; }
.st-detail-head h2 { margin: 0 0 4px; font-size: 28px; font-weight: 700; }
.st-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.st-actions .st-progress { width: 220px; }
.st-desc { max-width: 720px; margin-top: 24px; font-size: 14.5px; line-height: 1.6; }
.st-meta { margin-top: 18px; }
.st-form { display: flex; flex-direction: column; gap: 10px; max-width: 460px; }
.st-form .btn { align-self: flex-start; }
.st-empty { padding: 40px; text-align: center; color: var(--text-2); }
@container (max-width: 640px) {
  .st-nav { width: 56px; padding: 12px 6px; }
  .st-nav span, .st-count { display: none; }
  .st-hero { flex-direction: column; text-align: center; }
  .st-detail-head { flex-direction: column; text-align: center; }
  .st-actions { justify-content: center; }
}

/* Start menu extras */
.sm-rows { display: flex; flex-direction: column; gap: 2px; }
.sm-row { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border: none; border-radius: 10px; background: transparent; cursor: pointer; text-align: left; }
.sm-row:hover, .sm-row.kbd { background: var(--hover); }
.sm-row.kbd { box-shadow: inset 0 0 0 2px var(--accent); }
.sm-row > svg { width: 20px; height: 20px; color: var(--accent); flex: none; }
.sm-row b { display: block; font-size: 13.5px; font-weight: 600; }
.sm-row small { font-size: 11.5px; color: var(--text-2); }
.sm-quick { display: flex; gap: 2px; }
.sm-quick .icon-btn { width: 34px; height: 34px; border-radius: 9px; }

/* Sticky Notes */
.stk { height: 100%; display: flex; flex-direction: column; }
.stk-count { font-size: 12px; color: var(--text-2); padding-right: 6px; }
.stk-grid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); align-content: start; gap: 16px; padding: 18px; }
.stk-note { display: flex; flex-direction: column; min-height: 190px; border-radius: 6px; box-shadow: 0 6px 18px rgba(0, 0, 0, .25); transform: rotate(-.7deg); transition: transform .15s; }
.stk-note:nth-child(even) { transform: rotate(.8deg); }
.stk-note:focus-within { transform: none; }
.stk-bar { display: flex; align-items: center; gap: 4px; padding: 7px 8px 2px; opacity: 0; transition: opacity .15s; }
.stk-note:hover .stk-bar, .stk-note:focus-within .stk-bar { opacity: 1; }
.stk-c { width: 14px; height: 14px; padding: 0; border-radius: 50%; border: 1px solid rgba(0, 0, 0, .2); cursor: pointer; }
.stk-del { margin-left: auto; border: none; background: transparent; cursor: pointer; color: #374151; padding: 2px; }
.stk-del svg { width: 14px; height: 14px; display: block; }
.stk-note textarea { flex: 1; resize: none; border: none; outline: none; background: transparent; padding: 4px 14px 14px; color: #1f2937; font: 15px/1.5 var(--font); }

/* To-Do */
.todo { height: 100%; display: flex; flex-direction: column; }
.todo-add { display: flex; gap: 8px; padding: 14px 14px 8px; }
.todo-add .input { flex: 1; height: 38px; font-size: 14px; }
.todo-filter { margin: 0 14px 8px; align-self: flex-start; }
.todo-list { flex: 1; overflow-y: auto; padding: 0 10px; }
.todo-item { display: flex; align-items: center; gap: 10px; padding: 8px 6px; border-bottom: 1px solid var(--border); }
.todo-check { width: 22px; height: 22px; flex: none; border-radius: 50%; border: 2px solid var(--text-3); background: transparent; display: grid; place-items: center; cursor: pointer; color: var(--on-accent); padding: 0; }
.todo-check svg { width: 13px; height: 13px; stroke-width: 3; }
.todo-item.done .todo-check { background: var(--accent); border-color: var(--accent); }
.todo-text { flex: 1; font-size: 14px; cursor: pointer; word-break: break-word; }
.todo-item.done .todo-text { text-decoration: line-through; color: var(--text-3); }
.todo-del { opacity: 0; }
.todo-item:hover .todo-del { opacity: 1; }
.todo .statusbar { align-items: center; }

/* Camera */
.cam { height: 100%; display: flex; flex-direction: column; background: #000; }
.cam-view { position: relative; flex: 1; min-height: 0; display: grid; place-items: center; overflow: hidden; }
.cam-view video { max-width: 100%; max-height: 100%; }
.cam-view video.mirror { transform: scaleX(-1); }
.cam-msg { position: absolute; color: #ddd; font-size: 14px; text-align: center; padding: 20px; }
.cam-flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
.cam-flash.go { animation: camFlash .35s ease; }
@keyframes camFlash { 0% { opacity: .9; } 100% { opacity: 0; } }
.cam-bar { display: flex; align-items: center; gap: 16px; padding: 10px 14px; background: #111; color: #eee; }
.cam-bar .icon-btn { color: #eee; }
.cam-shoot { width: 54px; height: 54px; flex: none; border-radius: 50%; border: 4px solid #fff; background: #e01b24; cursor: pointer; box-shadow: 0 0 0 3px #111 inset; }
.cam-shoot:active { transform: scale(.94); }
.cam-thumbs { display: flex; gap: 6px; overflow-x: auto; flex: 1; }
.cam-thumb img { height: 46px; border-radius: 6px; display: block; }

/* Screen Recorder */
.rec { height: 100%; overflow-y: auto; display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 24px; text-align: center; }
.rec-status { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.rec-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--text-3); }
.rec.on .rec-dot { background: #e01b24; animation: hintBlink 1s infinite; }
.rec-time { font: 600 34px var(--mono); }
.rec-btns { display: flex; gap: 8px; }
.rec-video { width: 100%; max-height: 260px; border-radius: 10px; background: #000; }
.rec-dl { text-decoration: none; }

/* Keyboard Shortcuts */
.kbd-app { height: 100%; overflow-y: auto; padding: 8px 22px 22px; }
.kbd-app h3 { margin: 18px 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--text-2); }
.kbd-list > div { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13.5px; }
.kbd-list kbd { display: inline-block; min-width: 24px; padding: 2px 7px; border-radius: 6px; border: 1px solid var(--border); border-bottom-width: 2px; background: var(--surface-2); font: 12px var(--mono); text-align: center; }

/* Task Manager */
.tm { height: 100%; display: flex; flex-direction: column; }
.tm-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; padding: 12px; flex: none; }
.tm-stat { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); min-width: 0; }
.tm-stat span { font-size: 11.5px; color: var(--text-2); }
.tm-stat b { display: block; font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tm-stat canvas { display: block; width: 100%; height: 30px; margin-top: 4px; }
.tm-table { flex: 1; min-height: 0; overflow: auto; padding: 0 12px; }
.tm-table table { width: 100%; border-collapse: collapse; font-size: 13px; }
.tm-table th { position: sticky; top: 0; z-index: 1; text-align: left; font-weight: 500; font-size: 12px; color: var(--text-2); padding: 8px; border-bottom: 1px solid var(--border); background: var(--surface); }
.tm-table td { padding: 7px 8px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tm-table tr.sel td { background: rgba(var(--accent-rgb), .12); }
.tm-table tbody tr { cursor: default; }
.tm-table tbody tr:hover td { background: var(--hover); }
.tm-name { display: flex; align-items: center; gap: 10px; max-width: 280px; }
.tm-name .app-tile { width: 22px; height: 22px; border-radius: 6px; box-shadow: none; }
.tm-name span { overflow: hidden; text-overflow: ellipsis; }
.tm-empty { text-align: center; padding: 30px; color: var(--text-2); }
.tm-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; flex: none; border-top: 1px solid var(--border); background: var(--surface-2); font-size: 12px; color: var(--text-2); }
@container (max-width: 520px) { .tm-col-opt { display: none; } }

/* ---------- 10b. Desktop layouts (Pop!_OS default) ---------- */
#pn-appname { display: none; align-items: center; height: 26px; padding: 0 10px; font-weight: 700; white-space: nowrap; }
.pn-menus { display: none; }
.pn-menus .pn-btn { padding: 0 9px; font-weight: 400; }
:root[data-layout="mac"] #pn-appname, :root[data-layout="unity"] #pn-appname { display: inline-flex; }
:root[data-layout="mac"] .pn-menus, :root[data-layout="unity"] .pn-menus { display: flex; }

/* Windows + ChromeOS: bottom taskbar/shelf, tray on the right */
:root[data-layout="windows"], :root[data-layout="chromeos"] { --panel-h: 0px; --dock-h: 48px; }
:root[data-layout="windows"] #panel, :root[data-layout="chromeos"] #panel { top: auto; bottom: 0; height: 48px; padding: 0 8px; color: var(--text); background: var(--glass); border-top: 1px solid var(--glass-border); backdrop-filter: blur(28px) saturate(1.6); -webkit-backdrop-filter: blur(28px) saturate(1.6); }
:root[data-layout="windows"] .pn-btn:hover, :root[data-layout="chromeos"] .pn-btn:hover { background: var(--hover); }
:root[data-layout="windows"] .pn-btn.on, :root[data-layout="chromeos"] .pn-btn.on { background: var(--active); }
:root[data-layout="windows"] .pn-left, :root[data-layout="chromeos"] .pn-left, :root[data-layout="windows"] #pn-tile, :root[data-layout="chromeos"] #pn-tile { display: none; }
:root[data-layout="windows"] .pn-right, :root[data-layout="chromeos"] .pn-right { order: 1; }
:root[data-layout="windows"] #pn-clock { order: 2; flex-direction: column; align-items: flex-end; justify-content: center; gap: 0; height: 40px; border-radius: 6px; font-size: 12px; line-height: 1.35; }
:root[data-layout="windows"] .pn-btn, :root[data-layout="chromeos"] .pn-btn { border-radius: 6px; height: 40px; }
:root[data-layout="windows"] #dock, :root[data-layout="chromeos"] #dock { bottom: 0; z-index: 10001; }
:root[data-layout="windows"] #dock-inner, :root[data-layout="chromeos"] #dock-inner { padding: 4px; gap: 2px; border-radius: 0; border: none; background: transparent; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; }
:root[data-layout="windows"] .tb-btn, :root[data-layout="chromeos"] .tb-btn { width: 40px; height: 40px; border-radius: 6px; }
:root[data-layout="windows"] .tb-btn .app-tile, :root[data-layout="chromeos"] .tb-btn .app-tile { width: 26px; height: 26px; }
:root[data-layout="windows"] .tb-btn:hover, :root[data-layout="chromeos"] .tb-btn:hover { background: var(--hover); }
:root[data-layout="windows"] .tb-btn:hover .app-tile, :root[data-layout="chromeos"] .tb-btn:hover .app-tile { transform: none; }
:root[data-layout="windows"] .tb-btn.on, :root[data-layout="chromeos"] .tb-btn.on { background: var(--active); }
:root[data-layout="windows"] .tb-btn::after, :root[data-layout="chromeos"] .tb-btn::after { background: var(--text-3); }
:root[data-layout="windows"] .dock-sep, :root[data-layout="chromeos"] .dock-sep { display: none; }
:root[data-layout="windows"] #start-btn { order: -2; }
