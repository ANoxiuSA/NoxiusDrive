const EmojiPicker = {
  open: false,
  init() {
    this.el = h(`<div id="emoji-pick" hidden><input class="input ep-q" placeholder="Search emoji category or paste…"><div class="ep-tabs">${Object.keys(EMOJI).map(k => `<button data-cat="${k}">${EMOJI[k].split(' ')[0]}</button>`).join('')}<button data-cat="recent" title="Recent">🕘</button></div><div class="ep-grid"></div><div class="ep-foot">Click to insert · Shift+click to keep open</div></div>`);
    document.body.appendChild(this.el);
    this.cat = 'Smileys';
    this.el.addEventListener('pointerdown', e => { if (!e.target.closest('input')) e.preventDefault(); });   // keep focus in the text field you're typing in
    this.el.addEventListener('click', e => {
      const c = e.target.closest('[data-cat]'); if (c) { this.cat = c.dataset.cat; this.render(); return; }
      const em = e.target.closest('[data-e]'); if (em) { this.insert(em.dataset.e); if (!e.shiftKey) this.hide(); }
    });
    $('.ep-q', this.el).addEventListener('input', () => this.render());
    $('.ep-q', this.el).addEventListener('keydown', e => { if (e.key === 'Escape') { e.stopPropagation(); this.hide(); } });
    document.addEventListener('pointerdown', e => { if (this.open && !e.target.closest('#emoji-pick')) this.hide(); }, true);
  },
  render() {
    const q = $('.ep-q', this.el).value.trim().toLowerCase();
    let list = this.cat === 'recent' ? Store.get('emoji.recent', []) : EMOJI[this.cat].split(' ');
    if (q) list = Object.entries(EMOJI).filter(([k]) => k.toLowerCase().includes(q)).flatMap(([, v]) => v.split(' '));
    $('.ep-grid', this.el).innerHTML = list.map(e => `<button data-e="${e}">${e}</button>`).join('') || '<div class="st-empty">No emoji yet.</div>';
    $$('[data-cat]', this.el).forEach(b => b.classList.toggle('on', b.dataset.cat === this.cat && !q));
  },
  show() {
    this.target = document.activeElement && /^(TEXTAREA|INPUT)$/.test(document.activeElement.tagName) && !document.activeElement.closest('#emoji-pick') ? document.activeElement : null;
    this.open = true; this.el.hidden = false; $('.ep-q', this.el).value = ''; this.render();
    const r = this.target ? this.target.getBoundingClientRect() : { left: innerWidth / 2 - 170, bottom: innerHeight / 2 - 160 };
    Object.assign(this.el.style, { left: clamp(r.left, 8, innerWidth - 348) + 'px', top: clamp(r.bottom + 6, 8, innerHeight - 340) + 'px' });
    if (!this.target) $('.ep-q', this.el).focus();
  },
  hide() { this.open = false; this.el.hidden = true; },
  toggle() { this.open ? this.hide() : this.show(); },
  insert(e) {
    Store.set('emoji.recent', [e].concat(Store.get('emoji.recent', []).filter(x => x !== e)).slice(0, 40));
    const t = this.target;
    if (t && document.contains(t)) { t.focus(); t.setRangeText(e, t.selectionStart, t.selectionEnd, 'end'); t.dispatchEvent(new Event('input', { bubbles: true })); }
    else if (navigator.clipboard) navigator.clipboard.writeText(e).then(() => Toast.show(`${e} copied`, 'Paste it anywhere with Ctrl+V.', 'sparkle', 1400), () => {});
  }
};

/* ---- Focus mode: hide panel & dock, silence notifications, maximize the active window ---- */
const FocusMode = {
  on: false,
  toggle() {
    this.on = !this.on;
    document.documentElement.classList.toggle('focus-mode', this.on);
    if (this.on) { this._dnd = Settings.get('dnd'); Settings.set('dnd', true); if (WM.active && !WM.active.maximized) WM.maximize(WM.active); }
    else if (this._dnd === false) Settings.set('dnd', false);
    requestAnimationFrame(() => { WM.fitAll && WM.fitAll(); WM.retile(); });
    const t = $('#focus-pill'); if (t) t.hidden = !this.on;
    if (!this.on) Toast.show('Focus mode off', '', 'sparkle', 1500);
    Panel.syncSys();
  }
};

/* ---- Timers from search or Terminal: "timer 5m tea" ---- */
const Timers = {
  parse(s) { const m = String(s).trim().match(/^(\d+(?:\.\d+)?)\s*(s|sec|secs|seconds?|m|min|mins|minutes?|h|hr|hours?)?\s*(.*)$/i); if (!m) return null; const n = +m[1], u = (m[2] || 'm')[0].toLowerCase(); return { ms: n * (u === 's' ? 1000 : u === 'h' ? 3600000 : 60000), label: m[3] || '' }; },
  start(spec) {
    const t = this.parse(spec); if (!t || !t.ms) { Toast.show('Couldn’t read that timer', 'Try “timer 5m” or “timer 30s tea”.', 'clock'); return false; }
    const when = new Date(Date.now() + t.ms);
    setTimeout(() => { Toast.show(`⏰ ${t.label || 'Timer'} done`, `Set for ${fmtDuration(t.ms)}`, 'clock', 15000); [0, .3, .6, 1.2, 1.5, 1.8].forEach(x => Sound.beep(988, .18, 'square', x, .1)); }, t.ms);
    Toast.show(`Timer set · ${fmtDuration(t.ms)}`, `${t.label ? t.label + ' · ' : ''}rings at ${when.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' })}`, 'clock', 2500);
    return true;
  }
};

/* ---- Desktop pet: wanders along the bottom of the desktop ---- */
const DesktopPet = {
  PETS: [['none', 'None'], ['🐈', 'Cat'], ['🐕', 'Dog'], ['🦆', 'Duck'], ['🐧', 'Penguin'], ['🦖', 'Dino'], ['🐢', 'Turtle'], ['🦊', 'Fox'], ['🐇', 'Bunny']],
  init() { Bus.on('settings', ({ key }) => { if (key === 'desktopPet') this.apply(); }); this.apply(); },
  apply() {
    const pet = Settings.get('desktopPet');
    cancelAnimationFrame(this.raf); if (this.el) { this.el.remove(); this.el = null; }
    if (!pet || pet === 'none') return;
    this.el = h(`<div id="desk-pet" title="Pet me!">${pet}</div>`); $('#desktop').appendChild(this.el);
    let x = 100, dir = 1, speed = .6, pause = 0, jump = 0, last = 0;
    this.el.addEventListener('click', () => { jump = 1; Sound.beep(1200, .06, 'sine', 0, .06); this.el.classList.remove('love'); void this.el.offsetWidth; this.el.classList.add('love'); });
    const loop = now => {
      this.raf = requestAnimationFrame(loop);
      if (document.hidden || now - last < 33) return; last = now;
      const W = $('#desktop').clientWidth - 40;
      if (pause > 0) pause--; else { x += dir * speed; if (x < 10 || x > W) { dir *= -1; x = clamp(x, 10, W); } if (Math.random() < .004) pause = 40 + Math.random() * 120; if (Math.random() < .003) dir *= -1; }
      if (jump) jump = jump > 18 ? 0 : jump + 1;
      const y = jump ? -Math.sin(jump / 18 * Math.PI) * 40 : (pause ? 0 : -Math.abs(Math.sin(now / 120)) * 3);
      this.el.style.transform = `translate(${x}px, ${y}px) scaleX(${dir > 0 ? -1 : 1})`;
    };
    this.raf = requestAnimationFrame(loop);
  }
};

/* ---- Weather in the panel ---- */
const PanelWeather = {
  init() { Bus.on('settings', ({ key }) => { if (key === 'pnWeather') this.update(); }); this.update(); setInterval(() => this.update(), 30 * 60000); $('#pn-weather').addEventListener('click', e => { e.stopPropagation(); WM.open('forecast'); }); },
  async update() {
    const el = $('#pn-weather'), p = Store.get('weather.place', null);
    el.hidden = !Settings.get('pnWeather');
    if (el.hidden) return;
    if (!p) { el.innerHTML = '🌤️ <small>Set city</small>'; return; }
    try {
      const r = await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.lat}&longitude=${p.lon}&current=temperature_2m,weather_code&timezone=auto`)).json();
      const f = Store.get('weather.unit', 'c') === 'f', t = r.current.temperature_2m;
      el.innerHTML = `${wmo(r.current.weather_code)[1]} ${Math.round(f ? t * 9 / 5 + 32 : t)}°`; el.title = `${p.name}: ${wmo(r.current.weather_code)[0]}`;
    } catch { el.innerHTML = '🌡️ —'; }
  }
};

/* ---- Session restore & startup apps ---- */
const SessionApps = {
  init() {
    let t;
    Bus.on('wm', () => { clearTimeout(t); t = setTimeout(() => { if (Session.state === 'desktop') Store.set('session.apps', WM.list().reverse().map(w => ({ app: w.appId, ws: w.ws || 1 })).slice(0, 12)); }, 500); });
  },
  onLogin() {
    if (this.done) return; this.done = true;
    const prevWs = WM.ws;
    if (Settings.get('restoreSession')) (Store.get('session.apps', []) || []).forEach(x => { if (Apps.get(x.app) && !(Apps.get(x.app).singleton && WM.windowsOf(x.app).length)) { WM.ws = clamp(x.ws || 1, 1, WM.wsCount()); WM.open(x.app); } });
    WM.ws = prevWs;
    (Settings.get('startupApps') || []).forEach(id => { if (Apps.get(id) && !WM.windowsOf(id).length) WM.open(id); });
    WM.list().forEach(w => w.el.classList.toggle('ws-off', !WM.onWs(w)));
    WM.focusTop();
  }
};

/** Install state lives in localStorage: removed built-ins, installed catalog apps, custom websites. */
const AppStore = {
  removed() { return new Set(Store.get('store.removed', [])); },
  installedWeb() { return Store.get('store.installed', []); },
  custom() { return Store.get('store.custom', []); },
  entries() {
    const builtins = Object.entries(BUILTIN_META).filter(([id]) => Apps.reg.has(id)).map(([id, m]) => {
      const a = Apps.reg.get(id);
      return { id, name: a.name, icon: a.icon, color: a.color, cat: m.cat, desc: m.desc, system: !!m.system, featured: !!m.featured, kind: 'builtin' };
    });
    return builtins.concat(WEB_CATALOG.map(e => Object.assign({ kind: 'web' }, e)), this.custom().map(e => Object.assign({ kind: 'custom', cat: 'Web Apps' }, e)));
  },
  get(id) { return this.entries().find(e => e.id === id) || null; },
  find(q) {
    q = String(q).toLowerCase().trim();
    const all = this.entries();
    return all.find(e => e.id === q || e.name.toLowerCase() === q) || all.find(e => e.name.toLowerCase().startsWith(q) || e.id.startsWith(q)) || null;
  },
  isInstalled(e) { return e.kind === 'builtin' ? !this.removed().has(e.id) : e.kind === 'web' ? this.installedWeb().includes(e.id) : true; },
  /** Web apps run in the same embedded-site window as File Explorer and GX Launcher. */
  register(e) {
    Apps.register({
      id: e.id, name: e.name, icon: e.icon || 'globe', color: e.color, width: 1100, height: 700, minWidth: 360,
      keywords: `${e.cat || ''} ${e.desc || ''}`.toLowerCase(), webUrl: e.url, fromStore: true,
      launch(win, args) { launchWebApp(win, args, { home: e.url, label: e.name }); }
    });
  },
  /** Called once at startup, after the built-in apps are registered. */
  boot() {
    this.removed().forEach(id => { const a = Apps.reg.get(id); if (a && !(BUILTIN_META[id] || {}).system) a.removed = true; });
    const inst = this.installedWeb();
    WEB_CATALOG.filter(e => inst.includes(e.id)).forEach(e => this.register(e));
    this.custom().forEach(e => this.register(e));
  },
  install(e, opts = {}) {
    if (e.kind === 'builtin') {
      Store.set('store.removed', [...this.removed()].filter(x => x !== e.id));
      Apps.reg.get(e.id).removed = false;
    } else if (e.kind === 'web') {
      Store.set('store.installed', [...new Set(this.installedWeb().concat(e.id))]);
      this.register(e);
    }
    Bus.emit('apps');
    if (!opts.quiet) Toast.show(`${e.name} installed`, 'Find it in Applications. Right-click it there to add it to the dock or desktop.', 'download');
  },
  async uninstall(e, ask = true) {
    if (e.system || !this.isInstalled(e)) return false;
    if (ask && !(await Dialog.confirm(`Remove ${e.name}?`, e.kind === 'builtin' ? 'You can reinstall it from the App Store at any time.' : 'Its window will close. You can reinstall it from the App Store at any time.', { okText: 'Remove', danger: true }))) return false;
    WM.windowsOf(e.id).forEach(w => WM.close(w, true));
    if (Settings.get('pinned').includes(e.id)) Settings.set('pinned', Settings.get('pinned').filter(x => x !== e.id));
    Store.set('desktop.items', Desktop.keys().filter(k => k !== 'app:' + e.id));
    if (e.kind === 'builtin') { Store.set('store.removed', [...this.removed(), e.id]); Apps.reg.get(e.id).removed = true; }
    else {
      if (e.kind === 'web') Store.set('store.installed', this.installedWeb().filter(x => x !== e.id));
      else Store.set('store.custom', this.custom().filter(x => x.id !== e.id));
      Apps.reg.delete(e.id);
    }
    Bus.emit('apps');
    Toast.show(`${e.name} removed`, '', 'trash', 2200);
    return true;
  },
  /** Turn any website into an installed app. */
  addCustom(name, url) {
    name = String(name || '').trim().slice(0, 40);
    url = String(url || '').trim();
    if (url && !/^[a-z]+:/i.test(url)) url = 'https://' + url;
    let host;
    try { const u = new URL(url); if (!/^https?:$/.test(u.protocol)) throw 0; host = u.hostname; }
    catch { Toast.show('Invalid address', 'Enter a web address like https://example.com', 'info'); return null; }
    name = name || host.replace(/^www\./, '');
    const e = { id: 'site-' + Date.now().toString(36), name, url, icon: 'globe', color: STORE_COLORS[this.custom().length % STORE_COLORS.length], desc: `Website app for ${host}.` };
    Store.set('store.custom', this.custom().concat(e));
    this.register(e);
    Bus.emit('apps');
    Toast.show(`${name} added`, 'Your website is now an app in Applications.', 'download');
    return Object.assign({ kind: 'custom', cat: 'Web Apps' }, e);
  }
};

const STORE_VIEWS = [
  ['explore', 'Explore', 'star'], ['Games', 'Games', 'gamepad'], ['Productivity', 'Productivity', 'pen'], ['Creativity', 'Creativity', 'palette'],
  ['Developer', 'Developer', 'code'], ['Education', 'Education', 'book'], ['Music', 'Music & Audio', 'music'], ['Internet', 'Internet', 'globe'],
  ['Fun', 'Fun & Toys', 'sparkle'], ['Utilities', 'Utilities', 'settings'],
  ['installed', 'Installed', 'check'], ['add', 'Add a Website', 'plus']
];
Apps.register({
  id: 'store', name: 'App Store', icon: 'app-store', color: 'linear-gradient(135deg,#5eead4,#faa41a)',
  width: 1040, height: 680, minWidth: 360, singleton: true, keywords: 'shop install apps games download pop shop apt', aliases: ['shop', 'appstore', 'popshop'],
  launch(win, args) {
    let view = args.view || 'explore', detail = args.app || null, query = '';
    const installing = new Map(); // id -> progress %
    win.body.innerHTML = `<div class="store">
      <nav class="st-nav">${STORE_VIEWS.map(([id, l, ic]) => `<button data-view="${id}" title="${l}">${svg(ic)}<span>${l}</span><em class="st-count" data-count="${id}"></em></button>`).join('')}</nav>
      <div class="st-main">
        <div class="st-top"><button class="icon-btn st-back" title="Back" hidden>${svg('back')}</button><div class="addr st-search">${svg('search')}<input placeholder="Search apps and games" spellcheck="false" aria-label="Search the App Store"></div></div>
        <div class="st-body"></div>
      </div>
    </div>`;
    const body = $('.st-body', win.body), searchIn = $('.st-search input', win.body), backB = $('.st-back', win.body);

    const action = e => installing.has(e.id)
      ? `<div class="st-progress"><div data-prog="${esc(e.id)}" style="width:${installing.get(e.id)}%"></div></div>`
      : AppStore.isInstalled(e)
        ? `<button class="btn sm" data-open="${esc(e.id)}">${svg('external')}Open</button>`
        : `<button class="btn sm primary" data-install="${esc(e.id)}">${svg('download')}Install</button>`;
    const card = e => `<div class="st-card" data-detail="${esc(e.id)}" title="${esc(e.name)}">${tile(e.icon || 'globe', e.color)}
      <div class="st-info"><b>${esc(e.name)}${e.system ? '<span class="st-badge">System</span>' : ''}</b><small>${esc(e.desc || '')}</small>
      <div class="st-act">${action(e)}</div></div></div>`;
    const grid = list => list.length ? `<div class="st-grid">${list.map(card).join('')}</div>` : '<div class="st-empty">Nothing here yet.</div>';

    const views = {
      explore: all => {
        const hero = all.find(e => e.featured) || all[0];
        const pick = ids => ids.map(id => all.find(e => e.id === id)).filter(Boolean);
        const shelf = (title, ids, cat) => `<div class="st-sub st-shelf"><span>${title}</span>${cat ? `<button class="btn sm" data-view="${cat}">See all</button>` : ''}</div>${grid(pick(ids))}`;
        return `<div class="st-hero" data-detail="${esc(hero.id)}">${tile(hero.icon, hero.color)}
            <div><div class="tag">${svg('star')} Featured</div><h3>${esc(hero.name)}</h3><p>${esc(hero.desc)}</p>${action(hero)}</div></div>
          ${shelf('Popular games', ['mcclassic', 'tetris', 'g2048', 'pacman', 'dino', 'flappy'], 'Games')}
          ${shelf('Play together online', ['bloxd', 'skribbl', 'shellshock', 'smashkarts', 'diep', 'papergames'])}
          ${shelf('Puzzles & brain teasers', ['sudoku', 'mathler', 'nerdle', 'worldle', 'globle', 'nonograms'])}
          ${shelf('Idle & story games', ['candybox', 'darkroom', 'paperclips', 'planet', 'alchemy', 'sandspiel'])}
          ${shelf('Make something', ['photopea', 'excalidraw', 'pixlr', 'blockbench', 'coolors', 'sketchpad'], 'Creativity')}
          ${shelf('Make music', ['beepbox', 'audiotool', 'webamp', 'lofi', 'softmurmur', 'radiogarden'], 'Music')}
          ${shelf('Code in the browser', ['stackblitz', 'codesandbox', 'onecompiler', 'p5js', 'webvm', 'v86'], 'Developer')}
          ${shelf('Learn something', ['desmos', 'stellarium', 'ptable', 'wikipedia', 'typing10', 'gutenberg'], 'Education')}
          ${shelf('Just for fun', ['zoomquilt', 'patatap', 'weavesilk', 'thisissand', 'pointerpointer', 'uselessweb'], 'Fun')}`;
      },
      installed: all => `<h2 class="st-h">Installed</h2>${grid(all.filter(e => AppStore.isInstalled(e)))}`,
      add: () => `<h2 class="st-h">Add a Website</h2>
        <p class="st-lead">Turn any website into an app. It opens in its own window and shows up in Applications.</p>
        <form class="st-form"><input class="input" name="name" placeholder="Name (optional)" maxlength="40" spellcheck="false">
          <input class="input" name="url" placeholder="https://example.com" spellcheck="false" required>
          <button class="btn primary" type="submit">${svg('plus')}Add app</button></form>
        <p class="sp-note" style="text-align:left">Some sites refuse to be embedded (for example Google and YouTube). If yours stays blank, use the window's “Open in new tab” button.</p>
        ${AppStore.custom().length ? `<div class="st-sub">Your websites</div>${grid(AppStore.entries().filter(e => e.kind === 'custom'))}` : ''}`,
      category: (all, cat) => { const list = all.filter(e => e.cat === cat); return `<h2 class="st-h">${esc(STORE_VIEWS.find(v => v[0] === cat)[1])} <span class="st-badge">${list.length}</span></h2>${grid(list)}`; }
    };
    const renderDetail = e => {
      const pinned = Settings.get('pinned').includes(e.id), installed = AppStore.isInstalled(e);
      return `<div class="st-detail-head">${tile(e.icon || 'globe', e.color)}<div>
          <h2>${esc(e.name)}${e.system ? '<span class="st-badge">System</span>' : ''}</h2>
          <div class="set-desc">${esc(e.cat)} · ${e.kind === 'builtin' ? 'Built into SanjivramOS' : 'Web app'}</div>
          <div class="st-actions">${installing.has(e.id) ? action(e) : installed
            ? `<button class="btn primary" data-open="${esc(e.id)}">${svg('external')}Open</button>
               <button class="btn" data-pin="${esc(e.id)}">${svg('grid')}${pinned ? 'Remove from Dock' : 'Add to Dock'}</button>
               <button class="btn" data-desk="${esc(e.id)}">${svg('workspaces')}${Desktop.has('app:' + e.id) ? 'Remove from Desktop' : 'Add to Desktop'}</button>
               ${e.system ? '' : `<button class="btn" data-remove="${esc(e.id)}">${svg('trash')}Remove</button>`}`
            : `<button class="btn primary" data-install="${esc(e.id)}">${svg('download')}Install</button>`}</div>
        </div></div>
        <div class="st-desc">${esc(e.desc || '')}</div>
        <div class="kv st-meta"><span>Status</span><span>${installed ? 'Installed' : 'Not installed'}</span>
          <span>Category</span><span>${esc(e.cat)}</span>
          ${e.url ? `<span>Website</span><span>${esc(e.url)}</span>` : ''}
          <span>Size</span><span>${e.kind === 'builtin' ? 'Included with SanjivramOS' : 'Runs from the web — nothing to download'}</span></div>`;
    };
    const render = () => {
      const all = AppStore.entries();
      $$('[data-view]', win.body).forEach(b => b.classList.toggle('on', !detail && !query && b.dataset.view === view));
      $('[data-count="installed"]', win.body).textContent = all.filter(e => AppStore.isInstalled(e)).length;
      backB.hidden = !detail && !query;
      const e = detail && AppStore.get(detail);
      if (e) body.innerHTML = renderDetail(e);
      else if (query) {
        const q = query.toLowerCase();
        body.innerHTML = `<h2 class="st-h">Results for “${esc(query)}”</h2>${grid(all.filter(x => (x.name + ' ' + x.id + ' ' + (x.desc || '') + ' ' + x.cat).toLowerCase().includes(q)))}`;
      } else body.innerHTML = (views[view] || (a => views.category(a, view)))(all);
      win.setTitle(e ? `${e.name} — App Store` : 'App Store');
    };
    /** Animated "download" before the app is registered. */
    const startInstall = e => {
      if (installing.has(e.id)) return;
      installing.set(e.id, 0);
      render();
      const t = setInterval(() => {
        const p = Math.min(100, installing.get(e.id) + 7 + Math.random() * 12);
        installing.set(e.id, p);
        $$(`[data-prog="${CSS.escape(e.id)}"]`, win.body).forEach(d => { d.style.width = p + '%'; });
        if (p >= 100) { clearInterval(t); installing.delete(e.id); AppStore.install(e); }
      }, 90);
    };

    win.body.addEventListener('click', async ev => {
      const t = ev.target, find = sel => t.closest(sel);
      let b;
      if ((b = find('[data-view]'))) { view = b.dataset.view; detail = null; query = ''; searchIn.value = ''; render(); body.scrollTop = 0; return; }
      if ((b = find('[data-install]'))) { ev.stopPropagation(); const e = AppStore.get(b.dataset.install); if (e) startInstall(e); return; }
      if ((b = find('[data-open]'))) { ev.stopPropagation(); WM.open(b.dataset.open); return; }
      if ((b = find('[data-remove]'))) { const e = AppStore.get(b.dataset.remove); if (e) await AppStore.uninstall(e); return; }
      if ((b = find('[data-pin]'))) { Taskbar.togglePin(b.dataset.pin); render(); return; }
      if ((b = find('[data-desk]'))) { Desktop.toggleApp(b.dataset.desk); render(); return; }
      if (find('.st-back')) {
        if (detail) detail = null;               // detail page → back to the list / search results
        else { query = ''; searchIn.value = ''; } // search results → back to the current section
        render();
        return;
      }
      if ((b = find('[data-detail]'))) { detail = b.dataset.detail; render(); body.scrollTop = 0; }
    });
    win.body.addEventListener('submit', ev => {
      ev.preventDefault();
      const f = ev.target, e = AppStore.addCustom(f.name.value, f.url.value);
      if (e) { detail = e.id; render(); }
    });
    searchIn.addEventListener('input', () => { query = searchIn.value.trim(); detail = null; render(); });
    win.listen('apps', render);
    win.listen('settings', ({ key }) => { if (key === 'pinned' && detail) render(); });
    win.receive = a => { if (a.app) { detail = a.app; render(); } else if (a.view) { view = a.view; detail = null; render(); } };
    render();
  }
});

/* ===================== 13. Startup ===================== */
(function start() {
  FS.load();
  Theme.apply();
  AppStore.boot();   // register installed store apps, hide removed ones
  WM.init();
  Taskbar.init();
  Panel.init();
  Overview.init();
  Shell.init();
  StartMenu.init();
  Desktop.init();
  Widgets.init();
  Effects.init();
  WsDots.init();
  SnapLayouts.init();
  EmojiPicker.init();
  DesktopPet.init();
  PanelWeather.init();
  SessionApps.init();
  DynamicWallpaper.init();
  ClipHistory.init();
  $('#focus-pill').addEventListener('click', () => FocusMode.toggle());
  Schedule.init();
  Session.init();
  Keyboard.init();
  Spotlight.init();
  Screensaver.init();
  CalendarStore.watch();
  Theme.startSlideshow();
  HistoryGuard.init();
  Session.boot();
})();
</script>
