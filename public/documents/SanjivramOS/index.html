/* ---------------- App: Paint ---------------- */
Apps.register({
  id: 'paint', name: 'Paint', icon: 'app-paint', color: 'linear-gradient(135deg,#f472b6,#db2777)',
  width: 880, height: 600, minWidth: 360, keywords: 'draw sketch canvas art', aliases: ['draw'],
  launch(win) {
    // Canvas follows the theme at launch: dark paper with a light pen by default.
    const BG = Settings.get('theme') === 'light' ? '#ffffff' : Settings.get('scheme') === 'oled' ? '#000000' : '#181a21', INK = BG === '#ffffff' ? '#111827' : '#f3f4f6';
    const COLORS = ['#111827', '#ffffff', '#ef4444', '#f97316', '#facc15', '#22c55e', '#06b6d4', '#3b82f6', '#8b5cf6', '#ec4899', '#92400e', '#6b7280'];
    win.body.innerHTML = `<div class="paint">
      <div class="toolbar">
        <button class="tbtn on" data-tool="brush" title="Brush (B)">${svg('brush')}<span>Brush</span></button>
        <button class="tbtn" data-tool="eraser" title="Eraser (E)">${svg('eraser')}<span>Eraser</span></button>
        <span class="tb-sep"></span>
        <input type="color" class="color-in" value="${INK}" title="Custom color">
        ${COLORS.map(c => `<button class="pswatch" data-c="${c}" style="background:${c}" title="${c}"></button>`).join('')}
        <span class="tb-sep"></span>
        <label class="size-ctl" title="Brush size ([ and ])">Size <input type="range" min="1" max="80" value="6" class="size-in"><span class="size-val">6px</span></label>
        <span class="tb-spacer"></span>
        <button class="tbtn" data-act="open" title="Open an image (or drop one here)">${svg('image')}<span>Open</span></button>
        <button class="tbtn" data-act="undo" title="Undo (Ctrl+Z)">${svg('undo')}<span>Undo</span></button>
        <button class="tbtn" data-act="clear" title="Clear canvas">${svg('trash')}<span>Clear</span></button>
        <button class="tbtn" data-act="save" title="Save as PNG (Ctrl+S)">${svg('download')}<span>Save PNG</span></button>
      </div>
      <div class="paint-wrap"><canvas></canvas></div>
    </div>`;
    const wrap = $('.paint-wrap', win.body), cv = $('canvas', win.body), ctx = cv.getContext('2d');
    const colorIn = $('.color-in', win.body), sizeIn = $('.size-in', win.body), sizeVal = $('.size-val', win.body);
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    let W = 0, H = 0, tool = 'brush', color = INK, size = 6, drawing = false, last = null;
    const undo = [];

    /** Grow the canvas to fill the window, preserving the drawing (it never shrinks). */
    const ensureSize = () => {
      const w = Math.max(W, wrap.clientWidth), hh = Math.max(H, wrap.clientHeight);
      if (!w || !hh || (w === W && hh === H)) return;
      let old = null;
      if (W && H) { old = document.createElement('canvas'); old.width = cv.width; old.height = cv.height; old.getContext('2d').drawImage(cv, 0, 0); }
      W = w; H = hh;
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
      cv.style.width = W + 'px'; cv.style.height = H + 'px';
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = BG; ctx.fillRect(0, 0, cv.width, cv.height);
      if (old) ctx.drawImage(old, 0, 0);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    const pushUndo = () => { try { undo.push(ctx.getImageData(0, 0, cv.width, cv.height)); if (undo.length > 25) undo.shift(); } catch {} };
    const pos = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) }; };
    const stroke = (a, b) => {
      ctx.strokeStyle = tool === 'eraser' ? BG : color;
      ctx.lineWidth = tool === 'eraser' ? size * 2 : size;
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    };
    const setTool = t => { tool = t; $$('[data-tool]', win.body).forEach(b => b.classList.toggle('on', b.dataset.tool === t)); };
    const setColor = c => { color = c; colorIn.value = c; $$('.pswatch', win.body).forEach(b => b.classList.toggle('on', b.dataset.c === c)); setTool('brush'); };
    const setSize = s => { size = clamp(s, 1, 80); sizeIn.value = size; sizeVal.textContent = size + 'px'; };

    cv.addEventListener('pointerdown', e => {
      if (e.button !== 0) return;
      ensureSize(); pushUndo();
      drawing = true; last = pos(e);
      try { cv.setPointerCapture(e.pointerId); } catch {}
      stroke(last, { x: last.x + 0.01, y: last.y });
    });
    cv.addEventListener('pointermove', e => {
      if (!drawing) return;
      const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
      (evs.length ? evs : [e]).forEach(ev => { const p = pos(ev); stroke(last, p); last = p; });
    });
    const end = () => { drawing = false; };
    cv.addEventListener('pointerup', end);
    cv.addEventListener('pointercancel', end);

    /** Draw an image (File/Blob, or a data:/blob:/http URL) onto the canvas, scaled to fit. */
    const drawImage = src => {
      const isBlob = src instanceof Blob, url = isBlob ? URL.createObjectURL(src) : src, img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        ensureSize(); pushUndo();
        const k = Math.min(1, W / img.naturalWidth, H / img.naturalHeight);
        ctx.drawImage(img, (W - img.naturalWidth * k) / 2, (H - img.naturalHeight * k) / 2, img.naturalWidth * k, img.naturalHeight * k);
        if (isBlob) URL.revokeObjectURL(url);
      };
      img.onerror = () => { if (isBlob) URL.revokeObjectURL(url); Toast.show('Could not open image', 'The file or URL is not a readable image.', 'image'); };
      img.src = url;
    };
    win.onDropFiles = files => { const f = files.find(f => f.type.startsWith('image/')); if (f) drawImage(f); else Toast.show('Not an image', 'Drop a PNG, JPG, GIF, WebP or SVG.', 'image'); };
    const actions = {
      open: async () => {
        const [f] = await pickFiles('image/*');
        if (f) drawImage(f);
      },
      undo: () => { const img = undo.pop(); if (img) { ctx.putImageData(img, 0, 0); } else Toast.show('Nothing to undo', '', 'undo', 1500); },
      clear: () => { pushUndo(); ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = BG; ctx.fillRect(0, 0, cv.width, cv.height); ctx.restore(); },
      save: () => {
        cv.toBlob(b => {
          if (!b) return;
          const d = new Date();
          downloadBlob(b, `painting-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.png`);
          Toast.show('Image saved', 'Your painting was downloaded as PNG.', 'image');
        }, 'image/png');
      }
    };
    win.body.addEventListener('click', e => {
      const t = e.target.closest('[data-tool]'); if (t) { setTool(t.dataset.tool); return; }
      const s = e.target.closest('.pswatch'); if (s) { setColor(s.dataset.c); return; }
      const a = e.target.closest('[data-act]'); if (a) actions[a.dataset.act]();
    });
    colorIn.addEventListener('input', () => setColor(colorIn.value));
    sizeIn.addEventListener('input', () => setSize(+sizeIn.value));
    win.onKey = e => {
      const k = e.key.toLowerCase();
      if ((e.ctrlKey || e.metaKey) && k === 'z') { e.preventDefault(); actions.undo(); }
      else if ((e.ctrlKey || e.metaKey) && k === 's') { e.preventDefault(); actions.save(); }
      else if (!e.ctrlKey && !e.metaKey && k === 'b') setTool('brush');
      else if (!e.ctrlKey && !e.metaKey && k === 'e') setTool('eraser');
      else if (k === '[') setSize(size - 2);
      else if (k === ']') setSize(size + 2);
    };
    win.onResize = ensureSize;
    setColor(INK);
    requestAnimationFrame(ensureSize);
  }
});

/* ---------------- App: Music Player ---------------- */
/** Procedurally composed tracks, rendered live with the Web Audio API. */
const SynthTracks = (() => {
  const midi = n => 440 * Math.pow(2, (n - 69) / 12);
  const rng = seed => () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };
  const CH = { maj: [0, 4, 7], min: [0, 3, 7], maj7: [0, 4, 7, 11], min7: [0, 3, 7, 10], six: [0, 4, 7, 9] };

  function neonDrift() {
    const b = 60 / 108, notes = [], prog = [[57, 'min'], [53, 'maj'], [48, 'maj'], [55, 'maj']];
    const pat = [0, 1, 2, 3, 2, 1, 0, 1, 0, 1, 2, 3, 2, 3, 2, 1];
    for (let bar = 0; bar < 16; bar++) {
      const [root, q] = prog[Math.floor(bar / 2) % 4], tones = CH[q], t0 = bar * 4 * b;
      const ext = tones.map(x => root + 12 + x).concat(root + 24);
      for (let i = 0; i < 8; i++) notes.push({ t: t0 + i * b / 2, d: b / 2 * 0.85, f: midi(root - 12 + (i % 2 ? 12 : 0)), type: 'sawtooth', g: 0.05, lp: 900 });
      if (bar >= 2) for (let i = 0; i < 16; i++) notes.push({ t: t0 + i * b / 4, d: b / 4 * 0.75, f: midi(ext[pat[i]]), type: 'square', g: 0.022 });
      tones.forEach(x => notes.push({ t: t0, d: 4 * b, f: midi(root + x), type: 'triangle', g: 0.035, a: 0.4, sus: true }));
    }
    for (let i = 0; i < 64; i++) notes.push({ t: i * b, d: 0.22, f: 150, type: 'sine', g: 0.35, kick: true });
    return { id: 'neon', title: 'Neon Drift', artist: 'SanjivramOS Synth · Synthwave', color: 'linear-gradient(135deg,#ff4fa3,#7b5cff)', duration: 16 * 4 * b, notes };
  }
  function pixelQuest() {
    const b = 60 / 140, notes = [], R = rng(7);
    const prog = [[48, 'maj'], [53, 'maj'], [55, 'maj'], [48, 'maj'], [57, 'min'], [53, 'maj'], [55, 'maj'], [48, 'maj']];
    for (let rep = 0; rep < 2; rep++) prog.forEach(([root, q], k) => {
      const t0 = (rep * 8 + k) * 4 * b, tones = CH[q];
      for (let i = 0; i < 8; i++) notes.push({ t: t0 + i * b / 2, d: b / 2 * 0.6, f: midi(root - 12 + [0, 12, 7, 12][i % 4]), type: 'triangle', g: 0.12 });
      let t = 0;
      while (t < 4) {
        let len = R() < 0.35 ? 0.5 : R() < 0.12 ? 2 : 1;
        len = Math.min(len, 4 - t);
        if (R() > 0.12) notes.push({ t: t0 + t * b, d: len * b * 0.85, f: midi(root + 24 + tones[Math.floor(R() * 3)] + (R() < 0.15 ? 12 : 0) - (root > 52 ? 12 : 0)), type: 'square', g: 0.045 });
        t += len;
      }
    });
    return { id: 'pixel', title: 'Pixel Quest', artist: 'SanjivramOS Synth · Chiptune', color: 'linear-gradient(135deg,#22c55e,#0ea5e9)', duration: 16 * 4 * b, notes };
  }
  function stillWater() {
    const notes = [], R = rng(42), prog = [[48, 'maj7'], [45, 'min7'], [41, 'maj7'], [43, 'six']];
    const penta = [0, 2, 4, 7, 9];
    for (let i = 0; i < 8; i++) {
      const [root, q] = prog[i % 4], t0 = i * 4;
      CH[q].forEach(x => notes.push({ t: t0, d: 4.6, f: midi(root + 12 + x), type: 'sine', g: 0.05, a: 1.2, sus: true }));
      notes.push({ t: t0, d: 4.2, f: midi(root), type: 'sine', g: 0.07, a: 0.8, sus: true });
      for (let s = 0; s < 4; s += (R() < 0.5 ? 1 : 2)) {
        if (R() < 0.7) notes.push({ t: t0 + s + (R() < 0.3 ? 0.5 : 0), d: 1.6, f: midi(72 + penta[Math.floor(R() * 5)]), type: 'triangle', g: 0.04, a: 0.02 });
      }
    }
    return { id: 'still', title: 'Still Water', artist: 'SanjivramOS Synth · Ambient', color: 'linear-gradient(135deg,#06b6d4,#3b82f6)', duration: 33, notes };
  }
  return [neonDrift(), pixelQuest(), stillWater()];
})();

/** Local files and blob: URLs added this session (blob URLs can't survive a reload). */
const MusicSession = [];

Apps.register({
  id: 'music', name: 'Music Player', icon: 'app-music', color: 'linear-gradient(135deg,#fb7185,#a855f7)',
  width: 820, height: 540, minWidth: 340, minHeight: 420, singleton: true, keywords: 'audio song sound player mp3', aliases: ['music', 'player', 'audio'],
  launch(win, args) {
    win.body.innerHTML = `<div class="music">
      <div class="mu-main">
        <div class="mu-art"></div>
        <div class="mu-title"></div>
        <div class="mu-artist"></div>
        <canvas class="mu-viz"></canvas>
        <div class="mu-seek"><span class="mu-cur">0:00</span><input type="range" class="mu-pos" min="0" max="100" step="0.1" value="0"><span class="mu-dur">0:00</span></div>
        <div class="mu-ctrls">
          <button class="icon-btn" data-act="prev" title="Previous">${svg('prev')}</button>
          <button class="icon-btn mu-play" data-act="toggle" title="Play / Pause (Space)">${svg('play')}</button>
          <button class="icon-btn" data-act="next" title="Next">${svg('next')}</button>
        </div>
        <div class="mu-vol">${svg('volume')}<input type="range" class="mu-volume" min="0" max="100"></div>
      </div>
      <div class="mu-side">
        <h4>Playlist</h4>
        <div class="mu-list"></div>
        <form class="mu-add"><input class="input mu-url" placeholder="Audio URL — https://…, data:audio/… or blob:…" spellcheck="false"><button class="btn primary" title="Add to playlist">${svg('plus')}</button><button class="btn" type="button" data-act="local" title="Add audio files from your computer">${svg('folder')}</button></form>
      </div>
    </div>`;
    const root = $('.music', win.body), art = $('.mu-art', win.body), titleEl = $('.mu-title', win.body), artistEl = $('.mu-artist', win.body);
    const posIn = $('.mu-pos', win.body), curEl = $('.mu-cur', win.body), durEl = $('.mu-dur', win.body), playB = $('.mu-play', win.body);
    const volIn = $('.mu-volume', win.body), list = $('.mu-list', win.body), viz = $('.mu-viz', win.body), vctx = viz.getContext('2d');

    const urlTracks = () => Store.get('music.urls', []).map((u, i) => ({ id: 'url' + i, url: u.url, title: u.title, artist: 'Audio URL', color: 'linear-gradient(135deg,#f59e0b,#ef4444)' }));
    const allTracks = () => SynthTracks.concat(urlTracks(), MusicSession);
    let tracks = allTracks();
    let ti = 0, playing = false, offset = 0, startedAt = 0, voices = [], seeking = false, raf = 0;
    let localVol = Store.get('music.volume', 80);
    const audio = new Audio();
    audio.preload = 'metadata';

    // Synth graph: voices -> master gain -> analyser -> speakers
    let master = null, analyser = null;
    const graph = () => {
      const c = Sound.ctx();
      if (!c) return null;
      if (!master) {
        master = c.createGain(); analyser = c.createAnalyser(); analyser.fftSize = 512; analyser.smoothingTimeConstant = 0.75;
        master.connect(analyser).connect(c.destination);
      }
      master.gain.value = (localVol / 100) * Sound.volume;
      return c;
    };
    const applyVolume = () => {
      if (master) master.gain.value = (localVol / 100) * Sound.volume;
      audio.volume = clamp((localVol / 100) * Sound.volume, 0, 1);
    };
    const track = () => tracks[ti];
    const duration = () => track().url ? (isFinite(audio.duration) ? audio.duration : 0) : track().duration;
    const position = () => {
      if (track().url) return audio.currentTime || 0;
      return playing && master ? offset + (master.context.currentTime - startedAt) : offset;
    };

    const stopVoices = () => { voices.forEach(v => { try { v.stop(); } catch {} try { v.disconnect(); } catch {} }); voices = []; };
    /** Schedule every note of the synth track from `from` seconds onward. */
    const scheduleSynth = from => {
      const c = graph();
      if (!c) { Toast.show('Audio unavailable', 'This browser has no Web Audio support.', 'info'); return false; }
      stopVoices();
      startedAt = c.currentTime + 0.05;
      offset = from;
      track().notes.forEach(n => {
        if (n.t + n.d <= from) return;
        const st = startedAt + Math.max(0, n.t - from);
        const dur = n.t < from ? n.d - (from - n.t) : n.d;
        const o = c.createOscillator(), g = c.createGain();
        o.type = n.type;
        if (n.kick) { o.frequency.setValueAtTime(n.f, st); o.frequency.exponentialRampToValueAtTime(40, st + dur); }
        else o.frequency.value = n.f;
        const a = Math.min(n.a || 0.008, dur * 0.5);
        g.gain.setValueAtTime(0.0001, st);
        g.gain.linearRampToValueAtTime(n.g, st + a);
        if (n.sus) g.gain.setValueAtTime(n.g, st + Math.max(a, dur * 0.7));
        g.gain.exponentialRampToValueAtTime(0.0001, st + dur);
        if (n.lp) { const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = n.lp; o.connect(f).connect(g); }
        else o.connect(g);
        g.connect(master);
        o.start(st); o.stop(st + dur + 0.05);
        voices.push(o);
      });
      return true;
    };

    const play = () => {
      if (track().url) {
        applyVolume();
        audio.play().then(() => { playing = true; syncUI(); }).catch(() => Toast.show('Cannot play this URL', 'The file may be blocked or not an audio file.', 'music'));
        return;
      }
      if (offset >= duration()) offset = 0;
      if (scheduleSynth(offset)) { playing = true; syncUI(); }
    };
    const pause = () => {
      if (track().url) audio.pause();
      else { offset = position(); stopVoices(); }
      playing = false; syncUI();
    };
    const seek = t => {
      t = clamp(t, 0, duration() || 0);
      if (track().url) { audio.currentTime = t; return; }
      offset = t;
      if (playing) scheduleSynth(t);
    };
    const load = (i, autoplay) => {
      const wasPlaying = autoplay ?? playing;
      if (playing) pause();
      stopVoices(); audio.pause();
      ti = (i + tracks.length) % tracks.length;
      offset = 0;
      if (track().url) { audio.src = track().url; audio.load(); } else audio.removeAttribute('src');
      renderList(); syncUI();
      if (wasPlaying) play();
    };
    const syncUI = () => {
      const t = track();
      art.style.background = t.color;
      art.innerHTML = svg(t.url ? 'link' : 'music');
      titleEl.textContent = t.title; artistEl.textContent = t.artist;
      playB.innerHTML = svg(playing ? 'pause' : 'play');
      root.classList.toggle('playing', playing);
      win.setTitle(playing ? `♪ ${t.title} — Music Player` : 'Music Player');
      $$('.mu-item', list).forEach((el, i) => el.classList.toggle('on', i === ti));
    };
    const renderList = () => {
      list.innerHTML = tracks.map((t, i) => `<div class="mu-item${i === ti ? ' on' : ''}" data-i="${i}">${tile(t.url ? 'link' : 'music', t.color)}<div class="mu-meta"><b>${esc(t.title)}</b><small>${esc(t.artist)}${t.url ? '' : ' · ' + fmtTime(t.duration)}</small></div>${t.url ? `<button class="icon-btn" data-del="${i}" title="Remove">${svg('close')}</button>` : ''}</div>`).join('');
    };

    // Progress + visualizer loop
    const loop = () => {
      raf = requestAnimationFrame(loop);
      const d = duration(), p = position();
      if (!seeking) { posIn.max = d || 100; posIn.value = Math.min(p, d || 0); curEl.textContent = fmtTime(p); }
      durEl.textContent = fmtTime(d);
      if (playing && !track().url && p >= d) { offset = d; load(ti + 1, true); }
      // visualizer
      const w = viz.clientWidth, hh = viz.clientHeight;
      if (viz.width !== w * 2) { viz.width = w * 2; viz.height = hh * 2; }
      vctx.clearRect(0, 0, viz.width, viz.height);
      const bars = 32, bw = viz.width / bars;
      const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#4f8cff';
      let data = null;
      if (analyser && playing && !track().url) { data = new Uint8Array(analyser.frequencyBinCount); analyser.getByteFrequencyData(data); }
      vctx.fillStyle = accent;
      for (let i = 0; i < bars; i++) {
        let v = data ? data[Math.floor(Math.pow(i / bars, 1.8) * data.length * 0.35)] / 255 : playing ? (Math.sin(performance.now() / 180 + i * 0.6) * 0.5 + 0.5) * 0.6 : 0.04;
        const bh = Math.max(4, v * viz.height);
        vctx.globalAlpha = 0.35 + v * 0.65;
        vctx.fillRect(i * bw + 2, (viz.height - bh) / 2, bw - 4, bh);
      }
      vctx.globalAlpha = 1;
    };

    audio.addEventListener('ended', () => { playing = false; load(ti + 1, true); });
    audio.addEventListener('error', () => { if (track().url && audio.getAttribute('src')) { playing = false; syncUI(); Toast.show('Could not load audio', track().url, 'music'); } });
    posIn.addEventListener('input', () => { seeking = true; curEl.textContent = fmtTime(+posIn.value); });
    posIn.addEventListener('change', () => { seeking = false; seek(+posIn.value); });
    volIn.value = localVol;
    volIn.addEventListener('input', () => { localVol = +volIn.value; Store.set('music.volume', localVol); applyVolume(); });
    win.listen('settings', ({ key }) => { if (key === 'volume' || key === 'muted') applyVolume(); });

    win.body.addEventListener('click', e => {
      const del = e.target.closest('[data-del]');
      if (del) {
        e.stopPropagation();
        const i = +del.dataset.del, t = tracks[i];
        const wasCurrent = i === ti;
        if (wasCurrent) { pause(); audio.removeAttribute('src'); }
        if (t.session) {
          MusicSession.splice(MusicSession.indexOf(t), 1);
          if (t.owned) URL.revokeObjectURL(t.url);
        } else {
          const urls = Store.get('music.urls', []);
          urls.splice(i - SynthTracks.length, 1);
          Store.set('music.urls', urls);
        }
        tracks = allTracks();
        if (ti >= tracks.length || wasCurrent) ti = 0; else if (i < ti) ti--;
        renderList(); syncUI();
        return;
      }
      const it = e.target.closest('.mu-item');
      if (it) { load(+it.dataset.i, true); return; }
      const a = e.target.closest('[data-act]');
      if (!a) return;
      if (a.dataset.act === 'local') { pickFiles('audio/*', true).then(addFiles); return; }
      if (a.dataset.act === 'toggle') playing ? pause() : play();
      if (a.dataset.act === 'next') load(ti + 1);
      if (a.dataset.act === 'prev') { if (position() > 3) seek(0); else load(ti - 1); }
    });
    $('.mu-add', win.body).addEventListener('submit', e => {
      e.preventDefault();
      const u = $('.mu-url', win.body).value.trim();
      if (!/^(https?:|data:audio\/|data:application\/octet-stream|blob:)/i.test(u)) { Toast.show('Invalid URL', 'Use an http(s), data:audio/… or blob: URL.', 'info'); return; }
      if (isBlobUrl(u)) {
        // blob: URLs only live as long as the page that made them, so keep them for this session only.
        MusicSession.push({ id: 'blob' + Date.now(), url: u, title: 'Blob audio', artist: 'blob: URL · this session', color: 'linear-gradient(135deg,#14b8a6,#0e7490)', session: true });
      } else {
        let name = isDataUri(u) ? `Embedded audio (${shortUrl(u).replace(/^data:/, '')})` : u;
        if (!isDataUri(u)) { try { name = decodeURIComponent(new URL(u).pathname.split('/').pop()) || new URL(u).hostname; } catch {} }
        const urls = Store.get('music.urls', []);
        urls.push({ url: u, title: name.slice(0, 60) });
        Store.set('music.urls', urls);
      }
      tracks = allTracks();
      $('.mu-url', win.body).value = '';
      load(tracks.length - 1, true);
    });
    win.onKey = e => {
      if (e.key === ' ') { e.preventDefault(); playing ? pause() : play(); }
      else if (e.key === 'ArrowRight') seek(position() + 5);
      else if (e.key === 'ArrowLeft') seek(position() - 5);
      else if (e.key.toLowerCase() === 'n') load(ti + 1);
      else if (e.key.toLowerCase() === 'p') load(ti - 1);
    };
    win.onClose = () => { cancelAnimationFrame(raf); stopVoices(); audio.pause(); audio.removeAttribute('src'); if (master) { try { master.disconnect(); analyser.disconnect(); } catch {} } };

    /** Local audio files play from blob: URLs (kept for this session). */
    function addFiles(files) {
      const audioFiles = (files || []).filter(f => f.type.startsWith('audio/') || /\.(mp3|ogg|oga|wav|m4a|aac|flac|opus|webm)$/i.test(f.name));
      if (!audioFiles.length) { if (files && files.length) Toast.show('Not audio', 'Drop or pick MP3, OGG, WAV, M4A, FLAC… files.', 'music'); return; }
      audioFiles.forEach(f => MusicSession.push({ id: 'file' + Date.now() + Math.random(), url: URL.createObjectURL(f), title: f.name.replace(/\.[^.]+$/, ''), artist: 'Local file · this session', color: 'linear-gradient(135deg,#14b8a6,#0e7490)', session: true, owned: true }));
      tracks = allTracks();
      load(tracks.length - audioFiles.length, true);
    }
    win.onDropFiles = addFiles;
    win.receive = a => { if (a.files) addFiles(a.files); };

    renderList(); syncUI(); applyVolume(); loop();
    if (args.files) addFiles(args.files);
  }
});

    const swElapsed = () => swAcc + (swRunning ? performance.now() - swStart : 0);
    const fmtSW = ms => `${pad(Math.floor(ms / 60000))}:${pad(Math.floor(ms / 1000) % 60)}.${pad(Math.floor(ms / 10) % 100)}`;
    const swSync = () => {
      q('.sw-start').innerHTML = swRunning ? `${svg('pause')}Stop` : `${svg('play')}${swAcc ? 'Resume' : 'Start'}`;
      q('.sw-lap').disabled = !swRunning;

    };

    // Timer state
    const R = 2 * Math.PI * 44, ring = q('.timer-ring .fg');
    ring.style.strokeDasharray = R;
    let tTotal = 300000, tLeft = 300000, tRunning = false, tEnd = 0;
    const fmtT = ms => { const s = Math.ceil(ms / 1000); return s >= 3600 ? `${Math.floor(s / 3600)}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}` : `${pad(Math.floor(s / 60))}:${pad(s % 60)}`; };
    const readInputs = () => { tTotal = tLeft = (clamp(+q('.t-m').value || 0, 0, 999) * 60 + clamp(+q('.t-s').value || 0, 0, 59)) * 1000; };
    const tSync = () => {

      q('.tr-text').textContent = fmtT(tLeft);

      q('.t-m').disabled = q('.t-s').disabled = tRunning;
    };
    const timerDone = () => {
      tRunning = false; tLeft = 0; tSync();
      B.querySelector('.clockapp').classList.add('timer-done');
      setTimeout(() => B.querySelector('.clockapp') && B.querySelector('.clockapp').classList.remove('timer-done'), 3200);
      Toast.show('Timer finished ⏰', `${fmtT(tTotal)} timer is done.`, 'hourglass', 6000);
      [0, 0.3, 0.6, 1.2, 1.5, 1.8].forEach(t => Sound.beep(988, 0.18, 'square', t, 0.12));
    };

    const tick = () => {
      if (tab === 'clock') {
        const d = new Date(), s = d.getSeconds() + d.getMilliseconds() / 1000, m = d.getMinutes() + s / 60, hr = (d.getHours() % 12) + m / 60;
        q('.hand.s').style.transform = `rotate(${s * 6}deg)`;
        q('.hand.m').style.transform = `rotate(${m * 6}deg)`;
        q('.hand.h').style.transform = `rotate(${hr * 30}deg)`;

      if (p) { if (tRunning) return; q('.t-m').value = p.dataset.preset; q('.t-s').value = 0; readInputs(); tSync(); return; }

        else {
          if (tLeft <= 0 || tLeft === tTotal) readInputs();
          if (tLeft <= 0) { Toast.show('Set a duration', 'Enter minutes or seconds first.', 'hourglass', 2000); return; }
          tEnd = Date.now() + tLeft; tRunning = true;
        }
        tSync(); return;
      }
      if (e.target.closest('.t-reset')) { tRunning = false; readInputs(); tSync(); }

    B.addEventListener('input', e => { if (e.target.matches('.t-m, .t-s') && !tRunning) { readInputs(); tSync(); } });
    win.onKey = e => {

      if (e.key === ' ' && tab === 'timer') { e.preventDefault(); q('.t-start').click(); }

    win.beforeClose = async () => !tRunning || Dialog.confirm('Stop the running timer?', 'Closing the Clock will cancel your timer.', { okText: 'Close anyway', danger: true });
    win.every(tick, 50);
    setTab(tab); swSync(); tSync(); tick();
  }
});

      <div class="dpad"><button class="btn" data-d="L">◀</button><button class="btn" data-d="U">▲</button><button class="btn" data-d="D">▼</button><button class="btn" data-d="R">▶</button></div>
    </div>`;
    const N = 20, stage = $('.snake-stage', win.body), cv = $('canvas', win.body), ctx = cv.getContext('2d');
    const overlay = $('.overlay', win.body), scEl = $('.sc', win.body), bsEl = $('.bs', win.body), pauseB = $('.s-pause', win.body);
    let snake, dir, queue, food, score, speed, state = 'ready', tmo, best = Store.get('snake.best', 0), size = 400;
    bsEl.textContent = best;

    const fit = () => {
      const hud = $('.snake-hud', win.body).offsetHeight, dp = $('.dpad', win.body).offsetHeight;

      cv.width = cv.height = size * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      $('.snake-hud', win.body).style.width = size + 'px';
      draw();
    };
    const placeFood = () => {
      do { food = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) }; }
      while (snake.some(s => s.x === food.x && s.y === food.y));
    };
    const reset = () => {
      snake = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
      dir = { x: 1, y: 0 }; queue = []; score = 0; speed = 140;
      scEl.textContent = 0;
      placeFood();
    };
    const showOverlay = (title, sub) => { overlay.innerHTML = `<div><div class="o-title">${title}</div><div class="o-sub">${sub}</div></div>`; overlay.hidden = false; };
    const start = () => {
      if (state === 'over' || state === 'ready') reset();
      state = 'run'; overlay.hidden = true; pauseB.textContent = 'Pause';
      loop();
    };
    const pause = () => { if (state !== 'run') return; state = 'paused'; clearTimeout(tmo); pauseB.textContent = 'Resume'; showOverlay('Paused', 'Press <b>Space</b> or click to continue'); };
    const gameOver = () => {
      state = 'over'; clearTimeout(tmo);
      const record = score > best;
      if (record) { best = score; Store.set('snake.best', best); bsEl.textContent = best; }
      showOverlay('Game over', `Score: <b>${score}</b>${record ? ' — new best! 🏆' : ''}<br>Press <b>Space</b> or click to play again`);
      Sound.beep(160, 0.35, 'sawtooth', 0, 0.12);
    };
    const step = () => {
      if (queue.length) dir = queue.shift();
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      const eating = head.x === food.x && head.y === food.y;
      const body = eating ? snake : snake.slice(0, -1);
      if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N || body.some(s => s.x === head.x && s.y === head.y)) { gameOver(); return false; }
      snake.unshift(head);
      if (eating) { score++; scEl.textContent = score; speed = Math.max(60, speed - 3); Sound.beep(740, 0.06, 'square', 0, 0.08); placeFood(); }
      else snake.pop();
      return true;
    };
    const loop = () => {
      clearTimeout(tmo);
      if (state !== 'run') return;
      if (WM.active !== win) { pause(); return; }   // auto-pause when the window loses focus
      if (step()) { draw(); tmo = setTimeout(loop, speed); }
      else draw();
    };
    const draw = () => {
      if (!snake) reset();
      const c = size / N, accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#4f8cff';
      ctx.fillStyle = '#10141d'; ctx.fillRect(0, 0, size, size);
      ctx.fillStyle = '#141a26';
      for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if ((x + y) % 2) ctx.fillRect(x * c, y * c, c, c);
      ctx.fillStyle = '#ff5370';
      ctx.beginPath(); ctx.arc(food.x * c + c / 2, food.y * c + c / 2, c * 0.36, 0, Math.PI * 2); ctx.fill();
      snake.forEach((s, i) => {
        ctx.fillStyle = i === 0 ? '#ffffff' : accent;
        ctx.globalAlpha = i === 0 ? 1 : Math.max(0.45, 1 - i / (snake.length + 8));
        const p = c * 0.08;
        if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(s.x * c + p, s.y * c + p, c - 2 * p, c - 2 * p, c * 0.28); ctx.fill(); }
        else ctx.fillRect(s.x * c + p, s.y * c + p, c - 2 * p, c - 2 * p);
      });
      ctx.globalAlpha = 1;
    };
    const turn = (x, y) => {
      if (state === 'ready' || state === 'over') start();
      else if (state === 'paused') start();
      const last = queue.length ? queue[queue.length - 1] : dir;
      if ((last.x === -x && last.y === -y) || (last.x === x && last.y === y)) return;
      if (queue.length < 3) queue.push({ x, y });
    };
    const DIRS = { ArrowUp: [0, -1], w: [0, -1], ArrowDown: [0, 1], s: [0, 1], ArrowLeft: [-1, 0], a: [-1, 0], ArrowRight: [1, 0], d: [1, 0], U: [0, -1], D: [0, 1], L: [-1, 0], R: [1, 0] };
    win.onKey = e => {
      const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
      if (DIRS[k]) { e.preventDefault(); turn(...DIRS[k]); }
      else if (k === ' ' || k === 'Enter') { e.preventDefault(); state === 'run' ? pause() : start(); }
      else if (k === 'p') state === 'run' ? pause() : state === 'paused' && start();
    };
    overlay.addEventListener('click', () => start());
    pauseB.addEventListener('click', () => (state === 'run' ? pause() : start()));
    $('.dpad', win.body).addEventListener('click', e => { const b = e.target.closest('[data-d]'); if (b) turn(...DIRS[b.dataset.d]); });
    // Swipe support for touch screens
    let sw = null;
    stage.addEventListener('pointerdown', e => { sw = { x: e.clientX, y: e.clientY }; });
    stage.addEventListener('pointerup', e => {
      if (!sw) return;

      if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
      if (Math.abs(dx) > Math.abs(dy)) turn(Math.sign(dx), 0); else turn(0, Math.sign(dy));
    });
    win.onResize = fit;
    win.onClose = () => clearTimeout(tmo);
    reset(); requestAnimationFrame(fit);
  }
});

    const board = $('.ms-board', win.body), face = $('.ms-face', win.body), minesEl = $('.ms-mines', win.body), timeEl = $('.ms-time', win.body), flagB = $('.ms-flag', win.body);
    $('.ms-level', win.body).value = lv;
    let R, C, M, cells, nodes, started, over, revealed, flags, t0, flagMode = false;

    const nb = i => { const r = Math.floor(i / C), c = i % C, out = []; for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) { if (!dr && !dc) continue; const rr = r + dr, cc = c + dc; if (rr >= 0 && rr < R && cc >= 0 && cc < C) out.push(rr * C + cc); } return out; };
    const led = n => String(clamp(n, -99, 999)).padStart(3, '0');
    const fit = () => {
      const avail = win.body.clientWidth - 40;
      const cs = clamp(Math.floor((avail - (C - 1) * 2) / C), 16, 32);
      board.style.setProperty('--cs', cs + 'px');
    };

      ({ r: R, c: C, m: M } = LV[lv]);
      cells = Array.from({ length: R * C }, () => ({ mine: false, adj: 0, rev: false, flag: false }));

      fit();
    };
    /** Mines are placed after the first click so it is always safe. */
    const placeMines = safe => {
      const banned = new Set([safe, ...(R * C - 9 >= M ? nb(safe) : [])]);
      let placed = 0;
      while (placed < M) { const i = Math.floor(Math.random() * R * C); if (!cells[i].mine && !banned.has(i)) { cells[i].mine = true; placed++; } }
      cells.forEach((c, i) => { c.adj = nb(i).filter(j => cells[j].mine).length; });
    };
    const paint = i => {
      const c = cells[i], n = nodes[i];
      n.className = 'ms-cell' + (c.rev ? ' rev' : '') + (c.rev && c.adj && !c.mine ? ' n' + c.adj : '');

      const stack = [i];
      while (stack.length) {
        const j = stack.pop(), c = cells[j];
        if (c.rev || c.flag) continue;
        c.rev = true; revealed++; paint(j);
        if (c.mine) { lose(j); return; }
        if (c.adj === 0) nb(j).forEach(k => { if (!cells[k].rev) stack.push(k); });
      }
      if (revealed === R * C - M) win_();
    };
    const lose = i => {
      over = true; face.textContent = '😵';
      cells.forEach((c, j) => {
        if (c.mine && !c.flag) { c.rev = true; paint(j); }
        if (!c.mine && c.flag) nodes[j].classList.add('wrong');
      });
      nodes[i].classList.add('boom');
      Sound.beep(110, 0.5, 'sawtooth', 0, 0.15);
    };
    const win_ = () => {
      over = true; face.textContent = '😎';
      cells.forEach((c, j) => { if (c.mine && !c.flag) { c.flag = true; paint(j); } });
      minesEl.textContent = led(0);
      const secs = Math.floor((Date.now() - t0) / 1000), key = 'ms.best.' + lv, best = Store.get(key, null);
      const record = best == null || secs < best;
      if (record) Store.set(key, secs);
      Toast.show('You win! 🎉', `${LV[lv].n} cleared in ${secs}s${record ? ' — new best time!' : ` (best ${best}s)`}`, 'flag', 5000);
      Sound.chime();
    };
    const toggleFlag = i => {
      const c = cells[i];
      if (over || c.rev) return;
      c.flag = !c.flag; flags += c.flag ? 1 : -1;
      minesEl.textContent = led(M - flags);
      paint(i);
    };
    const open = i => {
      if (over) return;
      const c = cells[i];
      if (flagMode && !c.rev) { toggleFlag(i); return; }
      if (c.flag) return;
      if (!started) { placeMines(i); started = true; t0 = Date.now(); }
      if (c.rev) { // chord: reveal neighbours when the right number of flags is placed
        if (c.adj && nb(i).filter(j => cells[j].flag).length === c.adj) nb(i).forEach(j => { if (!over && !cells[j].rev && !cells[j].flag) reveal(j); });
        return;
      }
      reveal(i);
    };

    let lpT = null, lpFired = false;
    board.addEventListener('click', e => { const n = e.target.closest('.ms-cell'); if (n && !lpFired) open(+n.dataset.i); lpFired = false; });
    board.addEventListener('contextmenu', e => { e.preventDefault(); const n = e.target.closest('.ms-cell'); if (n) toggleFlag(+n.dataset.i); });
    board.addEventListener('pointerdown', e => {
      if (over || e.button !== 0) return;
      face.textContent = '😮';
      const n = e.target.closest('.ms-cell');
      if (n && e.pointerType === 'touch') { lpFired = false; lpT = setTimeout(() => { lpFired = true; toggleFlag(+n.dataset.i); if (navigator.vibrate) navigator.vibrate(30); }, 450); }
    });
    const up = () => { clearTimeout(lpT); if (!over) face.textContent = '🙂'; };
    board.addEventListener('pointerup', up);
    board.addEventListener('pointerleave', up);
    face.addEventListener('click', newGame);
    flagB.addEventListener('click', () => { flagMode = !flagMode; flagB.classList.toggle('tbtn', false); flagB.style.background = flagMode ? 'rgba(var(--accent-rgb),.25)' : ''; flagB.style.color = flagMode ? 'var(--accent)' : ''; });
    $('.ms-level', win.body).addEventListener('change', e => {
      lv = e.target.value; Store.set('ms.level', lv); newGame();
      if (lv === 'hard' && !win.maximized && win.el.offsetWidth < 900) WM.applyRect(win.el, WM.clampRect(Object.assign(WM.rectOf(win.el), { width: 1000, height: 640 })));
    });
    win.every(() => { if (started && !over) timeEl.textContent = led(Math.floor((Date.now() - t0) / 1000)); }, 250);
    win.onResize = fit;
    win.onKey = e => { if (e.key === 'F2' || e.key.toLowerCase() === 'n') { e.preventDefault(); newGame(); } };
    newGame();
  }
});

    const rows = new Map(), cpuHist = Array(40).fill(0), MEM = { explorer: 180, browser: 160, music: 70, paint: 60 };
    let sel = null;

    const metrics = w => {
      if (w._cpu == null) { w._cpu = Math.random() * 3; w._mem = (MEM[w.appId] || 30) + Math.random() * 20; }
      const base = w.minimized ? 0.2 : w === WM.active ? 4 : 1.2;
      w._cpu = clamp(w._cpu * 0.6 + (base + Math.random() * base * 1.5) * 0.4, 0, 100);
      w._mem = clamp(w._mem + (Math.random() - 0.5) * 2, 10, 2000);
    };
    const render = () => {
      const wins = WM.list();
      rows.forEach((tr, id) => { if (!WM.wins.has(id)) { tr.remove(); rows.delete(id); if (sel === id) sel = null; } });
      wins.forEach(w => {
        let tr = rows.get(w.id);
        if (!tr) {
          tr = h(`<table><tbody><tr data-id="${w.id}"><td><div class="tm-name">${tile(w.app.icon, w.app.color)}<span></span></div></td><td class="st"></td><td class="tm-col-opt cpu"></td><td class="tm-col-opt mem"></td><td><button class="btn sm danger end">End task</button></td></tr></tbody></table>`).querySelector('tr');
          rows.set(w.id, tr);
        }
        tbody.appendChild(tr); // keeps z-order
        if (w._cpu == null) metrics(w);
        $('.tm-name span', tr).textContent = w.title;
        $('.st', tr).textContent = w === WM.active ? 'Active' : w.minimized ? 'Minimized' : 'Running';
        $('.cpu', tr).textContent = w._cpu.toFixed(1) + '%';
        $('.mem', tr).textContent = w._mem.toFixed(1) + ' MB';
        tr.classList.toggle('sel', sel === w.id);
      });
      let empty = $('.tm-empty', tbody);
      if (!wins.length && !empty) tbody.appendChild(h('<table><tbody><tr class="tm-empty"><td colspan="5" class="tm-empty">No running tasks</td></tr></tbody></table>').querySelector('tr'));
      if (wins.length && empty) empty.remove();
      endB.disabled = !sel;
      $('.tm-win', win.body).textContent = wins.length;
      $('.tm-apps', win.body).textContent = `${new Set(wins.map(w => w.appId)).size} apps`;
      const mem = wins.reduce((n, w) => n + (w._mem || 0), 120);
      $('.tm-mem', win.body).textContent = mem.toFixed(0) + ' MB';
      $('.tm-mem2', win.body).textContent = performance.memory ? `JS heap ${(performance.memory.usedJSHeapSize / 1048576).toFixed(0)} MB` : 'estimated';
    };
    const sample = () => {
      const wins = WM.list();
      wins.forEach(metrics);
      const cpu = clamp(wins.reduce((n, w) => n + w._cpu, 1 + Math.random() * 2), 0, 100);
      cpuHist.push(cpu); cpuHist.shift();
      $('.tm-cpu', win.body).textContent = cpu.toFixed(0) + '%';
      $('.tm-up', win.body).textContent = fmtDuration(Date.now() - BOOT_TIME);
      // sparkline
      const w = graph.clientWidth * 2, hh = graph.clientHeight * 2;
      if (graph.width !== w) { graph.width = w; graph.height = hh; }
      const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#4f8cff';
      gctx.clearRect(0, 0, w, hh);
      gctx.beginPath();
      cpuHist.forEach((v, i) => { const x = i / (cpuHist.length - 1) * w, y = hh - (v / 40) * hh; i ? gctx.lineTo(x, Math.max(2, y)) : gctx.moveTo(x, Math.max(2, y)); });
      gctx.strokeStyle = accent; gctx.lineWidth = 3; gctx.stroke();
      gctx.lineTo(w, hh); gctx.lineTo(0, hh); gctx.closePath();
      gctx.globalAlpha = 0.15; gctx.fillStyle = accent; gctx.fill(); gctx.globalAlpha = 1;
      render();
    };
    const endTask = id => {
      const w = WM.wins.get(id);
      if (!w) return;
      const name = w.title;
      WM.close(w, true);
      if (sel === id) sel = null;
      Toast.show('Task ended', name, 'activity', 2200);
      if (w === win) return;
      render();
    };
    tbody.addEventListener('click', e => {
      const tr = e.target.closest('tr[data-id]');
      if (!tr) return;
      if (e.target.closest('.end')) { endTask(tr.dataset.id); return; }
      sel = tr.dataset.id; render();
    });
    tbody.addEventListener('dblclick', e => { const tr = e.target.closest('tr[data-id]'); if (tr && !e.target.closest('.end')) { const w = WM.wins.get(tr.dataset.id); if (w) WM.focus(w); } });
    endB.addEventListener('click', () => sel && endTask(sel));
    $('.tm-new', win.body).addEventListener('click', async () => {
      const v = await Dialog.prompt('Run new task', 'Type the name of an app (e.g. notepad, paint, drive):', '', { okText: 'Run' });
      if (v == null) return;
      const app = Apps.find(v);
      if (app) WM.open(app.id); else Toast.show('App not found', v, 'info');
    });
    win.onKey = e => { if (e.key === 'Delete' && sel) endTask(sel); };
    win.listen('wm', render);
    win.every(sample, 1000);
    sample();
  }
});

/** Shared launcher: an embedded site with a dismissible "make the port public" notice,
 *  a help dialog and a button to change the address (Codespace URLs change when recreated). */
function codespaceUrl(c) { return Store.get(c.id + '.url', '') || c.url; }
async function codespaceHelp(c) {
  const ok = await Dialog.confirm(`Connecting to ${c.label}`,
    `${c.label} runs in a GitHub Codespace. If the window asks you to sign in to GitHub, stays blank or says the page refused to connect: 1) make sure the Codespace is running, 2) in VS Code open the Ports tab, right-click port ${c.port} → Port Visibility → Public, 3) press Reload. You can also open it in a new tab, where GitHub sign-in works.`,
    { okText: 'Open in new tab', cancelText: 'Close' });
  if (ok) window.open(codespaceUrl(c), '_blank', 'noopener');
}
function launchCodespaceApp(win, args, c) {
  const opts = {
    home: codespaceUrl(c), label: c.label,
    notice: { id: c.id, html: `${c.label} runs from your GitHub Codespace. If you see a GitHub sign-in page or nothing at all, start the Codespace and set port <b>${c.port}</b> to <b>Public</b> (Ports tab → right-click → Port Visibility).` },
    extra: [
      { act: c.id + '-url', icon: 'edit', title: `Change the ${c.label} address`, run: async frame => {
        const v = await Dialog.prompt(`${c.label} address`, `The URL of ${c.label} (for example a new Codespace address). Leave empty to use the default.`, codespaceUrl(c), { okText: 'Save' });
        if (v == null) return;
        let u = v.trim();
        if (u && !/^https?:\/\//i.test(u)) u = 'https://' + u;
        try { if (u) new URL(u); } catch { Toast.show('Invalid address', 'Enter a web address like https://example.com', 'info'); return; }
        if (!u || u === c.url) Store.remove(c.id + '.url'); else Store.set(c.id + '.url', u);
        opts.home = codespaceUrl(c);
        $('.addr-text', win.body).textContent = new URL(opts.home).host;
        frame.src = opts.home;
        Toast.show(`${c.label} address saved`, new URL(opts.home).host, 'link', 2200);
      } },
      { act: c.id + '-help', icon: 'info', title: 'Connection help', run: () => codespaceHelp(c) }
    ].concat(c.extra || [])
  };
  launchWebApp(win, args, opts);
}

/* ---------------- App: Calendar ---------------- */
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const CalendarStore = {
  all() { return Store.get('calendar.events', {}); },
  save(ev) { Store.set('calendar.events', ev); Bus.emit('calendar'); },
  /** Pop a notification when a timed event starts (checked twice a minute). */
  _fired: new Set(),
  watch() {
    setInterval(() => {
      if (Session.state !== 'desktop') return;
      const now = new Date(), key = ymd(now), hm = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
      (this.all()[key] || []).forEach(e => {
        const id = key + e.id;
        if (e.time === hm && !this._fired.has(id)) { this._fired.add(id); Toast.show(e.text, `Calendar · ${e.time}`, 'calendar', 8000); Sound.chime(); }
      });
    }, 30000);
  }
};

  }
});

/** A small Markdown renderer: headings, emphasis, code, links, images, lists, quotes, rules, tables. */
function renderMarkdown(src) {
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (m, a, u) => /^(https?:|data:image\/)/i.test(u.replace(/&amp;/g, '&')) ? `<img alt="${a}" src="${u}">` : m)
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) => /^(https?:|mailto:|#)/i.test(u) ? `<a href="${u}" target="_blank" rel="noopener">${t}</a>` : m)
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/__([^_]+)__/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>').replace(/(^|\W)_([^_\s][^_]*)_(?=\W|$)/g, '$1<em>$2</em>')
    .replace(/~~([^~]+)~~/g, '<del>$1</del>');
  const lines = String(src).replace(/\r/g, '').split('\n');
  let html = '', i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (/^```/.test(l)) { const buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]); i++; html += `<pre><code>${esc(buf.join('\n'))}</code></pre>`; continue; }
    let m;
    if ((m = l.match(/^(#{1,6})\s+(.*)$/))) { html += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; i++; continue; }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)) { html += '<hr>'; i++; continue; }
    if (/^>\s?/.test(l)) { const buf = []; while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, '')); html += `<blockquote>${renderMarkdown(buf.join('\n'))}</blockquote>`; continue; }
    if (/^\s*([-*+]|\d+\.)\s+/.test(l)) {
      const ordered = /^\s*\d+\./.test(l), buf = [];
      while (i < lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i])) buf.push(lines[i++].replace(/^\s*([-*+]|\d+\.)\s+/, ''));
      html += `<${ordered ? 'ol' : 'ul'}>${buf.map(x => { const t = x.match(/^\[( |x)\]\s+(.*)/i); return t ? `<li class="task"><input type="checkbox" disabled${t[1] !== ' ' ? ' checked' : ''}> ${inline(t[2])}</li>` : `<li>${inline(x)}</li>`; }).join('')}</${ordered ? 'ol' : 'ul'}>`;
      continue;
    }
    if (/^\|.*\|\s*$/.test(l) && i + 1 < lines.length && /^\|?\s*:?-{3,}/.test(lines[i + 1])) {
      const row = s => s.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const head = row(l); i += 2; const body = [];
      while (i < lines.length && /^\|.*\|\s*$/.test(lines[i])) body.push(row(lines[i++]));
      html += `<table><thead><tr>${head.map(c => `<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${body.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
      continue;
    }
    if (!l.trim()) { i++; continue; }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !/^(#{1,6}\s|```|>|\s*([-*+]|\d+\.)\s+)/.test(lines[i])) buf.push(lines[i++]);
    html += `<p>${buf.map(inline).join('<br>')}</p>`;
  }
  return html;
}

      if (d) { s = d / (1 - Math.abs(2 * l - 1)); hh = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; hh *= 60; if (hh < 0) hh += 360; }
      return [Math.round(hh), Math.round(s * 100), Math.round(l * 100)];

/* ---------------- App: Password Generator ---------------- */
const PASS_WORDS = 'apple river stone cloud tiger maple orbit pixel ember frost lunar delta coral amber cedar comet piano rocket meadow canyon harbor falcon willow summit lantern breeze copper velvet thunder garden marble ocean planet silver spark quartz forest glacier island jungle kettle lemon mango nectar olive pepper quiet rabbit saddle tulip umbrella valley walnut yonder zebra anchor bamboo cactus dragon eagle feather ginger hazel iris jasper koala lilac mirror noble opal pearl quill raven sable topaz unity violet wander xenon yarrow zephyr bright calm daring eager gentle happy jolly kind lively mellow proud swift brave clever'.split(' ');
Apps.register({
  id: 'passgen', name: 'Passwords', icon: 'app-pass', color: 'linear-gradient(135deg,#fde68a,#b45309)',
  width: 540, height: 520, minWidth: 320, singleton: true, keywords: 'password generator passphrase secure random security', aliases: ['password', 'passgen', 'passphrase'],
  launch(win) {
    const o = Object.assign({ mode: 'chars', len: 20, words: 5, upper: true, lower: true, digits: true, symbols: true }, Store.get('passgen', {}));
    win.body.innerHTML = `<div class="pg">
      <div class="pg-out"><code class="pg-pw"></code><button class="icon-btn" data-act="copy" title="Copy">${svg('paperclip')}</button><button class="icon-btn" data-act="gen" title="New password">${svg('reload')}</button></div>
      <div class="pg-meter"><i></i></div><div class="pg-strength set-desc"></div>
      <div class="set-card set-stack">
        <div class="set-row"><div class="set-text"><div class="set-label">Type</div></div><div class="seg"><button data-mode="chars">Password</button><button data-mode="words">Passphrase</button></div></div>
        <div class="set-row pg-chars"><div class="set-text"><div class="set-label">Length</div></div><span class="cust-range"><input type="range" min="6" max="64" data-k="len"><em></em></span></div>
        <div class="set-row pg-words"><div class="set-text"><div class="set-label">Words</div></div><span class="cust-range"><input type="range" min="3" max="10" data-k="words"><em></em></span></div>
        ${[['upper', 'Uppercase (A–Z)'], ['lower', 'Lowercase (a–z)'], ['digits', 'Numbers (0–9)'], ['symbols', 'Symbols (!@#…)']].map(([k, l]) => `<div class="set-row pg-chars"><div class="set-text"><div class="set-label">${l}</div></div><button class="switch" data-sw="${k}"></button></div>`).join('')}
      </div><p class="set-desc">Generated on your device with the browser’s secure random number generator. Nothing is stored or sent anywhere.</p></div>`;
    const rnd = n => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };
    let pw = '';
    const gen = () => {
      let bits;
      if (o.mode === 'words') {
        pw = Array.from({ length: o.words }, () => PASS_WORDS[rnd(PASS_WORDS.length)]).join('-') + '-' + rnd(100);
        bits = o.words * Math.log2(PASS_WORDS.length) + Math.log2(100);
      } else {
        const sets = [o.upper && 'ABCDEFGHJKLMNPQRSTUVWXYZ', o.lower && 'abcdefghijkmnopqrstuvwxyz', o.digits && '23456789', o.symbols && '!@#$%^&*-_=+?'].filter(Boolean);
        if (!sets.length) { o.lower = true; return gen(); }
        const all = sets.join('');
        const chars = sets.map(s => s[rnd(s.length)]);   // at least one of each chosen kind
        while (chars.length < o.len) chars.push(all[rnd(all.length)]);
        for (let i = chars.length - 1; i > 0; i--) { const j = rnd(i + 1); [chars[i], chars[j]] = [chars[j], chars[i]]; }
        pw = chars.slice(0, o.len).join('');
        bits = o.len * Math.log2(all.length);
      }
      const lvl = bits < 40 ? 0 : bits < 60 ? 1 : bits < 80 ? 2 : 3;
      $('.pg-pw', win.body).textContent = pw;
      const m = $('.pg-meter i', win.body); m.style.width = Math.min(100, bits / 1.2) + '%'; m.style.background = ['#e5534b', '#f5a524', '#73c48f', '#26a269'][lvl];
      $('.pg-strength', win.body).textContent = `${['Weak', 'Fair', 'Strong', 'Very strong'][lvl]} · about ${Math.round(bits)} bits of entropy`;
      Store.set('passgen', o);
    };
    const sync = () => {
      $$('[data-mode]', win.body).forEach(b => b.classList.toggle('on', b.dataset.mode === o.mode));
      $$('.pg-chars', win.body).forEach(r => { r.hidden = o.mode !== 'chars'; });
      $$('.pg-words', win.body).forEach(r => { r.hidden = o.mode !== 'words'; });
      $$('[data-sw]', win.body).forEach(b => b.classList.toggle('on', !!o[b.dataset.sw]));
      $$('[data-k]', win.body).forEach(r => { r.value = o[r.dataset.k]; r.nextElementSibling.textContent = o[r.dataset.k]; });
      gen();
    };
    win.body.addEventListener('click', async e => {
      const m = e.target.closest('[data-mode]'); if (m) { o.mode = m.dataset.mode; sync(); return; }
      const s = e.target.closest('[data-sw]'); if (s) { o[s.dataset.sw] = !o[s.dataset.sw]; sync(); return; }
      const b = e.target.closest('[data-act]'); if (!b) return;
      if (b.dataset.act === 'gen') gen();
      if (b.dataset.act === 'copy') { try { await navigator.clipboard.writeText(pw); Toast.show('Password copied', 'Paste it where you need it.', 'check', 1600); } catch { Toast.show('Copy failed', 'Select the password and copy it manually.', 'info'); } }
    });
    win.body.addEventListener('input', e => { if (e.target.dataset.k) { o[e.target.dataset.k] = +e.target.value; sync(); } });
    sync();
  }
});

/* ---------------- App: Piano ---------------- */
Apps.register({
  id: 'piano', name: 'Piano', icon: 'app-piano', color: 'linear-gradient(135deg,#e5e7eb,#111827)',
  width: 820, height: 380, minWidth: 360, keywords: 'piano keyboard music synth instrument play notes', aliases: ['keys', 'synth'],
  launch(win) {
    const KEYS = 'awsedftgyhujkolp;\'';   // white/black keys of a computer keyboard, from C
    const NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    let octave = 4, wave = 'triangle', sustain = false;
    const held = new Map();
    win.body.innerHTML = `<div class="pia">
      <div class="toolbar"><span class="set-desc">Octave</span><button class="icon-btn" data-act="down" title="Octave down (Z)">${svg('back')}</button><b class="pia-oct"></b><button class="icon-btn" data-act="up" title="Octave up (X)">${svg('forward')}</button><span class="tb-sep"></span>
        <div class="seg">${['sine', 'triangle', 'square', 'sawtooth'].map(w => `<button data-wave="${w}">${w[0].toUpperCase() + w.slice(1)}</button>`).join('')}</div><span class="tb-spacer"></span><button class="tbtn" data-act="sus">Sustain</button></div>
      <div class="pia-keys"></div><div class="statusbar"><span>Play with your mouse or keys A W S E D F T G Y H U J K O L P</span><span class="pia-note"></span></div></div>`;
    const keysEl = $('.pia-keys', win.body);
    const render = () => {
      let html = '', white = 0;
      for (let i = 0; i < 24; i++) {
        const n = i % 12, black = NAMES[n].includes('#');
        const label = KEYS[i] ? KEYS[i].toUpperCase() : '';
        if (black) html += `<button class="pk black" data-i="${i}" style="left:calc(${white} * (100% / 14) - 1.8%)"><small>${label}</small></button>`;
        else { html += `<button class="pk white" data-i="${i}" style="left:calc(${white} * (100% / 14))"><small>${label}</small><span>${NAMES[n]}${octave + Math.floor(i / 12)}</span></button>`; white++; }
      }
      keysEl.innerHTML = html;
      $('.pia-oct', win.body).textContent = octave;
      $$('[data-wave]', win.body).forEach(b => b.classList.toggle('on', b.dataset.wave === wave));
      $('[data-act="sus"]', win.body).classList.toggle('on', sustain);
    };
    const on = i => {
      const c = Sound.ctx(); if (!c || held.has(i)) return;
      const f = 440 * Math.pow(2, (i + (octave - 4) * 12 - 9) / 12), t = c.currentTime;
      const o = c.createOscillator(), g = c.createGain();
      o.type = wave; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25 * Math.max(Sound.volume, 0.0001) + 0.0001, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.08 * Math.max(Sound.volume, 0.0001) + 0.0001, t + 0.4);
      o.connect(g).connect(c.destination); o.start();
      held.set(i, { o, g });
      const k = $(`[data-i="${i}"]`, keysEl); if (k) k.classList.add('on');
      $('.pia-note', win.body).textContent = NAMES[i % 12] + (octave + Math.floor(i / 12)) + ` · ${f.toFixed(1)} Hz`;
    };
    const off = i => {
      const v = held.get(i); if (!v) return;
      held.delete(i);
      const c = Sound.ctx(), t = c.currentTime, rel = sustain ? 1.6 : 0.25;
      v.g.gain.cancelScheduledValues(t); v.g.gain.setValueAtTime(Math.max(v.g.gain.value, 0.0001), t); v.g.gain.exponentialRampToValueAtTime(0.0001, t + rel); v.o.stop(t + rel + 0.05);
      const k = $(`[data-i="${i}"]`, keysEl); if (k) k.classList.remove('on');
    };
    keysEl.addEventListener('pointerdown', e => { const k = e.target.closest('.pk'); if (!k) return; e.preventDefault(); on(+k.dataset.i); const up = () => { off(+k.dataset.i); document.removeEventListener('pointerup', up); }; document.addEventListener('pointerup', up); });
    win.body.addEventListener('click', e => {
      const w = e.target.closest('[data-wave]'); if (w) { wave = w.dataset.wave; render(); return; }
      const b = e.target.closest('[data-act]'); if (!b) return;
      if (b.dataset.act === 'up') octave = Math.min(7, octave + 1);
      if (b.dataset.act === 'down') octave = Math.max(1, octave - 1);
      if (b.dataset.act === 'sus') sustain = !sustain;
      render();
    });
    win.onKey = e => {
      if (e.repeat || e.ctrlKey || e.altKey) return;
      const k = e.key.toLowerCase();
      if (k === 'z') { octave = Math.max(1, octave - 1); render(); return; }
      if (k === 'x') { octave = Math.min(7, octave + 1); render(); return; }
      const i = KEYS.indexOf(k); if (i >= 0) { e.preventDefault(); on(i); }
    };
    const keyup = e => { const i = KEYS.indexOf(e.key.toLowerCase()); if (i >= 0) off(i); };
    document.addEventListener('keyup', keyup);
    win.onClose = () => { document.removeEventListener('keyup', keyup); [...held.keys()].forEach(off); };
    render();
  }
});

      for (let i = 0; i < r.length - 1; i++) if (r[i] === r[i + 1]) { r[i] *= 2; score += r[i]; if (r[i] === 2048 && !won) { won = true; Toast.show('You reached 2048! 🎉', 'Keep going for a higher score.', 'star'); } r.splice(i + 1, 1); }
      while (r.length < 4) r.push(0);
      return r;
    };
    const move = dir => {
      if (over) return;
      const before = JSON.stringify(board);
      const rot = b => b[0].map((_, i) => b.map(r => r[i]).reverse());   // rotate clockwise
      let b = board, turns = { left: 0, down: 1, right: 2, up: 3 }[dir];
      for (let i = 0; i < turns; i++) b = rot(b);
      b = b.map(slide);
      for (let i = 0; i < (4 - turns) % 4; i++) b = rot(b);
      board = b;
      if (JSON.stringify(board) === before) return;
      spawn();
      if (score > best) { best = score; Store.set('2048.best', best); }
      if (!empty().length && !board.some((r, y) => r.some((v, x) => (x < 3 && v === r[x + 1]) || (y < 3 && v === board[y + 1][x])))) over = true;
      render();
    };
    win.onKey = e => { const d = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', a: 'left', d: 'right', w: 'up', s: 'down' }[e.key]; if (d) { e.preventDefault(); move(d); } };
    let sx, sy;
    el.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; });
    el.addEventListener('pointerup', e => { const dx = e.clientX - sx, dy = e.clientY - sy; if (Math.max(Math.abs(dx), Math.abs(dy)) > 30) move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up')); });
    win.body.addEventListener('click', e => { if (e.target.closest('[data-act="new"]')) reset(); });
    reset();
  }
});

Apps.register({
  id: 'breakout', name: 'Breakout', icon: 'app-breakout', color: 'linear-gradient(135deg,#fca5a5,#9f1239)',

    const COLORS = ['#f66151', '#ffa348', '#f8e45c', '#8ff0a4', '#62a0ea', '#c061cb'];
    let s, raf = 0, keys = {};
    const best = () => Store.get('breakout.best', 0);
    const level = n => { s.bricks = []; const rows = Math.min(3 + n, 7); for (let r = 0; r < rows; r++) for (let c = 0; c < 10; c++) s.bricks.push({ x: 8 + c * 58.4, y: 40 + r * 22, w: 54, h: 16, c: COLORS[r % COLORS.length], hp: r < n - 1 ? 2 : 1 }); s.speed = 4 + n * .6; resetBall(); };
    const resetBall = () => { s.stuck = true; s.ball = { x: s.px, y: H - 40, dx: 0, dy: 0, r: 7 }; };
    const newGame = () => { s = { px: W / 2, pw: 90, score: 0, lives: 3, lvl: 1, state: 'ready' }; level(1); hud(); say('Click or press Space to launch'); };
    const hud = () => { $('.bo-s', win.body).textContent = s.score; $('.bo-l', win.body).textContent = s.lvl; $('.bo-v', win.body).textContent = s.lives; $('.bo-b', win.body).textContent = best(); };
    const say = t => { msg.textContent = t; msg.hidden = !t; };
    const launch = () => {
      if (s.state === 'over') { newGame(); return; }
      if (!s.stuck) return;
      s.stuck = false; s.state = 'play'; say('');
      const a = -Math.PI / 2 + (Math.random() - .5) * .8; s.ball.dx = Math.cos(a) * s.speed; s.ball.dy = Math.sin(a) * s.speed;
    };

      if (s.state === 'play' && msg.textContent.startsWith('Paused')) say('');
      if (keys.ArrowLeft) s.px -= 8; if (keys.ArrowRight) s.px += 8;
      s.px = clamp(s.px, s.pw / 2, W - s.pw / 2);
      const b = s.ball;
      if (s.stuck) { b.x = s.px; b.y = H - 34; }
      else {
        b.x += b.dx; b.y += b.dy;
        if (b.x < b.r || b.x > W - b.r) { b.dx *= -1; b.x = clamp(b.x, b.r, W - b.r); }
        if (b.y < b.r) { b.dy = Math.abs(b.dy); }
        if (b.dy > 0 && b.y + b.r >= H - 26 && b.y < H - 14 && Math.abs(b.x - s.px) < s.pw / 2 + b.r) {
          const hit = (b.x - s.px) / (s.pw / 2), a = -Math.PI / 2 + hit * 1.05;
          b.dx = Math.cos(a) * s.speed; b.dy = Math.sin(a) * s.speed; Sound.beep(520, .05, 'square', 0, .05);
        }
        for (const br of s.bricks) {
          if (br.hp <= 0 || b.x + b.r < br.x || b.x - b.r > br.x + br.w || b.y + b.r < br.y || b.y - b.r > br.y + br.h) continue;
          const ox = Math.min(b.x + b.r - br.x, br.x + br.w - (b.x - b.r)), oy = Math.min(b.y + b.r - br.y, br.y + br.h - (b.y - b.r));
          if (ox < oy) b.dx *= -1; else b.dy *= -1;
          br.hp--; s.score += 10 * s.lvl; Sound.beep(880 + Math.random() * 200, .04, 'square', 0, .04);
          if (s.score > best()) Store.set('breakout.best', s.score);
          hud(); break;
        }
        if (!s.bricks.some(br => br.hp > 0)) { s.lvl++; level(s.lvl); hud(); say(`Level ${s.lvl} — press Space`); s.state = 'ready'; }
        if (b.y > H + 20) {
          s.lives--; hud();

          else { resetBall(); s.state = 'ready'; say('Click or press Space to launch'); }
        }
      }
      ctx.clearRect(0, 0, W, H);
      s.bricks.forEach(br => { if (br.hp <= 0) return; ctx.fillStyle = br.c; ctx.globalAlpha = br.hp > 1 ? 1 : .85; ctx.beginPath(); ctx.roundRect(br.x, br.y, br.w, br.h, 4); ctx.fill(); if (br.hp > 1) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); } });
      ctx.globalAlpha = 1; ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent') || '#faa41a';
      ctx.beginPath(); ctx.roundRect(s.px - s.pw / 2, H - 24, s.pw, 10, 5); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    };
    cv.addEventListener('pointermove', e => { const r = cv.getBoundingClientRect(); s.px = (e.clientX - r.left) / r.width * W; });
    cv.addEventListener('click', launch);
    msg.addEventListener('click', launch);
    win.onKey = e => { if (e.key === ' ') { e.preventDefault(); launch(); } if (e.key.startsWith('Arrow')) { e.preventDefault(); keys[e.key] = true; } };
    const up = e => { keys[e.key] = false; };
    document.addEventListener('keyup', up);
    win.onClose = () => { cancelAnimationFrame(raf); document.removeEventListener('keyup', up); };
    if (!CanvasRenderingContext2D.prototype.roundRect) CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h) { this.rect(x, y, w, h); };
    newGame(); step();
  }
});

  launch(win) {

    let rec = null, stream = null, chunks = [], t0 = 0, timer = 0, raf = 0, an = null;
    win.body.innerHTML = `<div class="vr"><div class="vr-meter"><canvas width="440" height="80"></canvas></div><b class="vr-time">00:00</b>

const Screensaver = {
  on: false,

        parts.forEach(p => { p.z -= 6; if (p.z <= 1) { p.z = W; p.x = (Math.random() - .5) * W; p.y = (Math.random() - .5) * H; } const k = 300 / p.z, x = p.x * k + W / 2, y = p.y * k + H / 2, r = Math.max(.4, 2.2 - p.z / W * 2.2); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); });

        if (t % 2) parts.forEach((y, i) => { ctx.fillText(String.fromCharCode(0x30A0 + Math.random() * 96), i * 18, y * 18); parts[i] = y * 18 > H && Math.random() > .975 ? 0 : y + 1; });

/* ---- Animated scenes: shared by the screensaver and live wallpapers ---- */
const SCENES = [['stars', 'Starfield'], ['bubbles', 'Bubbles'], ['aurora', 'Aurora'], ['matrix', 'Digital rain'], ['snow', 'Snowfall'], ['fireflies', 'Fireflies'], ['rain', 'Rain'], ['gradient', 'Colour flow']];
/** Returns a step() that draws one frame. overlay = keep the wallpaper visible behind particles. */
function makeScene(style, ctx, W, H, overlay) {
  let t = 0, parts = [];
  const R = Math.random, clear = (bg, a = 1) => { if (overlay) { ctx.clearRect(0, 0, W, H); return; } ctx.globalAlpha = a; ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; };
  if (style === 'stars') parts = Array.from({ length: 400 }, () => ({ x: (R() - .5) * W, y: (R() - .5) * H, z: R() * W }));
  if (style === 'bubbles') parts = Array.from({ length: 40 }, () => ({ x: R() * W, y: H + R() * H, r: 10 + R() * 50, s: .4 + R() * 1.4, h: R() * 360 }));
  if (style === 'matrix') parts = Array.from({ length: Math.ceil(W / 18) }, () => R() * -H / 18);
  if (style === 'snow') parts = Array.from({ length: 220 }, () => ({ x: R() * W, y: R() * H, r: .8 + R() * 2.8, s: .3 + R() * 1.2, d: R() * 6 }));
  if (style === 'fireflies') parts = Array.from({ length: 70 }, () => ({ x: R() * W, y: R() * H, a: R() * 6, s: .2 + R() * .6, p: R() * 6 }));
  if (style === 'rain') parts = Array.from({ length: 300 }, () => ({ x: R() * W, y: R() * H, l: 10 + R() * 20, s: 8 + R() * 8 }));
  return () => {
    t++;
    if (style === 'stars') {
      clear('#000', .35);
      parts.forEach(p => { p.z -= 6; if (p.z <= 1) { p.z = W; p.x = (R() - .5) * W; p.y = (R() - .5) * H; } const k = 300 / p.z, x = p.x * k + W / 2, y = p.y * k + H / 2, r = Math.max(.4, 2.2 - p.z / W * 2.2); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); });
    } else if (style === 'bubbles') {
      clear('#05060a');
      parts.forEach(p => { p.y -= p.s; p.x += Math.sin((t + p.r * 10) / 60) * .6; if (p.y < -p.r) { p.y = H + p.r; p.x = R() * W; } ctx.fillStyle = `hsla(${(p.h + t / 3) % 360},80%,60%,.35)`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); });
    } else if (style === 'matrix') {
      if (overlay) { ctx.globalCompositeOperation = 'destination-out'; ctx.fillStyle = 'rgba(0,0,0,.08)'; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'source-over'; }
      else { ctx.fillStyle = 'rgba(0,0,0,.08)'; ctx.fillRect(0, 0, W, H); }
      ctx.fillStyle = '#3ef08a'; ctx.font = '16px monospace';
      if (t % 2) parts.forEach((y, i) => { ctx.fillText(String.fromCharCode(0x30A0 + R() * 96), i * 18, y * 18); parts[i] = y * 18 > H && R() > .975 ? 0 : y + 1; });
    } else if (style === 'aurora') {
      clear('#020611');
      for (let b = 0; b < 4; b++) { ctx.beginPath(); for (let x = 0; x <= W; x += 20) { const y = H * (.35 + b * .08) + Math.sin(x / 180 + t / 90 + b) * 60 + Math.sin(x / 70 + t / 50) * 18; x ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fillStyle = `hsla(${140 + b * 40 + Math.sin(t / 200) * 30},80%,55%,${overlay ? .08 : .12})`; ctx.fill(); }
    } else if (style === 'snow') {
      clear('#0b1220');
      ctx.fillStyle = 'rgba(255,255,255,.9)';
      parts.forEach(p => { p.y += p.s; p.x += Math.sin(t / 60 + p.d) * .4; if (p.y > H + 4) { p.y = -4; p.x = R() * W; } ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); });
    } else if (style === 'fireflies') {
      clear('#04110a');
      parts.forEach(p => { p.a += (R() - .5) * .3; p.x += Math.cos(p.a) * p.s; p.y += Math.sin(p.a) * p.s; if (p.x < 0) p.x = W; if (p.x > W) p.x = 0; if (p.y < 0) p.y = H; if (p.y > H) p.y = 0; const g = .35 + .65 * Math.abs(Math.sin(t / 40 + p.p)); ctx.fillStyle = `rgba(214,255,120,${g})`; ctx.shadowColor = '#d6ff78'; ctx.shadowBlur = 12; ctx.beginPath(); ctx.arc(p.x, p.y, 2.2, 0, 7); ctx.fill(); });
      ctx.shadowBlur = 0;
    } else if (style === 'rain') {
      clear('#0a0d14');
      ctx.strokeStyle = 'rgba(170,200,255,.45)'; ctx.lineWidth = 1.2; ctx.beginPath();
      parts.forEach(p => { p.y += p.s; p.x -= 1.5; if (p.y > H) { p.y = -p.l; p.x = R() * (W + 200); } ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - 2, p.y + p.l); });

      ctx.globalAlpha = overlay ? .35 : 1; ctx.fillStyle = g; if (overlay) ctx.clearRect(0, 0, W, H); ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
    }
  };
}

/* ---- Live wallpaper ---- */
const LiveWallpaper = {
  style: 'off',
  set(style, overlay) {
    if (style === this.style && overlay === this.overlay && (style === 'off' || this.cv)) return;
    this.style = style; this.overlay = overlay;
    cancelAnimationFrame(this.raf);
    if (this.cv) { this.cv.remove(); this.cv = null; }
    if (style === 'off' || !SCENES.some(s => s[0] === style)) return;
    this.cv = h('<canvas id="live-wp"></canvas>');
    $('#wallpaper').appendChild(this.cv);
    this.resize();
    let last = 0;
    const loop = now => {
      this.raf = requestAnimationFrame(loop);
      if (document.hidden || Session.state !== 'desktop' || now - last < 33) return;   // ~30 fps, paused when not visible
      if (WM.list().some(w => w.maximized && !w.minimized) && now - last < 250) return;   // mostly covered: slow down
      last = now; this.step();
    };
    this.raf = requestAnimationFrame(loop);
  },
  resize() {
    if (!this.cv) return;
    this.cv.width = innerWidth; this.cv.height = innerHeight;
    this.step = makeScene(this.style, this.cv.getContext('2d'), innerWidth, innerHeight, this.overlay);
  }
};
window.addEventListener('resize', () => LiveWallpaper.resize());

function runAction(a) {

          if (b.x < 0) s.b++; else s.a++;
          Sound.beep(b.x < 0 ? 200 : 880, .2, 'triangle', 0, .07); s.ball = null; hud();
          if (s.a >= 7 || s.b >= 7) { msg.textContent = `${s.a > s.b ? 'You win! 🏆' : 'CPU wins'} ${s.a}–${s.b} — click to play again`; msg.hidden = false; s.over = true; }
          else { msg.textContent = 'Click or press Space to serve'; msg.hidden = false; }
        }
      }

      ctx.fillStyle = 'rgba(255,255,255,.25)'; for (let y = 8; y < H; y += 24) ctx.fillRect(W / 2 - 2, y, 4, 12);

    win.body.addEventListener('click', e => { const l = e.target.closest('[data-lv]'); if (l) { lv = +l.dataset.lv; Store.set('pong.level', lv); hud(); } });
    win.onKey = e => { if (e.key === ' ') { e.preventDefault(); go(); } keys[e.key] = true; };
    const up = e => { keys[e.key] = false; };
    document.addEventListener('keyup', up);
    win.onClose = () => { cancelAnimationFrame(raf); document.removeEventListener('keyup', up); };
    reset(); step();
  }
});

      $('.clip-list', win.body).innerHTML = ClipHistory.list().filter(x => !q || x.text.toLowerCase().includes(q)).map(x => `<div class="clip-item${x.pinned ? ' pinned' : ''}" data-id="${x.id}"><pre>${esc(x.text.slice(0, 400))}${x.text.length > 400 ? '…' : ''}</pre><div><small>${relTime(x.time)}</small><button class="icon-btn" data-pin title="${x.pinned ? 'Unpin' : 'Pin'}">${svg('pin')}</button><button class="icon-btn" data-del title="Delete">${svg('close')}</button></div></div>`).join('') || '<div class="st-empty">Nothing copied yet. Copy some text and it shows up here.</div>';
    };
    win.body.addEventListener('input', e => { if (e.target.classList.contains('clip-q')) { q = e.target.value.toLowerCase(); render(); } });
    win.body.addEventListener('click', async e => {
      if (e.target.closest('[data-act="clear"]')) { Store.set('clipboard', ClipHistory.list().filter(x => x.pinned)); render(); return; }
      const it = e.target.closest('[data-id]'); if (!it) return;
      const l = ClipHistory.list(), x = l.find(y => String(y.id) === it.dataset.id);
      if (e.target.closest('[data-pin]')) { x.pinned = !x.pinned; Store.set('clipboard', l); render(); return; }
      if (e.target.closest('[data-del]')) { Store.set('clipboard', l.filter(y => y !== x)); render(); return; }
      try { await navigator.clipboard.writeText(x.text); Toast.show('Copied again', x.text.slice(0, 60), 'paperclip', 1500); } catch { Toast.show('Copy failed', '', 'info'); }
    });
    win.listen('clipboard', render);
    render();
  }
});

  init() {
    this.el = h('<div id="snap-layouts" hidden></div>'); document.body.appendChild(this.el);
    this.el.innerHTML = SNAP_LAYOUTS.map((l, i) => `<div class="sl-lay">${l.map((z, j) => `<button data-z="${z.join(',')}" style="left:${z[0] * 100}%;top:${z[1] * 100}%;width:${z[2] * 100}%;height:${z[3] * 100}%"></button>`).join('')}</div>`).join('');
    document.addEventListener('pointerover', e => {
      const b = e.target.closest && e.target.closest('.wc.max');
      if (b && Settings.get('snapLayouts') && !WM.tiled()) { clearTimeout(this.hideT); clearTimeout(this.showT); this.showT = setTimeout(() => this.show(b), 450); }
      else if (!e.target.closest || !e.target.closest('#snap-layouts')) { clearTimeout(this.showT); if (!this.el.hidden) { clearTimeout(this.hideT); this.hideT = setTimeout(() => this.hide(), 350); } }
    });

      const z = e.target.closest('[data-z]'); if (!z || !this.win) return;

  show(btn) {
    const winEl = btn.closest('.window'), win = [...WM.wins.values()].find(w => w.el === winEl); if (!win) return;
    this.win = win; const r = btn.getBoundingClientRect();
    this.el.hidden = false;
    const w = this.el.offsetWidth;
    Object.assign(this.el.style, { left: clamp(r.left + r.width / 2 - w / 2, 6, innerWidth - w - 6) + 'px', top: Math.min(r.bottom + 6, innerHeight - this.el.offsetHeight - 6) + 'px' });
  },
  hide() { this.el.hidden = true; this.win = null; }
};
