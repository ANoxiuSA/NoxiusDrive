    set('--radius', clamp(+c.radius, 0, 24) + 'px');
    const darkP = !scheme.native && scheme.base === 'dark';
    set('--panel-bg', rgba(darkP ? scheme.p.bg0 : '#111010', clamp(+c.panelOpacity, 20, 100) / 100));
    set('--dock-bg', rgba(darkP ? scheme.p.bg1 : '#201e1d', clamp(+c.dockOpacity, 20, 100) / 100));
    const d = root.dataset, b = v => (v ? '1' : '0');
    Object.assign(d, {
      cPanel: c.panel, cDock: c.dock, cDockstyle: dockStyle, cWs: b(c.panelWs), cApps: b(c.panelApps), cClock: c.clockPos, cGmenu: b(c.globalMenu),
      cBtnside: c.btnSide, cBtnstyle: c.btnStyle, cTitle: c.titleAlign, cTicon: b(c.titleIcon), cAutohide: b(c.dockAutohide && dockStyle !== 'merged'),
      cLauncher: c.dockLauncher, cDockws: b(c.dockWs)
    });
  },
  setCustom(k, v) { Settings.set('custom', Object.assign(customOpts(), { [k]: v })); },
  /** Switch desktop layout; also applies that layout's accent and wallpaper unless told not to. */
  setLayout(id, opts = {}) {
    const l = LAYOUTS.find(x => x.id === id) || LAYOUTS[0];
    Settings.set('layout', l.id);
    if (opts.accent !== false && l.accent) Settings.set('accent', l.accent);
    if (opts.wallpaper !== false && l.wallpaper && Settings.get('wallpaper') !== 'custom') Settings.set('wallpaper', l.wallpaper);
  },
  /** Wallpaper slideshow: every N minutes move to the next built-in wallpaper. */
  _lastWp: Date.now(),
  startSlideshow() {
    setInterval(() => {
      const m = +Settings.get('slideshow');
      if (!m || Settings.get('wallpaper') === 'custom' || Session.state !== 'desktop' || Date.now() - this._lastWp < m * 60000) return;
      const i = WALLPAPERS.findIndex(w => w.id === Settings.get('wallpaper'));
      Settings.set('wallpaper', WALLPAPERS[(i + 1) % WALLPAPERS.length].id);
    }, 10000);
  },
  /** "Dark Style" toggle: Pop Light ↔ the last dark scheme you used. */
  toggle() { this.setScheme(schemeOf(Settings.get('scheme')).base === 'dark' ? 'light' : (Settings.get('lastDark') || 'dark'), { accent: false, wallpaper: false }); },
  nextWallpaper() {
    const i = WALLPAPERS.findIndex(w => w.id === Settings.get('wallpaper'));
    const next = WALLPAPERS[(i + 1) % WALLPAPERS.length];
    Settings.set('wallpaper', next.id);
    Toast.show('Wallpaper changed', next.name, 'image', 2200);
  },
  /** Validate an image URL (http/https, data: or blob:) by loading it before applying it. */
  async setCustomWallpaper(url) {
    url = (url || '').trim();
    if (!/^(https?:|data:image\/|blob:)/i.test(url)) { Toast.show('Invalid URL', 'Use an http(s), data:image or blob: URL.', 'info'); return; }
    // blob: URLs die on reload, so store their image as a (downscaled) data URI instead.
    if (/^blob:/i.test(url)) {
      try { url = await imageToDataUri(await (await fetch(url)).blob()); }
      catch { Toast.show('Could not read blob', 'The blob URL has expired or belongs to another page.', 'info'); return; }
    }
    const img = new Image();
    img.onload = () => { Settings.set('customWallpaper', url); Settings.set('wallpaper', 'custom'); Toast.show('Wallpaper updated', 'Custom image applied.', 'image'); };
    img.onerror = () => Toast.show('Could not load image', 'Check the URL and try again.', 'info');
    img.src = url;
  }
};

/** Shared Web Audio context, system volume and simple UI sounds. */
const Sound = {
  _ctx: null,
  ctx() {
    if (!this._ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      this._ctx = new AC();
    }
    if (this._ctx.state === 'suspended') this._ctx.resume();
    return this._ctx;
  },
  get volume() { return Settings.get('muted') ? 0 : Settings.get('volume') / 100; },
  beep(freq = 880, dur = 0.15, type = 'sine', when = 0, gain = 0.18) {
    const c = this.ctx();
    if (!c || !this.volume) return;
    const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + when;
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(gain * this.volume, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t + dur + 0.02);
  },
  chime() { [659, 880, 1319].forEach((f, i) => this.beep(f, 0.35, 'sine', i * 0.11, 0.1)); }
};

const WELCOME_TEXT = `Welcome to SanjivramOS!

A few things to try:
  • Open apps from the dock or Applications (top-left)
  • Right-click an app → Add to Desktop to put it on the desktop
  • Drag windows by the title bar, snap them to the screen edges

  • Alt+Tab (or Alt+\`) switches windows

Type "help" in the Terminal for a list of commands.
`;

const FS = {
  data: null,
  load() {
    const d = Store.get('notes', null);
    this.data = d && typeof d === 'object' ? d : { 'Welcome.txt': { content: WELCOME_TEXT, modified: Date.now() } };
    if (!d) this.persist();
  },
  persist() { Store.set('notes', this.data); Bus.emit('fs'); },
  list() { return Object.keys(this.data).sort((a, b) => a.localeCompare(b)); },
  recent(n = 6) { return this.list().sort((a, b) => this.data[b].modified - this.data[a].modified).slice(0, n); },
  exists(n) { return Object.prototype.hasOwnProperty.call(this.data, n); },
  read(n) { return this.exists(n) ? this.data[n].content : null; },
  stat(n) { return this.exists(n) ? this.data[n] : null; },
  write(n, content) { this.data[n] = { content: String(content), modified: Date.now() }; this.persist(); },
  remove(n) { if (!this.exists(n)) return false; delete this.data[n]; this.persist(); return true; },
  rename(a, b) {
    if (!this.exists(a) || this.exists(b)) return false;
    this.data[b] = this.data[a]; delete this.data[a]; this.persist(); return true;
  },
  /** Resolve a user-typed name, allowing the ".txt" extension to be omitted. */
  resolve(n) { if (this.exists(n)) return n; if (this.exists(n + '.txt')) return n + '.txt'; return null; },
  normalize(n) { n = String(n || '').trim(); return n && !n.includes('.') ? n + '.txt' : n; },
  valid(n) { return typeof n === 'string' && n.trim().length > 0 && n.length <= 64 && !/[\/\\<>:"|?*]/.test(n) && n !== '__proto__'; },
  uniqueName(base = 'New Text File.txt') {
    if (!this.exists(base)) return base;
    const dot = base.lastIndexOf('.');
    const stem = dot > 0 ? base.slice(0, dot) : base, ext = dot > 0 ? base.slice(dot) : '';
    let i = 2;
    while (this.exists(`${stem} (${i})${ext}`)) i++;
    return `${stem} (${i})${ext}`;
  }
};

/** Every notification shown this session (listed under the panel clock). */

const ContextMenu = {

const Dialog = {
  current: null,
  open({ title, message = '', input = null, okText = 'OK', cancelText = 'Cancel', danger = false }) {
    return new Promise(resolve => {
      const bd = h(`<div class="dialog-backdrop"><div class="dialog" role="dialog" aria-modal="true">
        <div class="dialog-title">${esc(title)}</div>
        ${message ? `<div class="dialog-msg">${esc(message)}</div>` : ''}
        ${input !== null ? '<input class="input dialog-input" spellcheck="false">' : ''}
        <div class="dialog-btns">${cancelText ? `<button class="btn" data-r="0">${esc(cancelText)}</button>` : ''}<button class="btn ${danger ? 'danger' : 'primary'}" data-r="1">${esc(okText)}</button></div>
      </div></div>`);
      const inp = bd.querySelector('.dialog-input');
      if (inp) inp.value = input;
      const done = ok => {
        if (bd._done) return;
        bd._done = true;
        bd.classList.add('out');
        setTimeout(() => bd.remove(), 150);
        Dialog.current = null;
        resolve(input !== null ? (ok ? inp.value : null) : ok);
      };
      bd.querySelectorAll('[data-r]').forEach(b => b.addEventListener('click', () => done(b.dataset.r === '1')));
      bd.addEventListener('pointerdown', e => { if (e.target === bd) done(false); });
      bd.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); done(true); }
        else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); done(false); }
      });
      document.body.appendChild(bd);
      Dialog.current = bd;
      setTimeout(() => {
        if (inp) { inp.focus(); const dot = inp.value.lastIndexOf('.'); inp.setSelectionRange(0, dot > 0 ? dot : inp.value.length); }
        else bd.querySelector('[data-r="1"]').focus();
      }, 30);
    });
  },
  confirm(title, message, opts = {}) { return this.open(Object.assign({ title, message }, opts)); },
  prompt(title, message, value = '', opts = {}) { return this.open(Object.assign({ title, message, input: value }, opts)); }
};

/* ===================== 6. Window manager ===================== */
const WM = {
  wins: new Map(),   // id -> window object
  z: 10,             // z-index counter
  seq: 0,
  active: null,
  cascade: 0,

  init() {
    this.layer = $('#windows');
    this.snapEl = $('#snap-preview');
    this.initFileDrop();
    let t;
    window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(() => this.fitAll(), 80); });
    // Clicks inside an iframe never reach this document. When the page loses focus to one
    // of our iframes, bring that iframe's window to the front.
    window.addEventListener('blur', () => setTimeout(() => {
      const a = document.activeElement;
      if (a && a.tagName === 'IFRAME') {
        const el = a.closest('.window');
        const w = el && this.wins.get(el.dataset.id);
        if (w) this.focus(w);
        StartMenu.hide(); ContextMenu.hide();
      }
    }, 0));
  },

  /** Files dragged from the computer: iframes would swallow the drop, so block them while a
   *  drag is in progress, then hand the files to the window (win.onDropFiles) or desktop below. */
  initFileDrop() {
    let depth = 0;
    const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
    // Only iframes in windows that accept drops (e.g. the Browser) are blocked, so sites like the
    // drive in File Explorer still receive files dropped straight onto them (e.g. for uploads).
    const frames = () => [...this.wins.values()].filter(w => w.onDropFiles).flatMap(w => $$('iframe', w.el));
    const end = () => { depth = 0; document.body.classList.remove('file-drag'); frames().forEach(f => { f.style.pointerEvents = ''; }); };
    window.addEventListener('dragenter', e => {
      if (!hasFiles(e)) return;
      if (depth++ === 0) { document.body.classList.add('file-drag'); frames().forEach(f => { f.style.pointerEvents = 'none'; }); }
    });
    window.addEventListener('dragleave', () => { if (--depth <= 0) end(); });
    window.addEventListener('dragover', e => { if (hasFiles(e)) { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; } });
    window.addEventListener('drop', e => {
      if (!hasFiles(e)) return;
      e.preventDefault();   // never let the browser navigate away to the dropped file
      end();
      const files = [...e.dataTransfer.files];
      if (!files.length || Session.state !== 'desktop') return;
      const el = e.target.closest && e.target.closest('.window');
      const win = el && this.wins.get(el.dataset.id);
      if (win) {
        this.focus(win);
        if (win.onDropFiles) win.onDropFiles(files);
        else Toast.show(`${win.app.name} can't open files`, 'Drop files on Notepad, Web Browser, Paint, Music Player or the desktop.', 'info');
      } else Desktop.dropFiles(files, e.clientX, e.clientY);
    });
  },

  area() { return { w: this.layer.clientWidth, h: this.layer.clientHeight }; },
  list() { return [...this.wins.values()].sort((a, b) => b.z - a.z); },
  windowsOf(appId) { return this.list().filter(w => w.appId === appId); },
  rectOf(el) { return { left: el.offsetLeft, top: el.offsetTop, width: el.offsetWidth, height: el.offsetHeight }; },
  applyRect(el, r) { Object.assign(el.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' }); },

  /** Open an app (or focus it if it is a singleton / already showing the requested item). */
  open(appId, args = {}) {
    const app = Apps.get(appId);
    if (!app) { Toast.show('App not found', `"${appId}" is not installed.`, 'info'); return null; }
    StartMenu.hide();
    const existing = app.singleton ? this.windowsOf(appId)[0] : (app.findExisting ? app.findExisting(args) : null);
    if (existing) { this.focus(existing); existing.receive && existing.receive(args); return existing; }

    const { w: aw, h: ah } = this.area();
    const width = Math.min(app.width, aw - 16), height = Math.min(app.height, ah - 16);
    const step = (this.cascade++ % 7) * 26;
    const left = clamp(Math.round((aw - width) / 2 - 78 + step), 0, Math.max(0, aw - width));
    const top = clamp(Math.round((ah - height) / 2 - 60 + step), 0, Math.max(0, ah - height));
    const id = 'w' + (++this.seq);

    const el = h(`<div class="window opening" data-id="${id}" style="left:${left}px;top:${top}px;width:${width}px;height:${height}px">
      <div class="win-frame">
        <div class="titlebar">
          ${tile(app.icon, app.color)}
          <div class="title-text">${esc(app.name)}</div>
          <div class="win-controls">
            <button class="wc min" title="Minimize">${svg('min')}</button>
            <button class="wc max" title="Maximize">${svg('max')}</button>
            <button class="wc close" title="Close">${svg('close')}</button>
          </div>
        </div>
        <div class="win-body" data-app="${app.id}"></div>
      </div>
      ${['n', 's', 'e', 'w', 'ne', 'nw', 'se', 'sw'].map(d => `<div class="rh ${d}" data-dir="${d}"></div>`).join('')}
    </div>`);

    const win = {
      id, appId, app, el, body: el.querySelector('.win-body'), title: app.name, z: 0,
      minimized: false, maximized: false, snapped: null, prevRect: null, _subs: [], _timers: [], ws: this.ws,
      onClose: null, onKey: null, onResize: null, onFocus: null, beforeClose: null, receive: null,
      setTitle(t) { this.title = t; el.querySelector('.title-text').textContent = t; Bus.emit('wm'); },
      /** Subscribe to a bus event; automatically removed when the window closes. */
      listen(name, fn) { Bus.on(name, fn); this._subs.push([name, fn]); },
      /** setInterval that is cleared automatically on close. */
      every(fn, ms) { const t = setInterval(fn, ms); this._timers.push(t); return t; },
      close(force) { return WM.close(this, force); }
    };
    this.wins.set(id, win);
    this.tileOrder.push(id);
    this.layer.appendChild(el);
    this.bind(win);
    setTimeout(() => el.classList.remove('opening'), 320);

    try { app.launch(win, args || {}); }
    catch (err) { console.error(err); win.body.innerHTML = `<div class="app-error">This app crashed while starting: ${esc(err.message)}</div>`; }

    if (window.innerWidth < 700 || Settings.get('tabletMode')) this.maximize(win, false);
    this.retile();
    this.focus(win);
    Taskbar.bounce(appId);
    AppUsage.record(appId);
    Sound.ui('open');
    return win;
  },

  bind(win) {
    const el = win.el, tb = el.querySelector('.titlebar');
    el.addEventListener('pointerdown', () => this.focus(win), true);
    tb.querySelector('.min').addEventListener('click', e => { e.stopPropagation(); this.minimize(win); });
    tb.querySelector('.max').addEventListener('click', e => { e.stopPropagation(); this.toggleMax(win); });
    tb.querySelector('.close').addEventListener('click', e => { e.stopPropagation(); this.close(win); });
    tb.addEventListener('dblclick', e => {
      if (e.target.closest('.wc')) return;
      const a = Settings.get('winDblClick');
      if (a === 'min') this.minimize(win); else if (a !== 'none') this.toggleMax(win);
    });
    el.addEventListener('pointerenter', () => { if (Settings.get('focusHover') && this.active !== win && !win.minimized && !document.body.classList.contains('wm-busy')) this.focus(win); });
    tb.addEventListener('pointerdown', e => this.startDrag(win, e));
    tb.addEventListener('contextmenu', e => {
      e.preventDefault();
      ContextMenu.show(e.clientX, e.clientY, [
        { label: win.maximized ? 'Restore' : 'Maximize', icon: win.maximized ? 'restore' : 'max', action: () => this.toggleMax(win) },
        { label: 'Minimize', icon: 'min', action: () => this.minimize(win) },
        { label: win.onTop ? 'Don’t Keep on Top' : 'Always on Top', icon: 'pin', action: () => { win.onTop = !win.onTop; win.el.classList.toggle('on-top', win.onTop); win.el.style.zIndex = win.z + (win.onTop ? 1000000 : 0); } },
        { label: `Window opacity: ${Math.round((win.opacity || 1) * 100)}%`, icon: 'sun', action: () => { const steps = [1, .9, .75, .6]; win.opacity = steps[(steps.indexOf(win.opacity || 1) + 1) % steps.length]; win.el.querySelector('.win-frame').style.opacity = win.opacity === 1 ? '' : win.opacity; } },
        ...(this.wsCount() > 1 ? Array.from({ length: this.wsCount() }, (_, i) => i + 1).filter(n => n !== (win.ws || 1)).map(n => ({ label: `Move to Workspace ${n}`, icon: 'workspaces', action: () => this.moveToWs(win, n) })) : []),
        ...(this.tiled()
          ? [{ label: win.floating ? 'Tile this window' : 'Float this window', icon: 'tiles', action: () => { win.floating = !win.floating; if (win.floating) { win.el.classList.remove('tiled'); if (win.floatRect) { this.animate(win); this.applyRect(win.el, this.clampRect(win.floatRect)); } } this.retile(); } }]
          : [{ label: 'Snap left', icon: 'back', action: () => this.snapTo(win, 'left') },
             { label: 'Snap right', icon: 'forward', action: () => this.snapTo(win, 'right') }]),
        '-',
        { label: 'Close', icon: 'close', hint: 'Alt+F4', danger: true, action: () => this.close(win) }
      ]);
    });
    el.querySelectorAll('.rh').forEach(r => r.addEventListener('pointerdown', e => this.startResize(win, e, r.dataset.dir)));
    if ('ResizeObserver' in window) {
      win.ro = new ResizeObserver(() => { try { win.onResize && win.onResize(); } catch (e) { console.error(e); } });
      win.ro.observe(win.body);
    }
  },

  /** While dragging/resizing, iframes must not swallow pointer events. */
  setIframesBlocked(blocked) {
    document.querySelectorAll('iframe').forEach(f => { f.style.pointerEvents = blocked ? 'none' : ''; });
    document.body.classList.toggle('wm-busy', blocked);
  },

  startDrag(win, e) {
    if (e.button !== 0 || e.target.closest('.wc')) return;
    const el = win.el, sx = e.clientX, sy = e.clientY;
    const lr = this.layer.getBoundingClientRect();
    let startLeft = el.offsetLeft, startTop = el.offsetTop, moved = false, snap = null, px = sx, py = sy;
    const tiledDrag = this.tiled() && !win.floating;
    try { e.target.setPointerCapture(e.pointerId); } catch {}

    const onMove = ev => {
      const dx = ev.clientX - sx, dy = ev.clientY - sy;
      if (!moved) {
        if (Math.abs(dx) < 4 && Math.abs(dy) < 4) return;
        moved = true;
        this.setIframesBlocked(true);
        el.classList.add('dragging');
        if (win.maximized || win.snapped) {
          // Pull the window out of its maximized/snapped state, keeping the cursor at the same relative spot.
          const pr = win.prevRect || { width: Math.min(800, el.offsetWidth), height: Math.min(560, el.offsetHeight) };
          const ratio = (sx - lr.left - el.offsetLeft) / el.offsetWidth;
          win.maximized = false; win.snapped = null;
          el.classList.remove('maximized');
          el.style.width = pr.width + 'px'; el.style.height = pr.height + 'px';
          startLeft = sx - lr.left - pr.width * ratio;
          startTop = Math.max(0, sy - lr.top - 18);
          this.updateMaxBtn(win);
        }
      }
      const { w: aw, h: ah } = this.area();
      const nl = clamp(startLeft + dx, -el.offsetWidth + 90, aw - 90);
      const nt = clamp(startTop + dy, 0, ah - 40);
      el.style.left = nl + 'px'; el.style.top = nt + 'px';
      const x = ev.clientX - lr.left, y = ev.clientY - lr.top;
      px = ev.clientX; py = ev.clientY;
      if (tiledDrag) { this.showSwap(win, x, y); return; }
      snap = x <= 6 ? 'left' : x >= aw - 6 ? 'right' : y <= 3 ? 'top' : null;
      this.showSnap(snap);
    };
    const onUp = () => {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
      if (!moved) return;
      el.classList.remove('dragging');
      this.setIframesBlocked(false);
      this.showSnap(null);
      if (tiledDrag) {
        // Auto-tiling: dropping a window onto another swaps their places.
        const target = this.tileTargetAt(win, px - lr.left, py - lr.top);
        if (target) {
          const a = this.tileOrder.indexOf(win.id), b = this.tileOrder.indexOf(target.id);
          [this.tileOrder[a], this.tileOrder[b]] = [this.tileOrder[b], this.tileOrder[a]];
        }
        this.retile();
        return;
      }
      if (snap === 'top') this.maximize(win);
      else if (snap) this.snapTo(win, snap);
    };
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  },

  startResize(win, e, dir) {
    if (e.button !== 0 || win.maximized) return;
    e.preventDefault(); e.stopPropagation();
    const el = win.el, sx = e.clientX, sy = e.clientY, r = this.rectOf(el);
    const minW = Math.min(win.app.minWidth || 320, this.area().w), minH = win.app.minHeight || 200;
    try { e.target.setPointerCapture(e.pointerId); } catch {}
    this.setIframesBlocked(true);
    document.body.style.cursor = getComputedStyle(e.target).cursor;
    if (win.snapped) win.snapped = null;

    const onMove = ev => {
      const dx = ev.clientX - sx, dy = ev.clientY - sy;
      let { left, top, width, height } = r;
      if (dir.includes('e')) width = Math.max(minW, r.width + dx);
      if (dir.includes('s')) height = Math.max(minH, r.height + dy);
      if (dir.includes('w')) { width = Math.max(minW, r.width - dx); left = r.left + r.width - width; }
      if (dir.includes('n')) {
        height = Math.max(minH, r.height - dy); top = r.top + r.height - height;
        if (top < 0) { height += top; top = 0; }
      }
      this.applyRect(el, { left, top, width, height });
    };
    const onUp = () => {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
      this.setIframesBlocked(false);
      document.body.style.cursor = '';
    };
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  },

  snapRect(side) {
    const { w, h: hh } = this.area(), half = Math.round(w / 2);
    if (String(side).startsWith('z:')) { const [x, y, fw, fh] = side.slice(2).split(',').map(Number); return { left: Math.round(x * w), top: Math.round(y * hh), width: Math.round(fw * w), height: Math.round(fh * hh) }; }
    if (side === 'left') return { left: 0, top: 0, width: half, height: hh };
    if (side === 'right') return { left: half, top: 0, width: w - half, height: hh };
    return { left: 0, top: 0, width: w, height: hh };
  },
  showSnap(side) {
    if (!side) { this.snapEl.classList.remove('show'); return; }
    const r = this.snapRect(side);
    Object.assign(this.snapEl.style, { left: r.left + 8 + 'px', top: r.top + 8 + 'px', width: r.width - 16 + 'px', height: r.height - 16 + 'px' });
    this.snapEl.classList.add('show');
  },
  snapTo(win, side, animate = true) {
    if (win.maximized) { win.maximized = false; win.el.classList.remove('maximized'); this.updateMaxBtn(win); }
    if (!win.snapped) win.prevRect = this.rectOf(win.el);
    win.snapped = side;
    this.animate(win, animate);
    this.applyRect(win.el, this.snapRect(side));
  },
  animate(win, on = true) {
    if (!on) return;
    win.el.classList.add('anim');
    clearTimeout(win._animT);
    win._animT = setTimeout(() => win.el.classList.remove('anim'), 300);
  },
  maximize(win, animate = true) {
    if (win.maximized) return;
    if (!win.snapped) win.prevRect = this.rectOf(win.el);
    win.maximized = true;
    this.animate(win, animate);
    win.el.classList.add('maximized');
    this.updateMaxBtn(win);
    Bus.emit('wm');
  },
  unmaximize(win) {
    if (!win.maximized) return;
    win.maximized = false; win.snapped = null;
    this.animate(win);
    win.el.classList.remove('maximized');
    if (this.tiled() && !win.floating) this.retile();
    else if (win.prevRect) this.applyRect(win.el, this.clampRect(win.prevRect));
    this.updateMaxBtn(win);
    Bus.emit('wm');
  },
  toggleMax(win) { if (win.maximized) this.unmaximize(win); else this.maximize(win); },
  updateMaxBtn(win) {
    const b = win.el.querySelector('.wc.max');
    b.innerHTML = svg(win.maximized ? 'restore' : 'max');
    b.title = win.maximized ? 'Restore' : 'Maximize';
  },
  clampRect(r) {
    const { w, h: hh } = this.area();
    const width = Math.min(r.width, w), height = Math.min(r.height, hh);
    return { width, height, left: clamp(r.left, 0, Math.max(0, w - width)), top: clamp(r.top, 0, Math.max(0, hh - height)) };
  },
  /** Keep windows on-screen after the browser viewport changes size. */
  fitAll() {
    this.retile(false);
    this.wins.forEach(win => {
      if (win.maximized || win.el.classList.contains('tiled')) return;
      if (win.snapped) { this.applyRect(win.el, this.snapRect(win.snapped)); return; }
      this.applyRect(win.el, this.clampRect(this.rectOf(win.el)));
    });
  },

  minimize(win) {
    if (win.minimized) return;
    const btn = Taskbar.buttonFor(win.appId), wr = win.el.getBoundingClientRect();
    let mx = 0, my = window.innerHeight - wr.top;
    if (btn) {
      const br = btn.getBoundingClientRect();
      mx = br.left + br.width / 2 - (wr.left + wr.width / 2);
      my = br.top + br.height / 2 - (wr.top + wr.height / 2);
    }
    win.el.style.setProperty('--mx', mx + 'px');
    win.el.style.setProperty('--my', my + 'px');
    win.minimized = true;
    win.el.classList.add('minimized');
    win.el.classList.remove('active');
    if (this.active === win) { this.active = null; this.focusTop(); }
    this.retile();
    Bus.emit('wm');
  },
  focusTop() {
    const top = this.list().find(w => !w.minimized && this.onWs(w));
    if (top) this.focus(top); else { this.active = null; Bus.emit('wm'); }
  },
  focus(win) {
    if (!this.wins.has(win.id)) return;
    if (!this.onWs(win)) this.switchWs(win.ws, { keepFocus: true });
    let changed = false;
    if (win.minimized) { win.minimized = false; win.el.classList.remove('minimized'); changed = true; this.retile(); }
    if (win.z !== this.z) { win.z = ++this.z; win.el.style.zIndex = win.z + (win.onTop ? 1000000 : 0); changed = true; }
    if (this.active !== win) {
      this.wins.forEach(w => w.el.classList.toggle('active', w === win));
      this.active = win; changed = true;
      try { win.onFocus && win.onFocus(); } catch (e) { console.error(e); }
    }
    if (changed) Bus.emit('wm');
  },
  /** Deactivate all windows (e.g. when the user clicks the desktop). */
  blurAll() {
    if (!this.active) return;
    this.active.el.classList.remove('active');
    this.active = null;
    Bus.emit('wm');
  },
  async close(win, force = false) {
    if (!this.wins.has(win.id) || win.closing) return false;
    if (!force && win.beforeClose) {
      this.focus(win);
      const ok = await win.beforeClose();
      if (!ok || !this.wins.has(win.id)) return false;
    }
    win.closing = true;
    Sound.ui('close');
    try { win.onClose && win.onClose(); } catch (e) { console.error(e); }
    win._subs.forEach(([n, f]) => Bus.off(n, f));
    win._timers.forEach(clearInterval);
    if (win.ro) win.ro.disconnect();
    this.wins.delete(win.id);
    this.tileOrder = this.tileOrder.filter(id => id !== win.id);
    this.retile();
    win.el.classList.add('closing');
    setTimeout(() => win.el.remove(), 210);
    if (this.active === win) { this.active = null; this.focusTop(); }
    Bus.emit('wm');
    return true;
  },
  closeAll() { [...this.wins.values()].forEach(w => this.close(w, true)); },

  /* ---------- Virtual workspaces ---------- */
  ws: 1,
  wsCount() { return clamp(+Settings.get('workspaces') || 1, 1, 9); },
  onWs(w) { return (w.ws || 1) === this.ws; },
  switchWs(n, opts = {}) {
    n = clamp(n, 1, this.wsCount());
    if (n === this.ws) return;
    this.ws = n;
    this.wins.forEach(w => w.el.classList.toggle('ws-off', !this.onWs(w)));
    if (!opts.keepFocus) { const top = this.list().find(w => this.onWs(w) && !w.minimized); if (top) this.focus(top); else this.blurAll(); }
    this.retile(false);
    Bus.emit('wm'); Bus.emit('ws');
    WsOsd.show(n);
  },
  moveToWs(win, n) {
    win.ws = clamp(n, 1, this.wsCount());
    win.el.classList.toggle('ws-off', !this.onWs(win));
    if (!this.onWs(win) && this.active === win) { win.el.classList.remove('active'); this.active = null; this.focusTop(); }
    this.retile(); Bus.emit('wm'); Bus.emit('ws');
    Toast.show(`Moved to workspace ${win.ws}`, win.title, 'workspaces', 1600);
  },
  /** After lowering the number of workspaces, bring stranded windows back. */
  clampWs() { const n = this.wsCount(); this.wins.forEach(w => { if ((w.ws || 1) > n) w.ws = n; }); if (this.ws > n) this.switchWs(n); else this.wins.forEach(w => w.el.classList.toggle('ws-off', !this.onWs(w))); },

  /* ---------- Pop Shell style auto-tiling ---------- */
  tileOrder: [],   // window ids in tiling order
  get GAP() { return clamp(+Settings.get('tileGap') || 0, 0, 40); },
  tiled() { return !!Settings.get('tiling') && window.innerWidth >= 700; },
  setTiling(on) {
    Settings.set('tiling', on);
    if (on) this.retile(); else this.untileAll();
    Toast.show(on ? 'Auto-tiling on' : 'Auto-tiling off', on ? 'Windows are arranged automatically. Drag a window onto another to swap them.' : 'Windows float freely again.', 'tiles', 2600);
  },
  /** Lay out every visible, non-floating window by recursively splitting the screen (alternating direction). */
  retile(animate = true) {
    if (!this.tiled()) return;
    const G = this.GAP, { w: aw, h: ah } = this.area();
    const wins = this.tileOrder.map(id => this.wins.get(id)).filter(w => w && !w.minimized && !w.maximized && !w.closing && !w.floating && this.onWs(w));
    const apply = (win, r) => {
      if (!win.el.classList.contains('tiled')) win.floatRect = this.rectOf(win.el);
      win.tiledRect = r; win.snapped = null;
      win.el.classList.add('tiled');
      this.animate(win, animate);
      this.applyRect(win.el, r);
    };
    const place = (list, r, vertical) => {
      if (!list.length) return;
      if (list.length === 1) { apply(list[0], r); return; }
      const [first, ...rest] = list;
      if (vertical) {
        const half = Math.round((r.width - G) / 2);
        apply(first, { left: r.left, top: r.top, width: half, height: r.height });
        place(rest, { left: r.left + half + G, top: r.top, width: r.width - half - G, height: r.height }, false);
      } else {
        const half = Math.round((r.height - G) / 2);
        apply(first, { left: r.left, top: r.top, width: r.width, height: half });
        place(rest, { left: r.left, top: r.top + half + G, width: r.width, height: r.height - half - G }, true);
      }
    };
    place(wins, { left: G, top: G, width: aw - 2 * G, height: ah - 2 * G }, aw >= ah);
  },
  untileAll() {
    this.wins.forEach(w => {
      if (!w.el.classList.contains('tiled')) return;
      w.el.classList.remove('tiled');
      w.tiledRect = null;
      if (!w.maximized && w.floatRect) { this.animate(w); this.applyRect(w.el, this.clampRect(w.floatRect)); }
    });
  },
  tileTargetAt(win, x, y) {
    return [...this.wins.values()].find(w => w !== win && w.tiledRect && !w.minimized && !w.floating &&
      x >= w.tiledRect.left && x <= w.tiledRect.left + w.tiledRect.width && y >= w.tiledRect.top && y <= w.tiledRect.top + w.tiledRect.height) || null;
  },
  /** While dragging a tiled window, preview the slot it would swap into. */
  showSwap(win, x, y) {
    const t = this.tileTargetAt(win, x, y);
    if (!t) { this.snapEl.classList.remove('show'); return; }
    const r = t.tiledRect;
    Object.assign(this.snapEl.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
    this.snapEl.classList.add('show');
  },
  /** "Show desktop": minimize everything, or restore what was minimized by the last call. */
  toggleDesktop() {
    const visible = this.list().filter(w => !w.minimized);
    if (visible.length) { this._shown = visible.map(w => w.id); visible.forEach(w => this.minimize(w)); }
    else if (this._shown) {
      this._shown.map(id => this.wins.get(id)).filter(Boolean).reverse().forEach(w => this.focus(w));
      this._shown = null;
    }
  }
};

/* ===================== 7. Desktop ===================== */
const Desktop = {
  get G() { return DESK_GRID[Settings.get('deskIconSize')] || DESK_GRID.m; },   // icon grid cell size and origin
  positions: {},                         // key -> {c, r}
  selected: new Set(),
  nodes: new Map(),                      // key -> {node, item}

  init() {
    this.el = $('#icons');
    this.selEl = $('#sel-rect');
    this.positions = Store.get('iconPositions', {});
    this.el.addEventListener('pointerdown', e => this.onBgDown(e));
    this.el.addEventListener('contextmenu', e => {
      e.preventDefault();
      if (e.target === this.el) this.bgMenu(e.clientX, e.clientY);
    });
    Bus.on('fs', () => this.render());
    Bus.on('apps', () => this.render());
    // Keep desktop file icons attached to their note when it is renamed anywhere (desktop, terminal mv).
    Bus.on('fs:rename', ({ from, to }) => {
      const keys = this.keys(), i = keys.indexOf('file:' + from);
      if (i < 0) return;
      keys[i] = 'file:' + to;
      if (this.positions['file:' + from]) this.positions['file:' + to] = this.positions['file:' + from];
      Store.set('desktop.items', keys);
      this.render();
    });
    let t;
    window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(() => this.render(), 150); });
    this.render();
  },
  save() { Store.set('iconPositions', this.positions); },
  dims() {
    const w = this.el.clientWidth || window.innerWidth, hh = this.el.clientHeight || window.innerHeight - 52;
    const isSmall = window.innerWidth < 700;
    const gw = isSmall ? 80 : this.G.w;
    return { cols: Math.max(1, Math.floor((w - this.G.ox) / gw)), rows: Math.max(1, Math.floor((hh - this.G.oy) / this.G.h)), gw };
  },
  cellPx(c) { const { gw } = this.dims(); return { x: this.G.ox + c.c * gw, y: this.G.oy + c.r * this.G.h }; },
  pxCell(x, y) {
    const { cols, rows, gw } = this.dims();
    return { c: clamp(Math.round((x - this.G.ox) / gw), 0, cols - 1), r: clamp(Math.round((y - this.G.oy) / this.G.h), 0, rows - 1) };
  },
  /** Find a free cell: nearest to `near`, or the first in column-major order. */
  freeCell(occ, near) {
    const { cols, rows } = this.dims();
    let best = null, bd = Infinity;
    for (let c = 0; c < cols; c++) for (let r = 0; r < rows; r++) {
      if (occ.has(c + ',' + r)) continue;
      const d = near ? (c - near.c) ** 2 + (r - near.r) ** 2 : c * 1000 + r;
      if (d < bd) { bd = d; best = { c, r }; }
    }
    return best || { c: 0, r: 0 };
  },
  /** Everything shown on the desktop: apps flagged `desktop` plus every note. */
  /* The desktop starts empty and only shows what the user puts there: apps added with
     "Add to Desktop" and text files created on / dropped onto the desktop. Installing an app
     or saving a note elsewhere never adds an icon. Stored as keys like "app:paint", "file:a.txt". */
  keys() { return Store.get('desktop.items', []); },
  has(key) { return this.keys().includes(key); },
  /** Mark a key as on the desktop without redrawing (used right before the file is written). */
  addQuiet(key) { if (!this.has(key)) Store.set('desktop.items', this.keys().concat(key)); },
  add(key) { this.addQuiet(key); this.render(); },
  remove(key) { Store.set('desktop.items', this.keys().filter(k => k !== key)); this.selected.delete(key); this.render(); },
  toggleApp(id) {
    const key = 'app:' + id, on = !this.has(key);
    if (on) this.add(key); else this.remove(key);
    Toast.show(on ? 'Added to Desktop' : 'Removed from Desktop', (Apps.get(id) || {}).name || id, on ? 'plus' : 'trash', 1800);
  },
  items() {
    return this.keys().map(key => {
      if (key.startsWith('app:')) {
        const a = Apps.get(key.slice(4));
        return a && { key, name: a.name, type: 'app', app: a, tile: tile(a.icon, a.color), open: () => WM.open(a.id) };
      }
      const n = key.slice(5);
      return FS.exists(n) && { key, name: n, type: 'file', file: n, tile: fileTile(), open: () => WM.open('notepad', { file: n }) };
    }).filter(Boolean);
  },
  render() {
    const items = this.items(), occ = new Set(), { cols, rows } = this.dims(), placed = [], pending = [];
    this.el.querySelectorAll('.d-icon').forEach(n => n.remove());
    this.nodes.clear();
    items.forEach(it => {
      const p = this.positions[it.key];
      if (p && p.c < cols && p.r < rows && !occ.has(p.c + ',' + p.r)) { occ.add(p.c + ',' + p.r); placed.push([it, p]); }
      else pending.push(it);
    });
    pending.forEach(it => {
      const p = this.freeCell(occ);
      occ.add(p.c + ',' + p.r);
      if (!this.positions[it.key]) this.positions[it.key] = p; // keep saved spots that just don't fit right now
      placed.push([it, p]);
    });
    placed.forEach(([it, p]) => {
      const n = this.makeIcon(it), { x, y } = this.cellPx(p);
      n.style.left = x + 'px'; n.style.top = y + 'px';
      this.el.appendChild(n);
      this.nodes.set(it.key, { node: n, item: it });
    });
    // Keep positions for everything still listed (a file mid-rename is briefly missing from FS).
    const keys = new Set(items.map(i => i.key)), listed = new Set(this.keys());
    Object.keys(this.positions).forEach(k => { if (!listed.has(k)) delete this.positions[k]; });
    [...this.selected].forEach(k => { if (!keys.has(k)) this.selected.delete(k); });
    this.paintSelection();
    this.save();
  },
  refresh() {
    this.render();
    this.el.classList.remove('refreshing'); void this.el.offsetWidth; this.el.classList.add('refreshing');
    setTimeout(() => this.el.classList.remove('refreshing'), 450);
  },
  makeIcon(it) {
    const n = h(`<div class="d-icon" data-key="${esc(it.key)}" title="${esc(it.name)}">${it.tile}<span>${esc(it.name)}</span></div>`);
    n.addEventListener('pointerdown', e => this.onIconDown(e, it, n));
    n.addEventListener('dblclick', () => it.open());
    n.addEventListener('contextmenu', e => {
      e.preventDefault(); e.stopPropagation();
      if (!this.selected.has(it.key)) this.select([it.key]);
      this.iconMenu(e.clientX, e.clientY, it);
    });
    return n;
  },
  select(keys) { this.selected = new Set(keys); this.paintSelection(); },
  paintSelection() { this.nodes.forEach(({ node }, k) => node.classList.toggle('selected', this.selected.has(k))); },

  onIconDown(e, it, node) {
    if (e.button !== 0) return;
    e.stopPropagation();
    ContextMenu.hide();
    WM.blurAll();
    if (e.ctrlKey || e.metaKey) {
      if (this.selected.has(it.key)) this.selected.delete(it.key); else this.selected.add(it.key);
      this.paintSelection();
      return;
    }
    if (!this.selected.has(it.key)) this.select([it.key]);
    const sx = e.clientX, sy = e.clientY;
    const group = [...this.selected].map(k => this.nodes.get(k)).filter(Boolean)
      .map(({ node: n }) => ({ k: n.dataset.key, n, x: n.offsetLeft, y: n.offsetTop }));
    let moved = false;
    try { node.setPointerCapture(e.pointerId); } catch {}
    const onMove = ev => {
      const dx = ev.clientX - sx, dy = ev.clientY - sy;
      if (!moved && Math.hypot(dx, dy) < 5) return;
      moved = true;
      group.forEach(g => { g.n.classList.add('dragging'); g.n.style.left = g.x + dx + 'px'; g.n.style.top = g.y + dy + 'px'; });
    };
    const onUp = () => {
      node.removeEventListener('pointermove', onMove);
      node.removeEventListener('pointerup', onUp);
      node.removeEventListener('pointercancel', onUp);
      if (moved) this.drop(group);
      else if (e.pointerType === 'touch') it.open(); // single tap opens on touch screens
    };
    node.addEventListener('pointermove', onMove);
    node.addEventListener('pointerup', onUp);
    node.addEventListener('pointercancel', onUp);
  },
  /** Snap dragged icons to the grid, avoiding occupied cells. */
  drop(group) {
    const moving = new Set(group.map(g => g.k)), occ = new Set();
    this.nodes.forEach(({ node }, k) => {
      if (moving.has(k)) return;
      const c = this.pxCell(node.offsetLeft, node.offsetTop);
      occ.add(c.c + ',' + c.r);
    });
    group.forEach(g => {
      let cell = this.pxCell(g.n.offsetLeft, g.n.offsetTop);
      if (occ.has(cell.c + ',' + cell.r)) cell = this.freeCell(occ, cell);
      occ.add(cell.c + ',' + cell.r);
      this.positions[g.k] = cell;
      g.n.classList.remove('dragging');
      const { x, y } = this.cellPx(cell);
      g.n.style.left = x + 'px'; g.n.style.top = y + 'px';
    });
    this.save();
  },
  /** Rubber-band selection on empty desktop space. */
  onBgDown(e) {
    if (e.target !== this.el || e.button !== 0) return;
    WM.blurAll();
    const additive = e.ctrlKey || e.metaKey, base = additive ? new Set(this.selected) : new Set();
    if (!additive) this.select([]);
    const r = this.el.getBoundingClientRect(), sx = e.clientX - r.left, sy = e.clientY - r.top;
    let active = false;
    try { this.el.setPointerCapture(e.pointerId); } catch {}
    const onMove = ev => {
      const x = clamp(ev.clientX - r.left, 0, r.width), y = clamp(ev.clientY - r.top, 0, r.height);
      if (!active && Math.hypot(x - sx, y - sy) < 4) return;
      active = true;
      const L = Math.min(x, sx), T = Math.min(y, sy), W = Math.abs(x - sx), H = Math.abs(y - sy);
      Object.assign(this.selEl.style, { display: 'block', left: L + 'px', top: T + 'px', width: W + 'px', height: H + 'px' });
      const sel = new Set(base);
      this.nodes.forEach(({ node }, k) => {
        const nl = node.offsetLeft, nt = node.offsetTop, nr = nl + node.offsetWidth, nb = nt + node.offsetHeight;
        if (nl < L + W && nr > L && nt < T + H && nb > T) sel.add(k);
      });
      this.selected = sel;
      this.paintSelection();
    };
    const onUp = () => {
      this.el.removeEventListener('pointermove', onMove);
      this.el.removeEventListener('pointerup', onUp);
      this.el.removeEventListener('pointercancel', onUp);
      this.selEl.style.display = 'none';
    };
    this.el.addEventListener('pointermove', onMove);
    this.el.addEventListener('pointerup', onUp);
    this.el.addEventListener('pointercancel', onUp);
  },
  bgMenu(x, y) {
    ContextMenu.show(x, y, [
      { label: 'Refresh', icon: 'reload', hint: 'F5', action: () => this.refresh() },
      { label: 'Change Wallpaper', icon: 'image', action: () => Theme.nextWallpaper() },
      { label: 'Sort icons by name', icon: 'sort', action: () => { this.positions = {}; this.refresh(); } },
      '-',
      { label: 'New Text File', icon: 'file', action: () => this.newFile(x, y) },
      { label: 'Add App to Desktop…', icon: 'apps', action: () => { StartMenu.show(); Toast.show('Add an app', 'Right-click any app here and choose “Add to Desktop”.', 'apps', 3500); } },
      { label: 'Open Terminal', icon: 'terminal', hint: 'Ctrl+Alt+T', action: () => WM.open('terminal') },
      '-',
      { label: 'Add Widget…', icon: 'plus', action: () => WM.open('settings', { section: 'widgets' }) },
      { label: 'Themes…', icon: 'sparkle', action: () => WM.open('settings', { section: 'themes' }) },
      { label: 'Personalize Windows…', icon: 'workspaces', action: () => WM.open('settings', { section: 'windows' }) },
      { label: Settings.get('theme') === 'dark' ? 'Switch to light theme' : 'Switch to dark theme', icon: Settings.get('theme') === 'dark' ? 'sun' : 'moon', action: () => Theme.toggle() },
      { label: 'Settings', icon: 'settings', action: () => WM.open('settings', { section: 'appearance' }) }
    ]);
  },
  iconMenu(x, y, it) {
    const items = [{ label: 'Open', icon: it.type === 'app' ? 'external' : 'file', action: () => it.open() }];
    if (it.type === 'app') {
      const pinned = Settings.get('pinned').includes(it.app.id);
      items.push({ label: pinned ? 'Remove from Dock' : 'Add to Dock', icon: 'grid', action: () => Taskbar.togglePin(it.app.id) });
      items.push('-');
      items.push({ label: 'Remove from Desktop', icon: 'close', hint: 'Del', action: () => this.remove(it.key) });
    } else {
      items.push({ label: 'Download as .txt', icon: 'download', action: () => downloadBlob(new Blob([FS.read(it.file) || ''], { type: 'text/plain' }), it.file) });
      items.push('-');
      items.push({ label: 'Rename', icon: 'edit', hint: 'F2', action: () => this.renameFile(it.file) });
      items.push({ label: 'Remove from Desktop', icon: 'close', action: () => this.remove(it.key) });
      items.push({ label: 'Delete File', icon: 'trash', hint: 'Del', danger: true, action: () => this.deleteFiles([it.file]) });
    }
    ContextMenu.show(x, y, items);
  },
  async newFile(x, y) {
    const name = await Dialog.prompt('New text file', 'Name your file:', FS.uniqueName('New Text File.txt'), { okText: 'Create' });
    if (name == null) return;
    const n = FS.normalize(name);
    if (!FS.valid(n)) { Toast.show('Invalid name', 'Names cannot contain / \\ < > : " | ? *', 'info'); return; }
    if (FS.exists(n)) { Toast.show('File already exists', n, 'info'); return; }
    if (x != null) {
      const r = this.el.getBoundingClientRect(), occ = new Set();
      this.nodes.forEach(({ node }) => { const c = this.pxCell(node.offsetLeft, node.offsetTop); occ.add(c.c + ',' + c.r); });
      this.positions['file:' + n] = this.freeCell(occ, this.pxCell(x - r.left - 40, y - r.top - 30));
    }
    this.addQuiet('file:' + n);
    FS.write(n, '');
    this.select(['file:' + n]);
    Toast.show('File created', n, 'file', 2500);
  },
  async renameFile(name) {
    const v = await Dialog.prompt('Rename', `Rename "${name}" to:`, name, { okText: 'Rename' });
    if (v == null) return;
    const n = FS.normalize(v);
    if (n === name) return;
    if (!FS.valid(n)) { Toast.show('Invalid name', 'Names cannot contain / \\ < > : " | ? *', 'info'); return; }
    if (FS.exists(n)) { Toast.show('A file with that name exists', n, 'info'); return; }
    FS.rename(name, n);
    Bus.emit('fs:rename', { from: name, to: n });
  },
  async deleteFiles(names) {
    if (!names.length) return;
    const ok = await Dialog.confirm(names.length > 1 ? `Delete ${names.length} files?` : `Delete "${names[0]}"?`, 'This cannot be undone.', { okText: 'Delete', danger: true });
    if (!ok) return;
    Store.set('desktop.items', this.keys().filter(k => !names.includes(k.slice(5)) || !k.startsWith('file:')));
    names.forEach(n => FS.remove(n));
    Toast.show(names.length > 1 ? 'Files deleted' : 'File deleted', names.join(', '), 'trash', 2500);
  },
  /** Files dropped on the desktop: text → notes, image → wallpaper, audio → Music, anything else → Browser (blob). */
  async dropFiles(files, x, y) {
    for (const f of files) {
      if (isTextFile(f)) {
        if (f.size > 1024 * 1024) { Toast.show('File too large', `${f.name} is over 1 MB.`, 'info'); continue; }
        let name = FS.normalize(f.name.replace(/[\/\\<>:"|?*]/g, '_'));
        if (FS.exists(name)) name = FS.uniqueName(name);
        if (x != null) {
          const r = this.el.getBoundingClientRect(), occ = new Set();
          this.nodes.forEach(({ node }) => { const c = this.pxCell(node.offsetLeft, node.offsetTop); occ.add(c.c + ',' + c.r); });
          this.positions['file:' + name] = this.freeCell(occ, this.pxCell(x - r.left - 40, y - r.top - 30));
        }
        const text = await f.text();
        this.addQuiet('file:' + name);
        FS.write(name, text);
        Toast.show('File imported', name, 'file', 2500);
      } else if (f.type.startsWith('image/')) {
        if (await Dialog.confirm('Set as wallpaper?', `Use "${f.name}" as your desktop wallpaper? Choose Cancel to view it in the Web Browser instead.`, { okText: 'Set wallpaper' })) {
          try { Theme.setCustomWallpaper(await imageToDataUri(f)); } catch { Toast.show('Could not read image', f.name, 'info'); }
        } else WM.open('browser', { file: f });
      } else if (f.type.startsWith('audio/')) WM.open('music', { files: [f] });
      else WM.open('browser', { file: f });
    }
  },
  /** Keyboard handling when no window is focused. */
  onKey(e) {
    const keys = [...this.selected];
    const files = keys.filter(k => k.startsWith('file:')).map(k => k.slice(5));
    if (e.key === 'Enter' && keys.length) { keys.forEach(k => { const n = this.nodes.get(k); if (n) n.item.open(); }); }
    else if (e.key === 'Delete' && keys.length) {
      keys.filter(k => k.startsWith('app:')).forEach(k => this.remove(k));
      if (files.length) this.deleteFiles(files);
    }
    else if (e.key === 'F2' && files.length === 1) { e.preventDefault(); this.renameFile(files[0]); }
    else if (e.key === 'F5') { e.preventDefault(); this.refresh(); }
    else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a') { e.preventDefault(); this.select([...this.nodes.keys()]); }
  }
};

/* ===================== 8. Dock & top panel ===================== */
/** The dock (bottom): Workspaces + Applications launchers, then pinned and running apps. */
const Taskbar = {
  init() {
    this.appsEl = $('#tb-apps');
    $('#start-btn').innerHTML = tile('apps', 'linear-gradient(135deg,#f2f0ee,#b3ada8)');
    $('#ws-btn').innerHTML = tile('workspaces', 'linear-gradient(135deg,#f2f0ee,#b3ada8)');
    $('#start-btn').addEventListener('click', e => { e.stopPropagation(); StartMenu.toggle(); });
    $('#ws-btn').addEventListener('click', e => { e.stopPropagation(); Overview.toggle(); });
    $('#dock').addEventListener('contextmenu', e => { if (!e.target.closest('.tb-btn[data-app]')) e.preventDefault(); });
    Bus.on('wm', () => this.render());
    Bus.on('settings', ({ key }) => { if (key === 'pinned') this.render(); });
    Bus.on('apps', () => this.render());
    this.render();
  },
  buttonFor(appId) { return this.appsEl.querySelector(`.tb-btn[data-app="${appId}"]`); },
  bounce(appId) {
    if (!Settings.get('dockBounce')) return;
    const b = this.buttonFor(appId);
    if (!b) return;
    b.classList.remove('launch'); void b.offsetWidth; b.classList.add('launch');
  },
  /** Diff-render the pinned + running app buttons (keeps DOM nodes stable). */
  render() {
    const pinned = Settings.get('pinned').filter(id => Apps.get(id));
    const running = [...new Set(WM.list().map(w => w.appId))].reverse();
    const ids = pinned.concat(running.filter(id => !pinned.includes(id)));
    const existing = new Map($$('.tb-btn[data-app]', this.appsEl).map(b => [b.dataset.app, b]));
    ids.forEach((id, i) => {
      let b = existing.get(id);
      if (!b) b = this.makeBtn(id);
      existing.delete(id);
      if (this.appsEl.children[i] !== b) this.appsEl.insertBefore(b, this.appsEl.children[i] || null);
      const wins = WM.windowsOf(id);
      b.classList.toggle('running', wins.length > 0);
      b.classList.toggle('active', !!WM.active && WM.active.appId === id);
      b.title = wins.length > 1 ? `${Apps.get(id).name} (${wins.length} windows)` : wins[0] ? wins[0].title : Apps.get(id).name;
    });
    existing.forEach(b => b.remove());
  },
  makeBtn(id) {
    const app = Apps.get(id);
    const b = h(`<button class="tb-btn" data-app="${id}">${tile(app.icon, app.color)}</button>`);
    b.addEventListener('click', () => this.clickApp(id));
    b.addEventListener('contextmenu', e => { e.preventDefault(); this.appMenu(e.clientX, e.clientY, id); });
    return b;
  },
  /** Dock click: open, focus, or toggle minimize/restore. */
  clickApp(id) {
    Overview.hide();
    const wins = WM.windowsOf(id);
    if (!wins.length) { WM.open(id); return; }
    if (WM.active && WM.active.appId === id) {
      if (wins.length > 1) WM.focus(wins[wins.length - 1]); // several windows: cycle through them
      else WM.minimize(WM.active);
    } else WM.focus(wins.find(w => !w.minimized) || wins[0]);
  },
  appMenu(x, y, id) {
    const app = Apps.get(id), wins = WM.windowsOf(id), pinned = Settings.get('pinned').includes(id);
    const items = [{ title: app.name }];
    wins.forEach(w => items.push({ label: w.title, icon: w.minimized ? 'min' : 'max', action: () => WM.focus(w) }));
    if (wins.length) items.push('-');
    if (!app.singleton || !wins.length) items.push({ label: wins.length ? 'New Window' : 'Open', icon: 'plus', action: () => WM.open(id) });
    items.push({ label: pinned ? 'Remove from Favorites' : 'Add to Favorites', icon: 'grid', action: () => this.togglePin(id) });
    items.push({ label: Desktop.has('app:' + id) ? 'Remove from Desktop' : 'Add to Desktop', icon: 'workspaces', action: () => Desktop.toggleApp(id) });
    if (wins.length) items.push({ label: wins.length > 1 ? `Quit ${wins.length} Windows` : 'Quit', icon: 'close', danger: true, action: () => wins.forEach(w => WM.close(w)) });
    ContextMenu.show(x, y, items);
    // Show the menu above the dock
    const m = ContextMenu.el;
    if (m && !['ubuntu', 'unity'].includes(Shell.layout()) && !['left', 'right'].includes(document.documentElement.dataset.cDock)) m.style.top = Math.max(8, $('#dock').getBoundingClientRect().top - m.offsetHeight - 8) + 'px';
  },
  togglePin(id) {
    const p = Settings.get('pinned').slice(), i = p.indexOf(id);
    if (i >= 0) p.splice(i, 1); else p.push(id);
    Settings.set('pinned', p);
  }
};

/** The top panel: Workspaces / Applications, clock + calendar, and the system menu. */
const Panel = {
  calOffset: 0,
  battery: null,
  init() {
    $('#pn-workspaces .pn-ico').innerHTML = svg('workspaces');
    $('#pn-apps .pn-ico').innerHTML = svg('apps');
    $('#pn-workspaces').addEventListener('click', e => { e.stopPropagation(); Overview.toggle(); });
    $('#pn-apps').addEventListener('click', e => { e.stopPropagation(); StartMenu.toggle(); });
    $('#pn-tile').addEventListener('click', () => WM.setTiling(!Settings.get('tiling')));
    $('#pn-clock').addEventListener('click', () => this.togglePop('#cal-pop', () => { this.calOffset = 0; this.renderCal(); this.renderNotifs(); }));
    $('#pn-status').addEventListener('click', () => this.togglePop('#sys-menu', () => this.syncSys()));
    $('#panel').addEventListener('contextmenu', e => e.preventDefault());

    // Calendar
    $('#cal-prev').innerHTML = svg('back'); $('#cal-next').innerHTML = svg('forward');
    $('#cal-prev').addEventListener('click', () => { this.calOffset--; this.renderCal(); });
    $('#cal-next').addEventListener('click', () => { this.calOffset++; this.renderCal(); });
    $('#cal-clock').addEventListener('click', () => { this.closePops(); WM.open('clock'); });
    $('#notif-clear').addEventListener('click', () => { NotifHistory.length = 0; this.renderNotifs(); });

    // System menu
    const QS_ICONS = { wifi: 'wifi', dark: 'moon', tile: 'tiles', hint: 'hint', night: 'nightlight', dnd: 'bellOff', focus: 'focus', saver: 'leafBolt' };
    $$('.qs', $('#sys-menu')).forEach(b => { $('.qs-ico', b).innerHTML = svg(QS_ICONS[b.dataset.qs]); });
    const SI = { settings: 'settings', lock: 'lock', restart: 'reload', shutdown: 'power', logout: 'logout' };
    $$('.sys-item', $('#sys-menu')).forEach(b => { $('.si', b).innerHTML = svg(SI[b.dataset.sys]); });
    $('#sys-menu').addEventListener('click', async e => {
      const q = e.target.closest('[data-qs]');
      if (q) {
        ({
          wifi: () => Toast.show(navigator.onLine ? 'Connected' : 'No connection', navigator.onLine ? 'Your device is online.' : 'Check your network connection.', navigator.onLine ? 'wifi' : 'wifiOff', 2200),
          dark: () => Theme.toggle(),
          tile: () => WM.setTiling(!Settings.get('tiling')),
          hint: () => Settings.set('activeHint', !Settings.get('activeHint')),
          night: () => Settings.set('nightLight', !Settings.get('nightLight')),
          dnd: () => Settings.set('dnd', !Settings.get('dnd')),
          focus: () => { this.closePops(); FocusMode.toggle(); },
          saver: () => Settings.set('powerSaver', !Settings.get('powerSaver'))
        })[q.dataset.qs]();
        this.syncSys();
        return;
      }
      const it = e.target.closest('[data-sys]');
      if (!it) return;
      this.closePops();
      const act = it.dataset.sys;
      if (act === 'settings') WM.open('settings');
      else if (act === 'lock' || act === 'logout') Session.lock();
      else if (act === 'restart' && await Dialog.confirm('Restart', 'Restart SanjivramOS now? Open windows will be closed.', { okText: 'Restart' })) Session.restart();
      else if (act === 'shutdown' && await Dialog.confirm('Power Off', 'Power off SanjivramOS now? Open windows will be closed.', { okText: 'Power Off', danger: true })) Session.shutdown();
    });
    const range = $('#vol-range');
    range.addEventListener('input', () => { Settings.set('volume', +range.value); if (Settings.get('muted')) Settings.set('muted', false); });
    range.addEventListener('change', () => Sound.beep(660, 0.12));
    $('#vol-mute').addEventListener('click', () => Settings.set('muted', !Settings.get('muted')));
    $('#bri-ico').innerHTML = svg('sun');
    $('#bri-range').addEventListener('input', e => Settings.set('brightness', +e.target.value));

    // Status icons + live updates
    $('#st-power').innerHTML = svg('power');
    window.addEventListener('online', () => { this.syncStatus(); Toast.show('Back online', 'Your internet connection was restored.', 'wifi'); });
    window.addEventListener('offline', () => { this.syncStatus(); Toast.show('You are offline', 'Web apps may not load.', 'wifiOff'); });
    if (navigator.getBattery) navigator.getBattery().then(b => {
      this.battery = b;
      ['levelchange', 'chargingchange'].forEach(ev => b.addEventListener(ev, () => this.syncStatus()));
      this.syncStatus();
    }).catch(() => {});
    Bus.on('settings', ({ key }) => {
      if (['volume', 'muted', 'tiling', 'activeHint', 'theme', 'nightLight', 'dnd', 'brightness', 'pnBatPct', 'powerSaver'].includes(key)) { this.syncStatus(); this.syncSys(); }
      if (['clock24', 'clockSeconds', 'clockDate', 'deskClock', 'clockFormat'].includes(key)) tick();
    });

    const tick = () => {
      const d = new Date(), h12 = !Settings.get('clock24');
      const time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: h12 });
      $('#tray-time').textContent = Settings.get('clockSeconds') ? d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: h12 }) : time;
      $('#tray-date').textContent = Settings.get('clockDate') ? fmtPanelDate(d) : '';
      $('#lock-time').textContent = time;
      $('#lock-date').textContent = d.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
      if (Settings.get('deskClock')) {
        $('#desk-clock .dc-time').textContent = time;
        $('#desk-clock .dc-date').textContent = d.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
      }
    };
    tick();
    setInterval(tick, 1000);
    this.syncStatus();
  },
  closePops() { $$('.popover.open').forEach(p => p.classList.remove('open')); $('#pn-clock').classList.remove('on'); $('#pn-status').classList.remove('on'); },
  togglePop(sel, beforeOpen) {
    const p = $(sel), open = !p.classList.contains('open');
    StartMenu.hide(); Overview.hide(); ContextMenu.hide();
    this.closePops();
    if (open) { beforeOpen && beforeOpen(); p.classList.add('open'); (sel === '#cal-pop' ? $('#pn-clock') : $('#pn-status')).classList.add('on'); }
  },
  batteryIcon() {
    const b = this.battery;
    if (!b) return '';
    const w = Math.max(1, Math.round(13 * b.level));
    return `<svg viewBox="0 0 24 24"><rect x="2" y="7" width="18" height="10" rx="2.5"/><path d="M22 11v2"/><rect x="4.5" y="9.5" width="${w}" height="5" rx="1" fill="currentColor" stroke="none"/>${b.charging ? '<path d="M11.5 8.5l-2 4h3l-2 4" stroke="#111" stroke-width="1.6"/>' : ''}</svg>`;
  },
  syncStatus() {
    const muted = Settings.get('muted') || Settings.get('volume') === 0;
    $('#st-wifi').innerHTML = svg(navigator.onLine ? 'wifi' : 'wifiOff');
    $('#st-vol').innerHTML = svg(muted ? 'volumeOff' : 'volume');
    $('#st-bat').innerHTML = this.batteryIcon() + (Settings.get('pnBatPct') && this.battery ? `<span class="bat-pct">${Math.round(this.battery.level * 100)}%</span>` : '');
    $('#st-dnd').innerHTML = Settings.get('dnd') ? svg('bellOff') : '';
    $('#bri-range').value = Settings.get('brightness');
    $('#bri-val').textContent = Settings.get('brightness') + '%';
    $('#pn-tile').innerHTML = svg('tiles');
    $('#pn-tile').classList.toggle('on', !!Settings.get('tiling'));
    $('#vol-mute').innerHTML = svg(muted ? 'volumeOff' : 'volume');
    $('#vol-range').value = Settings.get('volume');
    $('#vol-val').textContent = Settings.get('muted') ? 'Mute' : Settings.get('volume') + '%';
  },
  syncSys() {
    const set = (k, on, sub) => { const b = $(`[data-qs="${k}"]`); b.classList.toggle('on', on); $('.qs-sub', b).textContent = sub; };
    set('wifi', navigator.onLine, navigator.onLine ? 'Connected' : 'Offline');
    set('dark', Settings.get('theme') === 'dark', Settings.get('theme') === 'dark' ? 'On' : 'Off');
    set('tile', !!Settings.get('tiling'), Settings.get('tiling') ? 'On' : 'Off');
    set('hint', !!Settings.get('activeHint'), Settings.get('activeHint') ? 'On' : 'Off');
    set('night', !!Settings.get('nightLight'), Settings.get('nightLight') ? 'On' : 'Off');
    set('dnd', !!Settings.get('dnd'), Settings.get('dnd') ? 'Banners hidden' : 'Off');
    set('focus', FocusMode.on, FocusMode.on ? 'On' : 'Off');
    set('saver', !!Settings.get('powerSaver'), Settings.get('powerSaver') ? 'Effects off' : 'Off');
    $('#sys-batt').textContent = this.battery ? `${Math.round(this.battery.level * 100)}%${this.battery.charging ? ' ⚡' : ''}` : '';
  },
  renderCal() {
    const now = new Date(), view = new Date(now.getFullYear(), now.getMonth() + this.calOffset, 1);
    $('#cal-dow').textContent = now.toLocaleDateString([], { weekday: 'long' });
    $('#cal-date').textContent = now.toLocaleDateString([], { month: 'long', day: 'numeric', year: 'numeric' });
    $('#cal-month').textContent = view.toLocaleDateString([], { month: 'long', year: 'numeric' });
    const start = new Date(view); start.setDate(1 - view.getDay());
    let html = ['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(d => `<div class="dow">${d}</div>`).join('');
    for (let i = 0; i < 42; i++) {
      const d = new Date(start); d.setDate(start.getDate() + i);
      const cls = d.toDateString() === now.toDateString() ? ' today' : d.getMonth() !== view.getMonth() ? ' other' : '';
      html += `<div class="d${cls}">${d.getDate()}</div>`;
    }
    $('#cal-grid').innerHTML = html;
  },
  renderNotifs() {
    $('#notif-list').innerHTML = NotifHistory.length
      ? NotifHistory.map(n => `<div class="notif">${svg(n.icon)}<div><b>${esc(n.title)}</b>${n.msg ? `<div>${esc(n.msg)}</div>` : ''}<small>${relTime(n.time)}</small></div></div>`).join('')
      : `<div class="notif-empty">${svg('bell')}<br>No Notifications</div>`;
    $('#notif-clear').disabled = !NotifHistory.length;
  }
};

/** Layout-specific shell bits: start button artwork, labels and the macOS/Unity global menu. */
const WIN_LOGO = '<svg viewBox="0 0 24 24" class="start-logo"><rect x="3" y="3" width="8.4" height="8.4" rx="1.2" fill="currentColor" stroke="none"/><rect x="12.6" y="3" width="8.4" height="8.4" rx="1.2" fill="currentColor" stroke="none"/><rect x="3" y="12.6" width="8.4" height="8.4" rx="1.2" fill="currentColor" stroke="none"/><rect x="12.6" y="12.6" width="8.4" height="8.4" rx="1.2" fill="currentColor" stroke="none"/></svg>';
const Shell = {
  ready: false,
  init() {
    this.ready = true;
    $('.pn-menus').addEventListener('click', e => { const b = e.target.closest('[data-gm]'); if (b) this.menu(b.dataset.gm, b); });
    Bus.on('wm', () => this.syncAppName());
    this.applyLayout();
  },
  layout() { return document.documentElement.dataset.layout || 'pop'; },
  applyLayout() {
    const L = this.layout(), light = 'linear-gradient(135deg,#f2f0ee,#b3ada8)';
    $('#pn-workspaces .pn-label').textContent = L === 'ubuntu' || L === 'gnome' ? 'Activities' : 'Workspaces';
    $('#pn-apps .pn-ico').innerHTML = L === 'mac' ? LOGO : svg('apps');
    const sb = $('#start-btn');
    sb.innerHTML = L === 'windows' ? WIN_LOGO
      : L === 'chromeos' ? '<svg viewBox="0 0 24 24" class="start-logo"><circle cx="12" cy="12" r="7" stroke-width="2.6"/></svg>'
      : L === 'unity' ? tile('apps', 'linear-gradient(135deg,#f6915e,#c34113)')
      : L === 'kde' ? tile('apps', 'linear-gradient(135deg,#3daee9,#1d6fa5)')
      : L === 'cinnamon' ? tile('apps', 'linear-gradient(135deg,#a3d36b,#5a8f2a)')
      : L === 'retro' ? WIN_LOGO + '<span>Start</span>'
      : tile('apps', light);
    sb.title = { windows: 'Start', mac: 'Launchpad', chromeos: 'Launcher', unity: 'Dash', kde: 'Application Launcher', cinnamon: 'Menu', retro: 'Start', gnome: 'Show Apps' }[L] || 'Applications';
    $('#ws-btn').title = L === 'windows' ? 'Task View' : 'Workspaces';
    this.syncAppName();
    requestAnimationFrame(() => { WM.fitAll(); Desktop.render(); });
  },
  syncAppName() { if (!$('#pn-appname')) return; $('#pn-appname').textContent = WM.active ? WM.active.app.name : 'Desktop'; },
  /** Global menu bar (macOS / Unity). */
  menu(kind, btn) {
    const w = WM.active, r = btn.getBoundingClientRect();
    const items = {
      file: [
        { label: 'New Window', icon: 'plus', disabled: !w || w.app.singleton, action: () => WM.open(w.appId) },
        { label: 'Open Applications', icon: 'apps', hint: 'Ctrl+Alt+A', action: () => StartMenu.show() },
        '-',
        { label: 'Close Window', icon: 'close', hint: 'Alt+F4', disabled: !w, action: () => WM.close(w) },
        { label: w ? `Quit ${w.app.name}` : 'Quit', icon: 'power', disabled: !w, action: () => WM.windowsOf(w.appId).forEach(x => WM.close(x)) }
      ],
      view: [
        { label: document.fullscreenElement ? 'Exit Full Screen' : 'Enter Full Screen', icon: 'fullscreen', action: () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()).catch(() => {}) },
        { label: 'Show Workspaces', icon: 'workspaces', hint: 'Ctrl+Alt+W', action: () => Overview.show() },
        { label: 'Show Desktop', icon: 'grid', action: () => WM.toggleDesktop() },
        '-',
        { label: Settings.get('deskClock') ? 'Hide Desktop Clock' : 'Show Desktop Clock', icon: 'clock', action: () => Settings.set('deskClock', !Settings.get('deskClock')) },
        { label: Settings.get('theme') === 'dark' ? 'Light Appearance' : 'Dark Appearance', icon: Settings.get('theme') === 'dark' ? 'sun' : 'moon', action: () => Theme.toggle() }
      ],
      window: [
        { label: 'Minimize', icon: 'min', disabled: !w, action: () => WM.minimize(w) },
        { label: w && w.maximized ? 'Restore' : 'Zoom', icon: 'max', disabled: !w, action: () => WM.toggleMax(w) },
        { label: 'Tile Left', icon: 'back', disabled: !w, action: () => WM.snapTo(w, 'left') },
        { label: 'Tile Right', icon: 'forward', disabled: !w, action: () => WM.snapTo(w, 'right') },
        { label: w && w.onTop ? 'Don’t Keep on Top' : 'Always on Top', icon: 'pin', disabled: !w, action: () => { w.onTop = !w.onTop; w.el.classList.toggle('on-top', w.onTop); w.el.style.zIndex = w.z + (w.onTop ? 1000000 : 0); } },
        '-',
        { label: 'Bring All to Front', icon: 'workspaces', action: () => WM.list().reverse().forEach(x => WM.focus(x)) }
      ],
      help: [
        { label: 'Keyboard Shortcuts', icon: 'keyboard', hint: 'Ctrl+/', action: () => WM.open('shortcuts') },
        { label: 'Settings', icon: 'settings', action: () => WM.open('settings') },
        { label: 'About SanjivramOS', icon: 'info', action: () => WM.open('settings', { section: 'about' }) }
      ]
    }[kind];
    ContextMenu.show(r.left, r.bottom + 4, items);
  }
};

/** First-run setup assistant (also available from Settings → Reset & Recovery). */
const Setup = {
  STEPS: ['welcome', 'you', 'layout', 'look', 'apps', 'done'],
  STARTER: ['mcclassic', 'tetris', 'g2048', 'pacman', 'bloxd', 'skribbl', 'excalidraw', 'photopea', 'desmos', 'wikipedia', 'beepbox', 'weather', 'sudoku', 'stackblitz', 'lofi', 'maps'],
  step: 0, picks: null,
  show() {
    Session.state = 'setup';
    StartMenu.hide(); Panel.closePops(); Overview.hide(); ContextMenu.hide();
    $('#lock').classList.add('hidden');
    this.step = 0;
    this.picks = { name: Settings.get('username') === 'User' ? '' : Settings.get('username'), pin: '', apps: new Set() };
    const el = $('#setup');
    el.hidden = false;
    if (!el._wired) { el._wired = true; this.wire(el); }
    this.render();
  },
  wire(el) {
    el.addEventListener('click', e => {
      const pick = sel => { const x = e.target.closest(sel); return x && el.contains(x) ? x : null; };
      let b;
      if (pick('.su-next')) return this.next();
      if (pick('.su-back')) { this.step = Math.max(0, this.step - 1); return this.render(); }
      if (pick('.su-skip')) return this.finish(true);
      if ((b = pick('[data-pick-layout]'))) { Theme.setLayout(b.dataset.pickLayout); return this.render(); }
      if ((b = pick('[data-pick-scheme]'))) { Theme.setScheme(b.dataset.pickScheme); return this.render(); }
      if ((b = pick('[data-pick-icons]'))) { Settings.set('iconStyle', b.dataset.pickIcons); return this.render(); }
      if ((b = pick('[data-app-pick]'))) { const id = b.dataset.appPick; if (this.picks.apps.has(id)) this.picks.apps.delete(id); else this.picks.apps.add(id); b.classList.toggle('on'); return; }
      if ((b = pick('[data-su-toggle]'))) { const k = b.dataset.suToggle; Settings.set(k, !Settings.get(k)); b.classList.toggle('on', !!Settings.get(k)); }
    });
    el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); this.next(); } });
    el.addEventListener('input', e => {
      if (e.target.classList.contains('su-name')) this.picks.name = e.target.value;
      if (e.target.classList.contains('su-pin')) this.picks.pin = e.target.value;
    });
  },
  next() {
    const id = this.STEPS[this.step];
    if (id === 'you') {
      const pin = $('.su-pin', $('#setup')).value, pin2 = $('.su-pin2', $('#setup')).value;
      if (pin || pin2) {
        if (!/^\d{4,8}$/.test(pin)) { Toast.show('PIN must be 4–8 digits', 'Or leave both PIN boxes empty.', 'lock'); return; }
        if (pin !== pin2) { Toast.show('PINs don’t match', '', 'lock'); return; }
      }
      this.picks.pin = pin;
      Settings.set('username', (this.picks.name || '').trim() || 'User');
    }
    if (id === 'done') return this.finish();
    this.step++;
    this.render();
  },
  finish(skipped) {
    if (!skipped) {
      if (this.picks.pin) Settings.set('lockPin', this.picks.pin);
      this.picks.apps.forEach(id => { const e = AppStore.get(id); if (e && !AppStore.isInstalled(e)) AppStore.install(e, { quiet: true }); });
    }
    Settings.set('setupDone', true);
    Settings.set('firstLogin', true);
    $('#setup').hidden = true;
    Session.state = 'lock';
    Session.login(true);
  },
  render() {
    const id = this.STEPS[this.step], el = $('#setup');
    const sample = ['explorer', 'terminal', 'settings', 'store'].map(i => { const a = Apps.reg.get(i); return a ? tile(a.icon, a.color) : ''; }).join('');
    const body = {
      welcome: `<div class="setup-hero">${LOGO}<h1>Welcome to SanjivramOS</h1><p class="lead">Let’s set up your desktop. It takes about a minute, and you can change everything later in Settings.</p></div>`,
      you: `<h1>About you</h1><p class="lead">Your name appears on the lock screen and in the Terminal. A PIN is optional.</p>
        <div class="setup-field"><label>Your name</label><input class="input su-name" maxlength="24" placeholder="e.g. Alex" spellcheck="false" value="${esc(this.picks.name)}"></div>
        <div class="setup-field"><label>Lock screen PIN <span class="set-desc">(optional, 4–8 digits)</span></label>
          <div style="display:flex;gap:8px"><input class="input su-pin" type="password" inputmode="numeric" maxlength="8" placeholder="PIN" value="${esc(this.picks.pin)}"><input class="input su-pin2" type="password" inputmode="numeric" maxlength="8" placeholder="Confirm PIN" value="${esc(this.picks.pin)}"></div></div>`,
      layout: `<h1>Choose a layout</h1><p class="lead">Pick the desktop style you’re most comfortable with. It changes live behind this window.</p>
        <div class="layout-grid">${LAYOUTS.map(l => `<button class="layout-card${Settings.get('layout') === l.id ? ' on' : ''}" data-pick-layout="${l.id}">${layoutPreview(l.id)}<b>${l.name}${l.id === 'pop' ? ' <span class="st-badge">Default</span>' : ''}</b><small>${l.desc}</small></button>`).join('')}</div>`,
      look: `<h1>Make it yours</h1><p class="lead">Choose a colour scheme and an icon style.</p>
        <div class="scheme-grid">${SCHEMES.map(x => `<button class="scheme${Settings.get('scheme') === x.id ? ' on' : ''}" data-pick-scheme="${x.id}"><span class="sc-prev" style="--a:${x.p.bg0};--b:${x.p.bg2};--c:${x.p.bg1};--f:${x.p.fg};--x:${x.accent}"><i></i><i></i><i></i></span><span class="sc-name">${esc(x.name)}</span></button>`).join('')}</div>
        <div class="icon-grid">${ICON_STYLES.map(x => `<button class="icon-style${document.documentElement.dataset.icons === x.id ? ' on' : ''}" data-pick-icons="${x.id}"><div class="ic-prev" data-icons="${x.id}">${sample}</div><b>${x.name}</b></button>`).join('')}</div>`,
      apps: `<h1>Get some apps</h1><p class="lead">Pick a few to install now — there are 200 more in the App Store.</p>
        <div class="setup-apps">${this.STARTER.map(i => AppStore.get(i)).filter(Boolean).map(e => `<button class="setup-app${this.picks.apps.has(e.id) || AppStore.isInstalled(e) ? ' on' : ''}" data-app-pick="${e.id}">${tile(e.icon, e.color)}<span><b>${esc(e.name)}</b><small>${esc(e.cat)}</small></span></button>`).join('')}</div>
        <div class="set-card set-stack" style="margin-top:16px">
          <div class="set-row"><div class="set-text"><div class="set-label">Desktop clock</div><div class="set-desc">A big clock and date on the desktop.</div></div><button class="switch${Settings.get('deskClock') ? ' on' : ''}" data-su-toggle="deskClock"></button></div>
          <div class="set-row"><div class="set-text"><div class="set-label">Auto-tile windows</div><div class="set-desc">Arrange windows automatically, Pop Shell style.</div></div><button class="switch${Settings.get('tiling') ? ' on' : ''}" data-su-toggle="tiling"></button></div>
          <div class="set-row"><div class="set-text"><div class="set-label">Hot corner</div><div class="set-desc">Top-left corner opens Workspaces.</div></div><button class="switch${Settings.get('hotCorner') ? ' on' : ''}" data-su-toggle="hotCorner"></button></div>
        </div>`,
      done: `<div class="setup-hero"><div class="setup-check">${svg('check')}</div><h1>You’re all set${this.picks.name ? ', ' + esc(this.picks.name.trim()) : ''}!</h1>
        <p class="lead">Layout: <b>${esc((LAYOUTS.find(l => l.id === Settings.get('layout')) || LAYOUTS[0]).name)}</b> · Colours: <b>${esc(schemeOf(Settings.get('scheme')).name)}</b> · ${this.picks.apps.size} new app${this.picks.apps.size === 1 ? '' : 's'}${this.picks.pin ? ' · PIN on' : ''}</p>
        <p class="lead">Tip: press <b>Ctrl+/</b> any time to see keyboard shortcuts.</p></div>`
    }[id];
    el.innerHTML = `<div class="setup-card">
      <div class="setup-steps">${this.STEPS.map((_, i) => `<i class="${i <= this.step ? 'on' : ''}"></i>`).join('')}</div>
      <div class="setup-body">${body}</div>
      <div class="setup-foot">
        <div>${this.step > 0 ? `<button class="btn su-back">${svg('back')}Back</button>` : '<button class="btn su-skip">Skip setup</button>'}</div>
        <button class="btn primary su-next">${id === 'welcome' ? 'Get started' : id === 'done' ? 'Start using SanjivramOS' : 'Continue'}${svg('forward')}</button>
      </div></div>`;
    const f = $('.su-name', el); if (f) setTimeout(() => f.focus(), 30);
  }
};

/** Workspaces overview: every open window as a card (like GNOME Activities). */
const Overview = {
  open: false,
  init() {
    this.el = $('#overview');
    this.el.addEventListener('click', e => {
      const wsb = e.target.closest('[data-ws]'); if (wsb) { WM.switchWs(+wsb.dataset.ws); this.render(); return; }
      const x = e.target.closest('.ov-close');
      if (x) { const w = WM.wins.get(x.dataset.id); if (w) WM.close(w); return; }
      const c = e.target.closest('.ov-card');
      if (c) { const w = WM.wins.get(c.dataset.id); this.hide(); if (w) WM.focus(w); return; }
      this.hide();
    });
    Bus.on('wm', () => { if (this.open) this.render(); });
  },
  render() {
    const wins = WM.list().filter(w => WM.onWs(w)), n = WM.wsCount();
    const strip = n > 1 ? `<div class="ov-ws">${Array.from({ length: n }, (_, i) => { const k = i + 1, c = WM.list().filter(w => (w.ws || 1) === k).length; return `<button data-ws="${k}" class="${k === WM.ws ? 'on' : ''}">Workspace ${k}<small>${c} window${c === 1 ? '' : 's'}</small></button>`; }).join('')}</div>` : '';
    this.el.innerHTML = strip + (wins.length
      ? `<div class="ov-title">Workspace ${WM.ws} · ${wins.length} window${wins.length > 1 ? 's' : ''}</div>
         <div class="ov-grid">${wins.map(w => `<div class="ov-card${w.minimized ? ' min' : ''}" data-id="${w.id}" title="${esc(w.title)}">
           <button class="ov-close" data-id="${w.id}" title="Close">${svg('close')}</button>
           ${tile(w.app.icon, w.app.color)}<b>${esc(w.title)}</b><small>${esc(w.app.name)}${w.minimized ? ' · minimized' : ''}</small></div>`).join('')}</div>
         <div class="ov-hint">Click a window to switch to it · Esc to close</div>`
      : `<div class="ov-empty">No open windows${n > 1 ? ' on this workspace' : ''} — open something from the dock or Applications.</div>`);
  },
  show() {
    if (Session.state !== 'desktop') return;
    StartMenu.hide(); Panel.closePops(); ContextMenu.hide();
    this.open = true;
    this.render();
    this.el.classList.add('open');
    $('#pn-workspaces').classList.add('on'); $('#ws-btn').classList.add('on');
  },
  hide() {
    if (!this.open) return;
    this.open = false;
    this.el.classList.remove('open');
    $('#pn-workspaces').classList.remove('on'); $('#ws-btn').classList.remove('on');
  },
  toggle() { if (this.open) this.hide(); else this.show(); }
};

/* ===================== 9. Start menu ===================== */
const StartMenu = {
  open: false,
  kbd: 0,
  init() {
    this.el = $('#start-menu');
    this.search = $('#sm-search');
    $('#sm-search-ico').outerHTML = svg('search');
    $('#sm-power').innerHTML = svg('power');
    // Quick actions in the footer
    const QUICK = [['explorer', 'Files', 'folder'], ['settings', 'Settings', 'settings'], ['terminal', 'Terminal', 'terminal'], ['store', 'App Store', 'store'], ['shortcuts', 'Keyboard shortcuts (Ctrl+/)', 'keyboard'], ['#search', 'Search everything (Ctrl+Space)', 'search'], ['#theme', 'Toggle dark mode', 'moon'], ['#desktop', 'Show desktop', 'grid']];
