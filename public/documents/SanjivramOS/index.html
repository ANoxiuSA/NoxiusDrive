    $('#sm-quick').innerHTML = QUICK.map(([id, l, ic]) => `<button class="icon-btn" data-quick="${id}" title="${l}">${svg(ic)}</button>`).join('');
    $('#sm-quick').addEventListener('click', e => {
      const b = e.target.closest('[data-quick]');
      if (!b) return;
      this.hide();
      const id = b.dataset.quick;
      if (id === '#theme') Theme.toggle(); else if (id === '#desktop') WM.toggleDesktop(); else if (id === '#search') { this.hide(); Spotlight.show(); } else WM.open(id);
    });
    $('#power-menu').innerHTML = [['lock', 'lock', 'Lock'], ['logout', 'logout', 'Log Out'], ['sleep', 'sleep', 'Sleep'], ['restart', 'reload', 'Restart'], ['shutdown', 'power', 'Shut Down']]
      .map(([id, ic, l]) => `<button data-p="${id}">${svg(ic)}<span>${l}</span></button>`).join('');
    this.cat = 'all';
    this.search.addEventListener('input', () => { this.kbd = 0; this.render(); });
    $('#sm-chips').addEventListener('click', e => {
      const c = e.target.closest('[data-cat]');
      if (!c) return;
      this.cat = c.dataset.cat; this.kbd = 0;
      this.render();
      $('.sm-scroll', this.el).scrollTop = 0;
      this.search.focus();
    });
    this.search.addEventListener('keydown', e => {
      const items = $$('.sm-app, .sm-row, .sm-file', this.el);
      if (e.key === 'Enter') { e.preventDefault(); const it = items[this.kbd] || items[0]; if (it) it.click(); }
      else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); this.kbd = Math.min(items.length - 1, this.kbd + 1); this.paintKbd(); }
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); this.kbd = Math.max(0, this.kbd - 1); this.paintKbd(); }
    });
    $('#sm-power').addEventListener('click', e => { e.stopPropagation(); $('#power-menu').classList.toggle('open'); });
    $('#power-menu').addEventListener('click', e => {
      const b = e.target.closest('[data-p]');
      if (!b) return;
      $('#power-menu').classList.remove('open');
      this.hide();
      ({ lock: () => Session.lock(), logout: () => Session.lock(), sleep: () => Session.sleep(), restart: () => Session.restart(), shutdown: () => Session.shutdown() })[b.dataset.p]();
    });
    $('#sm-user').addEventListener('click', () => { this.hide(); WM.open('settings', { section: 'account' }); });
    Bus.on('fs', () => { if (this.open) this.render(); });
    Bus.on('apps', () => { if (this.open) this.render(); });
  },
  /** Apps are grouped by their App Store category; tabs filter by Favorites or a category. */
  render() {
    const q = this.search.value.trim().toLowerCase();
    const meta = new Map(AppStore.entries().map(e => [e.id, e]));
    const all = Apps.list().sort((a, b) => a.name.localeCompare(b.name));
    const catOf = a => (meta.get(a.id) || {}).cat || 'Other';
    const groups = new Map();
    all.forEach(a => { const c = catOf(a); if (!groups.has(c)) groups.set(c, []); groups.get(c).push(a); });
    const cats = LIBRARY_ORDER.filter(c => groups.has(c)).concat([...groups.keys()].filter(c => !LIBRARY_ORDER.includes(c)));
    const favs = Settings.get('pinned').map(id => Apps.get(id)).filter(Boolean);
    if (!['all', 'fav'].includes(this.cat) && !groups.has(this.cat)) this.cat = 'all';

    const style = menuStyleOf();
    const favLabel = style === 'win11' ? 'Pinned' : 'Favorites';
    const chips = [['all', style === 'win11' ? 'All apps' : 'All', all.length], ['fav', favLabel, favs.length]].concat(cats.map(c => [c, libraryLabel(c), groups.get(c).length]));
    $('#sm-chips').innerHTML = chips.map(([id, l, n]) => `<button class="chip${this.cat === id ? ' on' : ''}" data-cat="${esc(id)}">${esc(l)}<span class="n">${n}</span></button>`).join('');
    $('#sm-chips').style.display = q || !Settings.get('menuChips') ? 'none' : '';

    const btn = a => `<button class="sm-app" data-app="${a.id}">${tile(a.icon, a.color)}<span>${esc(a.name)}</span></button>`;
    const section = (title, list) => list.length ? `<div class="sm-head"><span>${esc(title)}</span><em>${list.length}</em></div><div class="sm-grid">${list.map(btn).join('')}</div>` : '';
    let html;
    this._extras = [];
    const raw = this.search.value.trim();
    const row = (x, i) => `<button class="sm-row" data-x="${i}">${svg(x.icon)}<div><b>${esc(x.title)}</b><small>${esc(x.sub)}</small></div></button>`;
    const rows = (title, list) => { if (!list.length) return ''; const start = this._extras.length; this._extras.push(...list); return `<div class="sm-head"><span>${title}</span></div><div class="sm-rows">${list.map((x, i) => row(x, start + i)).join('')}</div>`; };
    if (q) {
      // Instant answers: arithmetic typed into the search box.
      let calc = [];
      if (/^[\d\s+\-*/().%^]+$/.test(raw) && /\d\s*[+\-*/%^]\s*[\d(]/.test(raw)) {
        try {
          const r = Function(`"use strict"; return (${raw.replace(/\^/g, '**')})`)();
          if (typeof r === 'number' && isFinite(r)) { const v = String(+r.toPrecision(12)); calc = [{ icon: 'calculator', title: `= ${v}`, sub: 'Calculator · click to copy', run: () => { if (navigator.clipboard) navigator.clipboard.writeText(v).catch(() => {}); Toast.show('Copied', v, 'check', 1500); } }]; }
        } catch {}
      }
      html = rows('Answer', calc) + section('Best matches', all.filter(a => (a.name + ' ' + a.id + ' ' + (a.keywords || '') + ' ' + catOf(a)).toLowerCase().includes(q)));
      // Not installed yet? Offer matches from the App Store.
      const more = AppStore.entries().filter(e => !AppStore.isInstalled(e) && (e.name + ' ' + e.id + ' ' + (e.desc || '') + ' ' + e.cat).toLowerCase().includes(q)).slice(0, 12);
      if (more.length) html += `<div class="sm-head"><span>Get from the App Store</span><em>${more.length}</em></div><div class="sm-grid">${more.map(e => `<button class="sm-app sm-get" data-get="${esc(e.id)}" title="${esc(e.desc || '')}">${tile(e.icon || 'globe', e.color)}<span>${esc(e.name)}</span><small>${svg('download')}Get</small></button>`).join('')}</div>`;
      html += rows('Settings', SETTINGS_INDEX.filter(x => (x.label + ' ' + x.keys).toLowerCase().includes(q)).slice(0, 4).map(x => ({ icon: x.icon, title: x.label, sub: 'Open in Settings', run: () => WM.open('settings', { section: x.section }) })));
      const more2 = [];
      if (raw.startsWith('>') && raw.slice(1).trim()) more2.push({ icon: 'terminal', title: `Run “${raw.slice(1).trim()}”`, sub: 'In a new Terminal window', run: () => WM.open('terminal', { run: raw.slice(1).trim() }) });
      more2.push({ icon: 'search', title: `Search the web for “${raw}”`, sub: 'Web Browser · Wikipedia', run: () => WM.open('browser', { url: raw, newWindow: true }) });
      if (!raw.startsWith('>')) more2.push({ icon: 'terminal', title: 'Run as a Terminal command', sub: `Tip: start with “>” — e.g. > neofetch`, run: () => WM.open('terminal', { run: raw }) });
      html += rows('More', more2);
    }
    else if (this.cat === 'all') html = (Settings.get('menuFreq') ? section('Frequently used', AppUsage.top(8).map(id => Apps.get(id)).filter(Boolean)) : '')
      + (['win10', 'classic'].includes(style) ? section('All apps', all) : cats.map(c => section(libraryLabel(c), groups.get(c))).join(''));
    else if (this.cat === 'fav') html = section(style === 'win11' ? 'Pinned' : 'Favorites (in the dock)', favs) || '<div class="sm-empty">Nothing here yet — right-click an app and choose “Add to Dock”.</div>';
    else html = section(libraryLabel(this.cat), groups.get(this.cat));

    const files = q ? FS.list().filter(n => n.toLowerCase().includes(q)).slice(0, 8) : Settings.get('menuRecent') && (this.cat === 'all' || (style === 'win11' && this.cat === 'fav')) ? FS.recent(6) : [];
    $('#sm-recent-wrap .sm-head').textContent = style === 'win11' ? 'Recommended' : 'Recent files';
    $('#sm-recent').innerHTML = files.map(n => `<button class="sm-file" data-file="${esc(n)}">${fileTile()}<div><b>${esc(n)}</b><small>${relTime(FS.stat(n).modified)}</small></div></button>`).join('');
    $('#sm-recent-wrap').style.display = files.length ? '' : 'none';
    $('#sm-apps').innerHTML = html || (q && !files.length ? `<div class="sm-empty">No results for "${esc(q)}"</div>` : '');
    $$('.sm-app[data-get]', this.el).forEach(b => b.addEventListener('click', () => { this.hide(); WM.open('store', { app: b.dataset.get }); }));
    $$('.sm-row', this.el).forEach(b => b.addEventListener('click', () => { const x = this._extras[+b.dataset.x]; this.hide(); if (x) x.run(); }));
    $$('.sm-app[data-app]', this.el).forEach(b => {
      const id = b.dataset.app;
      b.addEventListener('click', () => WM.open(id));
      b.addEventListener('contextmenu', e => {
        e.preventDefault(); e.stopPropagation();
        ContextMenu.show(e.clientX, e.clientY, [
          { label: 'Open', icon: 'external', action: () => WM.open(id) },
          '-',
          { label: Desktop.has('app:' + id) ? 'Remove from Desktop' : 'Add to Desktop', icon: 'workspaces', action: () => Desktop.toggleApp(id) },
          { label: Settings.get('pinned').includes(id) ? 'Remove from Dock' : 'Add to Dock', icon: 'grid', action: () => Taskbar.togglePin(id) },
          AppStore.get(id) ? { label: 'Show in App Store', icon: 'store', action: () => WM.open('store', { app: id }) } : null
        ]);
      });
    });
    $$('.sm-file', this.el).forEach(b => {
      const f = b.dataset.file;
      b.addEventListener('click', () => WM.open('notepad', { file: f }));
      b.addEventListener('contextmenu', e => {
        e.preventDefault(); e.stopPropagation();
        ContextMenu.show(e.clientX, e.clientY, [
          { label: 'Open', icon: 'file', action: () => WM.open('notepad', { file: f }) },
          { label: Desktop.has('file:' + f) ? 'Remove from Desktop' : 'Add to Desktop', icon: 'workspaces', action: () => { if (Desktop.has('file:' + f)) Desktop.remove('file:' + f); else Desktop.add('file:' + f); } }
        ]);
      });

  },
  paintKbd() {
    $$('.sm-app, .sm-row, .sm-file', this.el).forEach((b, i) => b.classList.toggle('kbd', !!this.search.value && i === this.kbd));
  },
  show() {
    if (Session.state !== 'desktop') return;
    ContextMenu.hide(); Overview.hide(); Panel.closePops();
    this.open = true;
    this.search.value = '';
    this.kbd = 0;
    const tab = Settings.get('menuTab');
    this.cat = tab === 'fav' || (tab === 'auto' && menuStyleOf() === 'win11') ? 'fav' : 'all';

/* ===================== 10. Session: boot, lock, power ===================== */
const Session = {
  state: 'boot', // boot | lock | desktop | power | off
  init() {
    $('#boot-logo').innerHTML = LOGO;
    $('#power-on').innerHTML = svg('power');
    $('#lock').addEventListener('click', e => { if (!e.target.closest('#lock-pin')) this.login(); });
    $('#pin-in').addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); this.checkPin(); }
      else if (e.key === 'Escape') { e.stopPropagation(); $('#lock-pin').hidden = true; $('#lock-btn').hidden = false; }
    });
    $('#sleep').addEventListener('pointerdown', () => this.wake());
    // Auto-lock after inactivity (Settings → Lock & Privacy).
    ['pointermove', 'pointerdown', 'keydown', 'wheel'].forEach(ev => document.addEventListener(ev, () => { this.lastActive = Date.now(); }, { passive: true, capture: true }));
    setInterval(() => {
      const m = +Settings.get('autoLock');
      if (m && this.state === 'desktop' && Date.now() - this.lastActive > m * 60000) this.lock();
    }, 10000);
    $('#power-on').addEventListener('click', () => this.boot());
    this.syncUser();
  },
  syncUser() {
    const name = Settings.get('username') || 'User', initial = name.trim().charAt(0).toUpperCase() || 'U';
    $('#lock-name').textContent = name; $('#sm-name').textContent = name;
    $('#lock-avatar').textContent = initial; $('#sm-avatar').textContent = initial;
  },
  boot() {
    this.state = 'boot';
    const boot = $('#boot'), bar = $('#boot-bar'), status = $('#boot-status');
    boot.classList.remove('hidden');
    $('#power').classList.add('hidden');
    $('#lock').classList.add('hidden');
    const osn = (Settings.get('osName') || 'SanjivramOS').trim() || 'SanjivramOS', style = Settings.get('bootStyle'), log = $('#boot-log');
    const msgs = [`Starting ${osn === 'SanjivramOS' ? 'sanjivram!_os' : osn}…`, 'Loading system services…', 'Connecting to NoxuiaDrive…', 'Preparing your desktop…', 'Almost ready…'];
    let p = 0, li = 0;
    log.innerHTML = '';
    bar.style.width = '0%';
    clearInterval(this._bt);
    this._bt = setInterval(() => {
      p = style === 'skip' ? 100 : Math.min(100, p + Math.random() * 9 + 3);
      bar.style.width = p + '%';
      if (style === 'verbose') for (const end = p >= 100 ? BOOT_LINES.length : Math.min(BOOT_LINES.length - 1, li + 1); li < end; li++) log.insertAdjacentHTML('beforeend', `[${(li * .0731).toFixed(6).padStart(12)}] ${BOOT_LINES[li].replace('%s', esc(osn))}\n`);
      status.textContent = msgs[Math.min(msgs.length - 1, Math.floor(p / 21))];
      if (p >= 100) {
        clearInterval(this._bt);
        setTimeout(() => { boot.classList.add('hidden'); if (Settings.get('setupDone')) this.showLock(); else Setup.show(); }, 380);
      }
    }, 110);
  },
  showLock() {
    this.state = 'lock';
    StartMenu.hide(); ContextMenu.hide(); AltTab.cancel(); Overview.hide(); Panel.closePops();
    this.syncUser();
    $('#lock-pin').hidden = true; $('#lock-btn').hidden = false; $('#pin-in').value = ''; $('#pin-msg').textContent = '';
    $('#lock').classList.remove('hidden');
  },
  /** With a PIN set, the first click/Enter on the lock screen asks for it. */
  askPin() {
    if (!$('#lock-pin').hidden) return;
    $('#lock-pin').hidden = false; $('#lock-btn').hidden = true; $('#pin-in').value = ''; $('#pin-msg').textContent = '';
    setTimeout(() => $('#pin-in').focus(), 40);
  },
  checkPin() {
    if ($('#pin-in').value === Settings.get('lockPin')) { this.login(true); return; }
    $('#pin-msg').textContent = 'Wrong PIN — try again';
    $('#pin-in').value = '';
    const box = $('#lock-pin'); box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
  },
  /** Sleep: blank the screen; any key or click wakes up to the lock screen. */
  sleep() {
    if (this.state !== 'desktop') return;
    StartMenu.hide(); Panel.closePops(); ContextMenu.hide(); Overview.hide();
    this.state = 'sleep';
    $('#sleep').classList.add('on');
  },
  wake() {
    if (this.state !== 'sleep') return;
    $('#sleep').classList.remove('on');
    this.showLock();
  },
  lastActive: Date.now(),
  login(force) {
    if (this.state !== 'lock') return;
    if (Settings.get('lockPin') && !force) { this.askPin(); return; }
    this.state = 'desktop';
    $('#lock').classList.add('hidden');
    const name = Settings.get('username') || 'User';
    if (Settings.get('firstLogin')) {
      Toast.show(`Welcome, ${name}!`, 'Open apps from the dock or Applications in the top panel. Right-click an app to add it to your desktop.', 'user', 5500);
      Settings.set('firstLogin', false);
    } else {
      Toast.show(`Welcome back, ${name}!`, WM.wins.size ? 'Your session was restored.' : 'Have a productive session.', 'user');
    }
    if (Settings.get('startupSound')) Sound.ui('startup');
    setTimeout(() => SessionApps.onLogin(), 400);
  },
  lock() { if (this.state === 'desktop') { this.showLock(); if (Settings.get('startupSound')) Sound.ui('lock'); } },
  powerSeq(text, then) {
    this.state = 'power';
    StartMenu.hide(); ContextMenu.hide(); AltTab.cancel(); Overview.hide(); Panel.closePops();
    WM.closeAll();
    const p = $('#power');
    p.classList.remove('hidden', 'off');
    $('#power-text').textContent = text;
    $('#power-on').hidden = true;
    $('#power-caption').hidden = true;
    setTimeout(then, 2000);
  },
  restart() { this.powerSeq('Restarting…', () => this.boot()); },
  shutdown() {
    this.powerSeq('Shutting down…', () => {
      this.state = 'off';
      $('#power').classList.add('off');
      $('#power-on').hidden = false;
      $('#power-caption').hidden = false;
    });
  }
};

/* ===================== 11. Alt+Tab & keyboard shortcuts ===================== */
const AltTab = {
  open: false, idx: 0, items: [],
  next(back) {
    if (!this.open) {
      this.items = WM.list().filter(w => WM.onWs(w));
      if (!this.items.length) return;
      this.open = true;
      this.idx = this.items.length > 1 ? (back ? this.items.length - 1 : 1) : 0;
    } else {
      this.idx = (this.idx + (back ? -1 : 1) + this.items.length) % this.items.length;
    }
    this.render();
  },
  render() {
    const box = $('#alttab');
    box.innerHTML = `<div class="at-panel">${this.items.map((w, i) => `<div class="at-card${i === this.idx ? ' sel' : ''}${w.minimized ? ' min' : ''}" data-i="${i}">${tile(w.app.icon, w.app.color)}<span>${esc(w.title)}</span></div>`).join('')}</div>`;
    box.classList.add('open');
    $$('.at-card', box).forEach(c => c.addEventListener('click', () => { this.idx = +c.dataset.i; this.commit(); }));
  },
  commit() {
    if (!this.open) return;
    const w = this.items[this.idx];
    this.cancel();
    if (w && WM.wins.has(w.id)) WM.focus(w);
  },
  cancel() { this.open = false; $('#alttab').classList.remove('open'); }
};

const Keyboard = {
  init() {
    document.addEventListener('keydown', e => this.onKey(e));
    // Custom layout: an auto-hiding dock slides in when the pointer touches its screen edge.
    let peekT;
    document.addEventListener('pointermove', e => {
      const r = document.documentElement;
      if (r.dataset.cAutohide !== '1') return;
      const side = r.dataset.cDock, W = window.innerWidth, H = window.innerHeight;
      const atEdge = (side === 'bottom' && e.clientY >= H - 3) || (side === 'left' && e.clientX <= 2) || (side === 'right' && e.clientX >= W - 3);
      const overDock = !!(e.target.closest && e.target.closest('#dock'));
      if (atEdge || overDock) { clearTimeout(peekT); r.classList.add('dock-peek'); }
      else if (r.classList.contains('dock-peek')) { clearTimeout(peekT); peekT = setTimeout(() => { if (!StartMenu.open) r.classList.remove('dock-peek'); }, 500); }
    });
    // Hot corners: push the pointer into a screen corner to run its action (Settings → Desktop & Dock).
    let armed = true;
    document.addEventListener('pointermove', e => {
      const W = window.innerWidth - 2, H = window.innerHeight - 2, l = e.clientX <= 1, r = e.clientX >= W, t = e.clientY <= 1, b = e.clientY >= H;
      const corner = t && l ? 'TL' : t && r ? 'TR' : b && l ? 'BL' : b && r ? 'BR' : '';
      if (corner && armed && Settings.get('hotCorner') && Session.state === 'desktop' && !document.body.classList.contains('wm-busy')) {
        const act = Settings.get('corner' + corner);
        if (act && act !== 'none') { armed = false; runAction(act); }
      }
      if (!corner) armed = true;
    });
    document.addEventListener('keyup', e => { if (e.key === 'Alt' && AltTab.open) AltTab.commit(); });
    window.addEventListener('blur', () => AltTab.commit());
  },
  closeMenus() {
    let closed = false;
    if (ContextMenu.el) { ContextMenu.hide(); closed = true; }
    if (StartMenu.open) { StartMenu.hide(); closed = true; }
    if (EmojiPicker.open) { EmojiPicker.hide(); closed = true; }
    if (Spotlight.open) { Spotlight.hide(); closed = true; }
    if (AltTab.open) { AltTab.cancel(); closed = true; }
    if (Overview.open) { Overview.hide(); closed = true; }
    if ($$('.popover.open').length) { Panel.closePops(); closed = true; }
    return closed;
  },
  onKey(e) {
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (Session.state === 'sleep') { e.preventDefault(); Session.wake(); return; }
    if (Session.state === 'setup') return;
    if (Session.state === 'lock') {
      if (e.target.id === 'pin-in') return;
      if (k === 'Enter' || k === ' ') { e.preventDefault(); Session.login(); }
      return;
    }
    if (Session.state === 'off') { if (k === 'Enter' || k === ' ') Session.boot(); return; }
    if (Session.state !== 'desktop' || Dialog.current) return;

    if (k === 'Escape' && this.closeMenus()) { e.preventDefault(); return; }
    if (e.altKey && (k === 'Tab' || k === '`')) { e.preventDefault(); AltTab.next(e.shiftKey); return; }
    if (e.ctrlKey && !e.altKey && (k === '.' || k === ';')) { e.preventDefault(); EmojiPicker.toggle(); return; }
    if (e.ctrlKey && e.altKey && (k === 'ArrowLeft' || k === 'ArrowRight')) {
      e.preventDefault();
      const n = WM.ws + (k === 'ArrowRight' ? 1 : -1);
      if (e.shiftKey && WM.active) { const w = WM.active; WM.moveToWs(w, n); WM.switchWs(clamp(n, 1, WM.wsCount())); WM.focus(w); } else WM.switchWs(n);
      return;
    }
    if (e.ctrlKey && e.altKey && k === 'v') { e.preventDefault(); WM.open('clipboard'); return; }
    if (e.ctrlKey && e.altKey && k === 'f') { e.preventDefault(); FocusMode.toggle(); return; }
    if ((e.ctrlKey || e.altKey) && !e.shiftKey && k === ' ') { e.preventDefault(); Spotlight.toggle(); return; }
    if (Spotlight.open) return;
    if (e.ctrlKey && e.altKey && k === 't') { e.preventDefault(); WM.open('terminal'); return; }
    if (e.ctrlKey && e.altKey && k === 'c') { e.preventDefault(); WM.open('claude'); return; }
    if (e.ctrlKey && !e.altKey && !e.shiftKey && k === 'e') { e.preventDefault(); WM.open('explorer'); return; }
    if (e.altKey && k === 'F4' && WM.active) { e.preventDefault(); WM.close(WM.active); return; }
    if (e.altKey && !e.ctrlKey && k === 'ArrowUp' && WM.active) { e.preventDefault(); WM.maximize(WM.active); return; }
    if (e.altKey && !e.ctrlKey && k === 'ArrowDown' && WM.active) { e.preventDefault(); WM.active.maximized ? WM.unmaximize(WM.active) : WM.minimize(WM.active); return; }
    if (e.ctrlKey && k === 'Escape') { e.preventDefault(); StartMenu.toggle(); return; }
    // Pop!_OS uses Super+A / Super+W / Super+Y; browsers can't capture Super, so Ctrl+Alt is used.
    if (e.ctrlKey && e.altKey && k === 'a') { e.preventDefault(); StartMenu.toggle(); return; }
    if (e.ctrlKey && !e.altKey && k === '/') { e.preventDefault(); WM.open('shortcuts'); return; }
    if (e.ctrlKey && e.altKey && k === 'l') { e.preventDefault(); Session.lock(); return; }
    if (e.ctrlKey && e.altKey && k === 'w') { e.preventDefault(); Overview.toggle(); return; }
    if (e.ctrlKey && e.altKey && k === 'y') { e.preventDefault(); WM.setTiling(!Settings.get('tiling')); return; }
    if (e.ctrlKey && e.altKey && k.length === 1) {
      const sc = (Settings.get('customKeys') || []).find(x => x.key === k);
      if (sc) { e.preventDefault(); runAction(sc.action); return; }
    }
    if (Overview.open) return;

    if (StartMenu.open) {
      // Typing while the start menu is open goes to its search box.
      if (!isTyping(e.target) && k.length === 1 && !e.ctrlKey && !e.metaKey) StartMenu.search.focus();
      return;
    }
    if (isTyping(e.target)) return;
    if (WM.active) { if (WM.active.onKey) WM.active.onKey(e); }
    else Desktop.onKey(e);
  }
};

/* ===================== 12. App registry ===================== */
/** Category order and labels used by the App Library. */
const LIBRARY_ORDER = ['Games', 'Productivity', 'Creativity', 'Developer', 'Education', 'Music', 'Internet', 'Fun', 'Utilities', 'Web Apps', 'Other'];
const libraryLabel = c => ({ Music: 'Music & Audio', Fun: 'Fun & Toys' })[c] || c;
/** How often each app is opened, for the "Frequently used" row. */
const AppUsage = {
  get() { return Store.get('appUsage', {}); },
  record(id) {
    const u = this.get(), e = u[id] || { n: 0, t: 0 };
    e.n++; e.t = Date.now(); u[id] = e;
    Store.set('appUsage', u);
  },
  top(n = 8) {
    const u = this.get();
    return Object.keys(u).filter(id => Apps.get(id)).sort((a, b) => (u[b].n - u[a].n) || (u[b].t - u[a].t)).slice(0, n);
  }
};
const Apps = {
  reg: new Map(),
  register(def) {
    const app = Object.assign({ width: 720, height: 480, desktop: true, singleton: false, color: 'linear-gradient(135deg,#64748b,#334155)' }, def);
    applyAppOverride(app);
    this.reg.set(def.id, app);
  },
  /** Apps removed through the App Store behave as if they weren't installed. */
  get(id) { const a = this.reg.get(id); return a && !a.removed ? a : undefined; },
  list() { return [...this.reg.values()].filter(a => !a.hidden && !a.removed); },
  /** Fuzzy lookup by id, name, alias or prefix (used by the Terminal's `open`). */
  find(q) {
    q = String(q || '').toLowerCase().trim();
    if (!q) return null;
    const all = this.list();
    return this.get(q) || all.find(a => a.name.toLowerCase() === q) || all.find(a => (a.aliases || []).includes(q))
      || all.find(a => a.name.toLowerCase().startsWith(q) || a.id.startsWith(q)) || null;
  }
};

/** Shared iframe settings for web-content windows. The sandbox blocks embedded pages from
 *  navigating the whole OS away ("frame busting") while keeping scripts, logins, forms,
 *  popups and downloads working. */
const FRAME_SANDBOX = 'allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-downloads allow-pointer-lock allow-presentation';
const FRAME_ALLOW = 'clipboard-read; clipboard-write; fullscreen; autoplay; encrypted-media; picture-in-picture; camera; microphone; midi; gamepad; screen-wake-lock';

/** History guard: cross-origin iframes don't expose their history, but the top window's
 *  history.back()/forward() walk the joint session history, which includes iframe navigations.
 *  A guard entry stops "Back" from ever leaving SanjivramOS itself. */
const HistoryGuard = {
  init() {
    try {
      history.replaceState({ sanjivramos: 'base' }, '');
      history.pushState({ sanjivramos: 'guard' }, '');
    } catch { return; }
    window.addEventListener('popstate', e => {
      if (!e.state || e.state.sanjivramos === 'base') {
        try { history.pushState({ sanjivramos: 'guard' }, ''); } catch {}
        Toast.show('No more history', 'There is nothing further to go back to.', 'info', 1800);
      }
    });
  },
  back(frame) { try { frame.contentWindow.history.back(); } catch { history.back(); } },
  forward(frame) { try { frame.contentWindow.history.forward(); } catch { history.forward(); } }
};

/* ---------------- Embedded web apps (File Explorer, GX Launcher) ---------------- */
/** Shared launcher for apps that are a website in a full-size iframe with a slim toolbar.
 *  opts: { home, label, extra: [{act, icon, title, run(frame)}] } */
function launchWebApp(win, args, opts) {
  const url = args.url || opts.home;
  const host = new URL(opts.home).host;
  const extra = opts.extra || [];
  win.body.innerHTML = `
    <div class="toolbar">
      <button class="icon-btn" data-act="back" title="Back (Alt+←)">${svg('back')}</button>
      <button class="icon-btn" data-act="forward" title="Forward (Alt+→)">${svg('forward')}</button>
      <button class="icon-btn" data-act="reload" title="Reload (F5)">${svg('reload')}</button>
      <button class="icon-btn" data-act="home" title="Home (${esc(host)})">${svg('home')}</button>
      <div class="addr" title="${esc(opts.home)}">${svg('lock')}<span class="addr-text">${esc(host)}</span></div>
      ${extra.map(x => `<button class="icon-btn" data-act="${x.act}" title="${esc(x.title)}">${svg(x.icon)}</button>`).join('')}
      <button class="icon-btn" data-act="newtab" title="Open in new tab">${svg('external')}</button>
    </div>
    ${opts.notice && !Store.get('notice.' + opts.notice.id, false) ? `<div class="wa-notice">${svg('info')}<span>${opts.notice.html}</span><button class="icon-btn" data-act="notice-x" title="Don’t show again">${svg('close')}</button></div>` : ''}
    <div class="frame-wrap">
      <iframe title="${esc(opts.label)}" sandbox="${FRAME_SANDBOX}" allow="${FRAME_ALLOW}" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
      <div class="loader">
        <div class="spinner"></div>
        <div>Connecting to ${esc(opts.label)}…</div>
        <div class="loader-hint" hidden>
          <span>This is taking longer than usual. If the page doesn't appear, it may not allow being embedded.</span>
          <button class="btn" data-act="newtab">${svg('external')} Open in new tab</button>
        </div>
      </div>
    </div>`;
  const frame = $('iframe', win.body), loader = $('.loader', win.body), hint = $('.loader-hint', win.body);
  let slowT;
  const showLoader = () => {
    loader.classList.remove('done');
    hint.hidden = true;
    clearTimeout(slowT);
    slowT = setTimeout(() => { hint.hidden = false; }, 12000);
  };
  frame.addEventListener('load', () => { clearTimeout(slowT); loader.classList.add('done'); });
  showLoader();
  frame.src = url;

  const actions = {
    back: () => HistoryGuard.back(frame),
    forward: () => HistoryGuard.forward(frame),
    reload: () => { showLoader(); try { frame.contentWindow.location.reload(); } catch { frame.src = frame.src; } },
    home: () => { showLoader(); try { frame.contentWindow.location.replace(opts.home); } catch { frame.src = opts.home; } },
    newtab: () => window.open(opts.home, '_blank', 'noopener'),
    'notice-x': () => { Store.set('notice.' + opts.notice.id, true); const n = $('.wa-notice', win.body); if (n) n.remove(); }
  };
  extra.forEach(x => { actions[x.act] = () => x.run(frame); });
  win.body.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (b && actions[b.dataset.act]) actions[b.dataset.act]();
  });
  win.onKey = e => {
    if (e.key === 'F5') { e.preventDefault(); actions.reload(); }
    if (e.altKey && e.key === 'ArrowLeft') { e.preventDefault(); actions.back(); }
    if (e.altKey && e.key === 'ArrowRight') { e.preventDefault(); actions.forward(); }
  };
  win.onClose = () => clearTimeout(slowT);
}

/** Open a link (http, data: URI or blob: URL) in a SanjivramOS Web Browser window. */
function openLink(url) {
  url = String(url || '').trim();
  if (!/^(https?:|data:|blob:)/i.test(url)) { Toast.show('Not a link', 'Expected an http(s), data: or blob: URL.', 'info'); return false; }
  WM.open('browser', { url, newWindow: true });
  return true;
}
/** Read a link from the clipboard (falls back to a paste dialog when clipboard access is denied). */
async function openLinkFromClipboard() {
  let text = '';
  try { text = (await navigator.clipboard.readText()).trim(); } catch {}
  if (!/^(https?:|data:|blob:)/i.test(text)) {
    text = await Dialog.prompt('Open a link', 'Paste a data: URI, blob: URL or web address to open it in a SanjivramOS window:', '', { okText: 'Open' });
    if (text == null) return;
  }
  openLink(text);
}

      count.textContent = `${text.split('\n').length} lines · ${text.length} chars · UTF-8`;
    };
    const setDirty = d => { dirty = d; updateTitle(); };
    const load = name => {
      win.file = name;
      ta.value = name ? FS.read(name) || '' : '';
      nameIn.value = name || '';
      status.textContent = name ? `Opened ${name}` : 'New document';
      setDirty(false);
    };
    const confirmDiscard = async () => !dirty || Dialog.confirm('Discard changes?', `"${win.file || 'Untitled'}" has unsaved changes.`, { okText: 'Discard', danger: true });

    const save = () => {
      let name = FS.normalize(nameIn.value || win.file || '');
      if (!name) { nameIn.focus(); Toast.show('Name your note', 'Type a file name in the box first.', 'info', 2500); return false; }
      if (!FS.valid(name)) { Toast.show('Invalid name', 'Names cannot contain / \\ < > : " | ? *', 'info'); return false; }
      FS.write(name, ta.value);
      win.file = name;
      nameIn.value = name;
      setDirty(false);
      status.textContent = `Saved at ${new Date().toLocaleTimeString()}`;
      Toast.show('File saved', name, 'save', 2200);
      return true;
    };
    const actions = {
      new: async () => { if (await confirmDiscard()) { load(null); ta.focus(); } },
      open: () => {
        const b = $('[data-act="open"]', win.body).getBoundingClientRect();
        const files = FS.list();
        ContextMenu.show(b.left, b.bottom + 4, files.length
          ? [{ title: 'Open a note' }].concat(files.map(n => ({ label: n, icon: 'file', action: async () => { if (await confirmDiscard()) load(n); } })))
          : [{ label: 'No saved notes yet', disabled: true }]);
      },
      save,
      download: () => {
        const name = FS.normalize(nameIn.value || win.file || 'Untitled.txt');
        downloadBlob(new Blob([ta.value], { type: 'text/plain;charset=utf-8' }), /\.txt$/i.test(name) ? name : name + '.txt');
        Toast.show('Download started', name, 'download', 2200);
      },

        if (!win.file || !FS.exists(win.file)) { Toast.show('Nothing to delete', 'This note has not been saved yet.', 'info', 2200); return; }
        if (!(await Dialog.confirm(`Delete "${win.file}"?`, 'This cannot be undone.', { okText: 'Delete', danger: true }))) return;
        const n = win.file;
        win.file = null;           // avoid the external-delete handler kicking in
        FS.remove(n);
        load(null);
        Toast.show('File deleted', n, 'trash', 2200);
      }
    };
    win.body.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b) actions[b.dataset.act](); });
    ta.addEventListener('input', () => { if (!dirty) setDirty(true); else updateTitle(); });
    nameIn.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); save(); ta.focus(); } });
    win.body.addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      if ((e.ctrlKey || e.metaKey) && k === 's') { e.preventDefault(); save(); }
      else if ((e.ctrlKey || e.metaKey) && k === 'o') { e.preventDefault(); actions.open(); }
      else if ((e.ctrlKey || e.metaKey) && k === 'n') { e.preventDefault(); actions.new(); }
      else if (e.key === 'Tab' && e.target === ta) {
        e.preventDefault();
        const s = ta.selectionStart;
        ta.setRangeText('\t', s, ta.selectionEnd, 'end');
        setDirty(true);
      }
    });
    // React to files being renamed/removed elsewhere (desktop, terminal).
    win.listen('fs:rename', ({ from, to }) => { if (win.file === from) { win.file = to; nameIn.value = to; updateTitle(); } });
    win.listen('fs', () => {
      if (win.file && !FS.exists(win.file)) { status.textContent = `"${win.file}" was deleted — save to recreate it`; setDirty(true); }
    });
    win.beforeClose = confirmDiscard;
    // Dropped text files open as a new, unsaved note (press Save to keep it).
    win.onDropFiles = async files => {
      const f = files.find(isTextFile);
      if (!f) { Toast.show('Not a text file', 'Notepad opens .txt, .md, .json, .csv and similar files.', 'file'); return; }
      if (f.size > 1024 * 1024) { Toast.show('File too large', `${f.name} is over 1 MB.`, 'info'); return; }
      if (!(await confirmDiscard())) return;
      load(null);
      ta.value = await f.text();
      nameIn.value = FS.normalize(f.name.replace(/[\/\\<>:"|?*]/g, '_'));
      status.textContent = `Imported ${f.name} — press Save to keep it`;
      setDirty(true);
    };
    win.onFocus = () => setTimeout(() => { if (!win.body.contains(document.activeElement)) ta.focus(); }, 0);

    load(args.file && FS.exists(args.file) ? args.file : null);
    setTimeout(() => ta.focus(), 50);
  }
});

Apps.register({
  id: 'calculator', name: 'Calculator', icon: 'app-calc', color: 'linear-gradient(135deg,#34d399,#059669)',
  width: 340, height: 520, minWidth: 280, minHeight: 420, keywords: 'math calc numbers', aliases: ['calc'],
  launch(win) {
    const KEYS = [
      ['%', 'pct', 'fn'], ['CE', 'ce', 'fn'], ['C', 'c', 'fn'], ['⌫', 'back', 'fn'],
      ['¹⁄ₓ', 'inv', 'fn'], ['x²', 'sq', 'fn'], ['√x', 'sqrt', 'fn'], ['÷', '/', 'fn'],
      ['7', '7', 'num'], ['8', '8', 'num'], ['9', '9', 'num'], ['×', '*', 'fn'],
      ['4', '4', 'num'], ['5', '5', 'num'], ['6', '6', 'num'], ['−', '-', 'fn'],
      ['1', '1', 'num'], ['2', '2', 'num'], ['3', '3', 'num'], ['+', '+', 'fn'],
      ['±', 'neg', 'num'], ['0', '0', 'num'], ['.', '.', 'num'], ['=', '=', 'eq']
    ];
    const SYM = { '/': '÷', '*': '×', '-': '−', '+': '+' };
    win.body.innerHTML = `<div class="calc">
      <div class="calc-display"><div class="calc-expr">&nbsp;</div><div class="calc-val">0</div></div>
      <div class="calc-keys">${KEYS.map(([l, v, c]) => `<button class="ck ${c}" data-k="${v}">${l}</button>`).join('')}</div>
    </div>`;
    const exprEl = $('.calc-expr', win.body), valEl = $('.calc-val', win.body);
    let cur = '0', prev = null, op = null, fresh = true, error = false, expr = '';

    const fmt = n => {
      if (!isFinite(n)) return 'Error';
      let s = String(parseFloat(n.toPrecision(12)));
      if (s.length > 16) s = n.toExponential(8);
      return s;
    };
    const calc = (a, b, o) => o === '+' ? a + b : o === '-' ? a - b : o === '*' ? a * b : o === '/' ? (b === 0 ? NaN : a / b) : b;
    const fail = msg => { error = true; cur = msg; prev = null; op = null; fresh = true; expr = ''; };
    const show = () => {
      valEl.textContent = cur;
      exprEl.innerHTML = expr ? esc(expr) : '&nbsp;';
      valEl.style.fontSize = cur.length > 14 ? '24px' : cur.length > 10 ? '32px' : '44px';
    };
    const press = k => {
      if (error && k !== 'c' && k !== 'ce') { cur = '0'; error = false; }
      if (/^\d$/.test(k)) {
        if (fresh) { cur = k; fresh = false; }
        else if (cur.replace(/[-.]/g, '').length < 16) cur = cur === '0' ? k : cur + k;
      } else if (k === '.') {
        if (fresh) { cur = '0.'; fresh = false; } else if (!cur.includes('.')) cur += '.';
      } else if ('+-*/'.includes(k)) {
        if (op && !fresh) {
          const r = calc(prev, parseFloat(cur), op);
          if (!isFinite(r)) { fail('Cannot divide by zero'); show(); return; }
          cur = fmt(r);
        }
        prev = parseFloat(cur); op = k; fresh = true;
        expr = `${fmt(prev)} ${SYM[k]}`;
      } else if (k === '=') {
        if (op == null) return;
        const b = parseFloat(cur), r = calc(prev, b, op);
        if (!isFinite(r)) { fail('Cannot divide by zero'); show(); return; }
        expr = `${fmt(prev)} ${SYM[op]} ${fmt(b)} =`;
        cur = fmt(r); prev = null; op = null; fresh = true;
      } else if (k === 'c') { cur = '0'; prev = null; op = null; fresh = true; error = false; expr = ''; }
      else if (k === 'ce') { cur = '0'; fresh = true; error = false; }
      else if (k === 'back') { if (!fresh) { cur = cur.length > 1 ? cur.slice(0, -1) : '0'; if (cur === '-') cur = '0'; } }
      else if (k === 'neg') { if (cur !== '0') cur = cur.startsWith('-') ? cur.slice(1) : '-' + cur; }
      else if (k === 'pct') { const v = parseFloat(cur); cur = fmt(prev != null ? prev * v / 100 : v / 100); fresh = true; }
      else if (k === 'inv') { const v = parseFloat(cur); if (v === 0) fail('Cannot divide by zero'); else { expr = `1/(${cur})`; cur = fmt(1 / v); fresh = true; } }
      else if (k === 'sq') { const v = parseFloat(cur); expr = `sqr(${cur})`; cur = fmt(v * v); fresh = true; }
      else if (k === 'sqrt') { const v = parseFloat(cur); if (v < 0) fail('Invalid input'); else { expr = `√(${cur})`; cur = fmt(Math.sqrt(v)); fresh = true; } }
      show();
    };
    win.body.addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) press(b.dataset.k); });
    const flash = k => {
      const b = $(`[data-k="${CSS.escape(k)}"]`, win.body);
      if (!b) return;
      b.classList.add('pressed');
      setTimeout(() => b.classList.remove('pressed'), 110);
    };
    win.onKey = e => {
      let k = e.key;
      if (e.ctrlKey || e.metaKey || e.altKey) {
        if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === 'c') navigator.clipboard && navigator.clipboard.writeText(cur).then(() => Toast.show('Copied', cur, 'check', 1500)).catch(() => {});
        return;
      }
      const map = { Enter: '=', '=': '=', Backspace: 'back', Escape: 'c', Delete: 'ce', ',': '.', 'x': '*', 'X': '*', '%': 'pct', 'r': 'inv', 'q': 'sq', '@': 'sqrt', 'F9': 'neg' };
      k = map[k] || k;
      if (/^[\d.+\-*/=]$/.test(k) || ['back', 'c', 'ce', 'pct', 'inv', 'sq', 'sqrt', 'neg'].includes(k)) {
        e.preventDefault();
        press(k); flash(k);
      }
    };
  }
});

      flip: { d: 'Flip a coin', f: () => text(Math.random() < .5 ? '🪙 Heads' : '🪙 Tails') },
      ws: { d: 'Switch workspace: ws 2', f: a => { const n = +a[0]; if (!n) return text(`workspace ${WM.ws} of ${WM.wsCount()}`); WM.switchWs(n); text(`switched to workspace ${WM.ws}`, 't-dim'); } },
      emoji: { d: 'Open the emoji picker', f: () => EmojiPicker.show() },
      focus: { d: 'Toggle focus mode', f: () => { FocusMode.toggle(); text(`focus mode ${FocusMode.on ? 'on' : 'off'}`, 't-dim'); } },
      wallpaper: { d: 'Change wallpaper: wallpaper next | random | <name>', f: a => {

        const w = WALLPAPERS.find(x => x.id === q || x.name.toLowerCase() === q) || WALLPAPERS.find(x => x.name.toLowerCase().includes(q));
        if (!w) return text(`no wallpaper matches "${q}" — try: ${WALLPAPERS.slice(0, 6).map(x => x.id).join(', ')}…`, 't-err');
        Settings.set('wallpaper', w.id); text(`wallpaper: ${w.name}`, 't-ok');
      } },
      claude: { d: 'Open Claude (your Codespace site)', f: () => { WM.open('claude'); text(`opening ${claudeUrl()} …`, 't-dim'); } },
      apt: { d: 'Manage apps: apt install | remove | list | search <app>', f: a => {
        const [sub, ...rest] = a, q = rest.join(' ').trim();
        if (sub === 'list') {
          AppStore.entries().forEach(e => print(`<span class="t-cyan">${esc(e.id.padEnd(14))}</span>${AppStore.isInstalled(e) ? '<span class="t-ok">[installed]</span>' : '<span class="t-dim">[available]</span>'} ${esc(e.name)}${e.system ? ' <span class="t-dim">(system)</span>' : ''}`));
          return;
        }
        if (sub === 'search') {
          const hits = AppStore.entries().filter(e => (e.name + ' ' + e.id + ' ' + (e.desc || '') + ' ' + e.cat).toLowerCase().includes(q.toLowerCase()));
          if (!hits.length) return text(`no packages match "${q}"`, 't-dim');
          return hits.forEach(e => print(`<span class="t-cyan">${esc(e.id)}</span> — ${esc(e.desc || e.name)}`));
        }
        if (!['install', 'remove', 'purge'].includes(sub) || !q) return text('usage: apt install | remove | list | search <app>', 't-err');
        const e = AppStore.find(q);
        if (!e) return text(`E: Unable to locate package ${q}`, 't-err');
        if (sub === 'install') {
          if (AppStore.isInstalled(e)) return text(`${e.id} is already the newest version.`, 't-dim');
          text('Reading package lists... Done', 't-dim');
          text(`Setting up ${e.id} ...`);
          AppStore.install(e);
          return text(`${e.name} installed — run "open ${e.id}" to launch it.`, 't-ok');
        }
        if (e.system) return text(`E: ${e.id} is a system app and can't be removed`, 't-err');
        if (!AppStore.isInstalled(e)) return text(`Package '${e.id}' is not installed, so not removed`, 't-dim');
        text(`Removing ${e.id} ...`);
        AppStore.uninstall(e, false);
      } },
      sudo: { d: 'Run a command as root (no password on SanjivramOS)', f: a => {
        if (!a.length) return text('usage: sudo <command>', 't-err');
        const c = COMMANDS[a[0].toLowerCase()];
        if (!c) return text(`sudo: ${a[0]}: command not found`, 't-err');
        c.f(a.slice(1));
      } },
      browse: { d: 'Open a URL, data: URI, blob: URL or note in the browser', f: a => {
        if (!a.length) return text('browse: usage: browse <url | data:… | blob:… | note>', 't-err');
        const target = a.join(' '), note = FS.resolve(target);
        if (note) {
          // Notes are rendered as HTML through a blob: URL (so a note can be a little web page).
          const html = /<[a-z!][\s\S]*>/i.test(FS.read(note)) ? FS.read(note) : `<pre style="white-space:pre-wrap;font:14px/1.6 monospace">${esc(FS.read(note))}</pre>`;
          WM.open('browser', { url: URL.createObjectURL(new Blob([html], { type: 'text/html' })), label: note, newWindow: true });
          return text(`rendering ${note} …`, 't-dim');
        }
        const url = /^(https?:|data:|blob:|about:)/i.test(target) ? target : 'https://' + target;
        WM.open('browser', { url, newWindow: true }); text(`opening ${shortUrl(url)} …`, 't-dim');
      } },
      datauri: { d: 'Turn a note into a data: URI (copied to clipboard)', f: a => {
        const note = a[0] && FS.resolve(a.join(' '));
        if (!note) return text('datauri: usage: datauri <note>', 't-err');
        const type = /\.html?$/i.test(note) ? 'text/html' : 'text/plain';
        const uri = `data:${type};charset=utf-8;base64,` + bytesToBase64(new TextEncoder().encode(FS.read(note)));
        text(uri.length > 400 ? uri.slice(0, 400) + `… (${uri.length} chars)` : uri, 't-cyan');
        if (navigator.clipboard) navigator.clipboard.writeText(uri).then(() => text('copied to clipboard', 't-dim'), () => {});
      } },
      apps: { d: 'List installed apps', f: () => Apps.list().forEach(a => print(`  <span class="t-cyan">${a.id.padEnd(12)}</span>${esc(a.name)}`)) },
      theme: { d: 'Colour scheme: theme [list | light | dark | oled | nord | dracula | …]', f: a => {
        const q = (a.join(' ') || '').toLowerCase();
        if (q === 'list' || q === 'ls') return SCHEMES.forEach(x => print(`  <span class="t-cyan">${x.id.padEnd(11)}</span>${esc(x.name)}${x.id === Settings.get('scheme') ? ' <span class="t-ok">(current)</span>' : ''}`));
        if (!q) { Theme.toggle(); return text(`scheme set to ${schemeOf(Settings.get('scheme')).name}`, 't-dim'); }
        const s = SCHEMES.find(x => x.id === q || x.name.toLowerCase() === q || x.name.toLowerCase().startsWith(q) || (q === 'black' && x.id === 'oled'));
        if (!s) return text(`theme: unknown scheme "${q}" (try "theme list")`, 't-err');
        Theme.setScheme(s.id); text(`scheme set to ${s.name}`, 't-dim');
      } },
      notify: { d: 'Show a notification: notify <msg>', f: a => Toast.show('Terminal', a.join(' ') || 'Hello from the shell!', 'terminal') },
      calc: { d: 'Evaluate arithmetic: calc 2*(3+4)', f: a => {
        const ex = a.join(' ');
        if (!ex || !/^[\d+\-*/().%\s^e]+$/i.test(ex)) return text('calc: only numbers and + - * / % ^ ( ) are allowed', 't-err');
        try { const r = Function(`"use strict"; return (${ex.replace(/\^/g, '**')})`)(); text(String(r)); }
        catch { text('calc: syntax error', 't-err'); }
      } },
      history: { d: 'Show command history', f: () => hist.forEach((c, i) => text(`${String(i + 1).padStart(4)}  ${c}`)) },
      exit: { d: 'Close the terminal', f: () => WM.close(win) }
    };

    const run = line => {
      print(`<span class="term-prompt">${promptEl.innerHTML}</span> ${esc(line)}`);
      const trimmed = line.trim();
      if (!trimmed) return;
      if (hist[hist.length - 1] !== trimmed) { hist.push(trimmed); if (hist.length > 100) hist.shift(); Store.set('terminal.history', hist); }
      hIdx = hist.length;
      trimmed.split(/\s*&&\s*/).forEach(part => {
        const [cmd, ...args] = parse(part);
        if (!cmd) return;
        const c = COMMANDS[cmd.toLowerCase()];
        if (!c) { text(`sanjsh: command not found: ${cmd}  (type "help")`, 't-err'); return; }
        try { c.f(args); } catch (err) { text(`${cmd}: ${err.message}`, 't-err'); }
      });
    };
    const complete = () => {
      const v = input.value, parts = v.split(' ');
      const last = parts[parts.length - 1];
      let pool;
      if (parts.length === 1) pool = Object.keys(COMMANDS);
      else if (parts[0] === 'open') pool = Apps.list().map(a => a.id);
      else pool = FS.list().map(n => (n.includes(' ') ? `"${n}"` : n));
      const m = pool.filter(p => p.toLowerCase().startsWith(last.toLowerCase()));
      if (m.length === 1) { parts[parts.length - 1] = m[0]; input.value = parts.join(' ') + (parts.length === 1 ? ' ' : ''); }
      else if (m.length > 1) {
        print(`<span class="term-prompt">${promptEl.innerHTML}</span> ${esc(v)}`);
        text(m.join('   '), 't-dim');
        let pre = m[0];
        m.forEach(s => { while (!s.toLowerCase().startsWith(pre.toLowerCase())) pre = pre.slice(0, -1); });
        parts[parts.length - 1] = pre; input.value = parts.join(' ');
      }
    };

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { const v = input.value; input.value = ''; run(v); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); if (hIdx > 0) { hIdx--; input.value = hist[hIdx]; } }
      else if (e.key === 'ArrowDown') { e.preventDefault(); if (hIdx < hist.length - 1) { hIdx++; input.value = hist[hIdx]; } else { hIdx = hist.length; input.value = ''; } }
      else if (e.key === 'Tab') { e.preventDefault(); complete(); }
      else if (e.ctrlKey && e.key.toLowerCase() === 'l') { e.preventDefault(); out.innerHTML = ''; }
      else if (e.ctrlKey && e.key.toLowerCase() === 'c' && !window.getSelection().toString()) { e.preventDefault(); print(`<span class="term-prompt">${promptEl.innerHTML}</span> ${esc(input.value)}^C`); input.value = ''; }
    });
    term.addEventListener('mouseup', () => { if (!window.getSelection().toString()) input.focus(); });
    win.onFocus = () => setTimeout(() => input.focus(), 0);
    win.listen('settings', ({ key }) => { if (key === 'username') setPrompt(); });

    setPrompt();
    print(`<span class="t-acc">SanjivramOS</span> shell 1.0 — ${esc(new Date().toLocaleString())}`);
    print('<span class="t-dim">Type "help" for commands, "drive" to open your NoxuiaDrive.</span>');
    if (args && args.run) setTimeout(() => run(String(args.run)), 60);
    setTimeout(() => input.focus(), 50);
  }
});

/* ---------------- App: Web Browser ---------------- */
Apps.register({
  id: 'browser', name: 'Web Browser', icon: 'app-browser', color: 'linear-gradient(135deg,#38bdf8,#6366f1)',
  width: 980, height: 640, minWidth: 360, keywords: 'internet web surf url data uri blob', aliases: ['web', 'internet', 'chrome'],
  launch(win, args) {
    const SITES = [
      { n: 'Wikipedia', u: 'https://en.wikipedia.org/wiki/Main_Page', c: '#636466', l: 'W' },
      { n: 'NoxuiaDrive', u: DRIVE_URL, c: '#f59e0b', l: 'N' },
      { n: 'GX Launcher', u: GX_URL, c: '#e11d48', l: 'GX' },
      { n: 'OpenStreetMap', u: 'https://www.openstreetmap.org/export/embed.html?bbox=-0.25,51.45,0.05,51.56&layer=mapnik', c: '#7ebc6f', l: 'M' },
      { n: 'Seraph', u: SERAPH_URL, c: '#7c3aed', l: 'S' },
      { n: 'MDN Web Docs', u: 'https://developer.mozilla.org/', c: '#111827', l: 'M' }
    ];
    win.body.innerHTML = `
      <div class="toolbar">
        <button class="icon-btn" data-act="back" title="Back">${svg('back')}</button>
        <button class="icon-btn" data-act="forward" title="Forward">${svg('forward')}</button>
        <button class="icon-btn" data-act="reload" title="Reload">${svg('reload')}</button>
        <button class="icon-btn" data-act="home" title="Start page">${svg('home')}</button>
        <form class="addr">${svg('search')}<input class="url" spellcheck="false" autocomplete="off" placeholder="Search Wikipedia, or type a URL, data: URI or blob: URL"></form>
        <button class="icon-btn" data-act="openfile" title="Open a file from your computer (as a blob)">${svg('folder')}</button>
        <button class="icon-btn" data-act="newtab" title="Open in a real browser tab">${svg('external')}</button>
      </div>
      <div class="notice">${svg('info')}<span>Some websites (e.g. Google, YouTube, GitHub) refuse to load inside iframes. If a page stays blank, use “Open in new tab”.</span><button class="icon-btn" data-act="dismiss" title="Dismiss">${svg('close')}</button></div>
      <div class="frame-wrap">
        <iframe title="Web page" sandbox="${FRAME_SANDBOX}" allow="${FRAME_ALLOW}" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
        <div class="start-page">
          <h1>Sanjivram<span>Web</span></h1>
          <input class="input sp-search" placeholder="Search Wikipedia, or enter a URL / data: URI / blob: URL" spellcheck="false">
          <div class="sp-tiles">${SITES.map(s => `<div class="sp-tile" data-url="${esc(s.u)}"><div class="sp-fav" style="background:${s.c}">${s.l}</div>${esc(s.n)}</div>`).join('')}
            <div class="sp-tile" data-act="openfile"><div class="sp-fav" style="background:#334155">${svg('folder')}</div>Open local file</div>
            <div class="sp-tile" data-act="paste"><div class="sp-fav" style="background:#0f766e">${svg('link')}</div>Paste a link</div></div>
          <div class="sp-note">Supports http(s) pages, <b>data:</b> URIs and <b>blob:</b> URLs — paste one in the address bar, or drop a file here to view it.<br>Links clicked inside a page don't update the address bar (browsers hide cross-origin locations).</div>
        </div>
        <div class="loader done"><div class="spinner"></div><div>Loading…</div></div>
        <div class="drop-hint">Drop a file to open it</div>
      </div>`;
    const frame = $('iframe', win.body), start = $('.start-page', win.body), loader = $('.loader', win.body);
    const urlIn = $('.url', win.body), backB = $('[data-act="back"]', win.body), fwdB = $('[data-act="forward"]', win.body);
    const stack = [], HOME = 'about:home';
    const owned = new Set();      // blob: URLs this window created (revoked on close)
    const dataCache = new Map();  // data: URI -> blob: URL used to load it
    let idx = -1, loadT, shown = '';

    const normalize = v => {
      v = v.trim();
      if (!v || v === HOME) return HOME;
      if (/^(https?:|data:|blob:|about:)/i.test(v)) return v;
      if (/^(localhost|[\w-]+(\.[\w-]+)+)(:\d+)?(\/\S*)?$/i.test(v)) return 'https://' + v;
      return 'https://en.wikipedia.org/w/index.php?search=' + encodeURIComponent(v);
    };
    /** data: URIs are loaded through a blob: URL — avoids Chrome's 2 MB data-URL navigation limit
     *  and its block on opening data: documents in new tabs. */
    const loadUrlFor = url => {
      if (!isDataUri(url)) return url;
      let u = dataCache.get(url);
      if (!u) { u = URL.createObjectURL(dataUriToBlob(url)); dataCache.set(url, u); owned.add(u); }
      return u;
    };
    const titleFor = e => {
      if (e.label) return e.label;
      if (isDataUri(e.url)) return 'data:' + (e.url.slice(5, e.url.indexOf(',')).split(';')[0] || 'text/plain');
      if (isBlobUrl(e.url)) return 'blob';
      try { return new URL(e.url).hostname || e.url; } catch { return e.url; }
    };
    const show = e => {
      const url = e.url;
      shown = url.length > 4096 ? shortUrl(url) : url;
      urlIn.value = url === HOME ? '' : shown;
      backB.disabled = idx <= 0; fwdB.disabled = idx >= stack.length - 1;
      if (url === HOME) { start.style.display = ''; loader.classList.add('done'); win.setTitle('Start page — Web Browser'); return; }
      let load;
      try { load = loadUrlFor(url); }
      catch (err) { Toast.show('Invalid data URI', err.message, 'info'); return; }
      start.style.display = 'none';
      loader.classList.remove('done');
      clearTimeout(loadT);
      loadT = setTimeout(() => loader.classList.add('done'), 10000);
      // location.replace keeps these navigations out of the shared session history.
      try { if (frame.getAttribute('src')) frame.contentWindow.location.replace(load); else frame.src = load; }
      catch { frame.src = load; }
      win.setTitle(`${titleFor(e)} — Web Browser`);
    };
    const go = (v, label) => {
      const url = normalize(v);
      stack.splice(idx + 1); stack.push({ url, label }); idx = stack.length - 1;
      show(stack[idx]);
    };
    const openFile = f => { const u = URL.createObjectURL(f); owned.add(u); go(u, f.name); };
    frame.addEventListener('load', () => { clearTimeout(loadT); loader.classList.add('done'); });

    const current = () => stack[idx] || { url: HOME };
    const actions = {
      back: () => { if (idx > 0) show(stack[--idx]); },
      forward: () => { if (idx < stack.length - 1) show(stack[++idx]); },
      reload: () => { if (current().url !== HOME) show(current()); },
      home: () => go(HOME),
      openfile: async () => { const [f] = await pickFiles(); if (f) openFile(f); },
      paste: () => openLinkFromClipboard(),
      newtab: () => {
        const u = current().url;
        if (u === HOME) return window.open('https://en.wikipedia.org', '_blank', 'noopener');
        let target = u;
        try { target = loadUrlFor(u); } catch {}
        window.open(target, '_blank'); // blob: URLs need the opener's origin, so no 'noopener' here
      },
      dismiss: () => $('.notice', win.body).remove()
    };
    win.body.addEventListener('click', e => {
      const b = e.target.closest('[data-act]');
      if (b && actions[b.dataset.act]) { actions[b.dataset.act](); return; }
      const t = e.target.closest('.sp-tile[data-url]');
      if (t) go(t.dataset.url);
    });
    $('form.addr', win.body).addEventListener('submit', e => {
      e.preventDefault();
      // A shortened long URL that wasn't edited means "reload the full one".
      if (urlIn.value === shown && current().url !== HOME) show(current()); else go(urlIn.value);
      urlIn.blur();
    });
    $('.sp-search', win.body).addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.value.trim()) go(e.target.value); });
    urlIn.addEventListener('focus', () => urlIn.select());
    win.onDropFiles = files => files.forEach((f, i) => i === 0 ? openFile(f) : WM.open('browser', { file: f }));
    win.onKey = e => {
      if (e.key === 'F5') { e.preventDefault(); actions.reload(); }
      if ((e.ctrlKey && e.key.toLowerCase() === 'l') || e.key === 'F6') { e.preventDefault(); urlIn.focus(); }
      if (e.ctrlKey && e.key.toLowerCase() === 'o') { e.preventDefault(); actions.openfile(); }
      if (e.altKey && e.key === 'ArrowLeft') { e.preventDefault(); actions.back(); }
      if (e.altKey && e.key === 'ArrowRight') { e.preventDefault(); actions.forward(); }
    };
    win.onClose = () => {
      clearTimeout(loadT);
      // Give the iframe a moment to unload before freeing the blobs it may still be reading.
      setTimeout(() => owned.forEach(u => URL.revokeObjectURL(u)), 1000);
    };
    if (args.label && args.url && isBlobUrl(args.url)) owned.add(args.url); // handed over by e.g. the Terminal
    if (args.file) openFile(args.file);
    else go(args.url || HOME, args.label);
  }
});

/** One-click recovery actions (Settings → Reset & Recovery). */
const Resetter = {
  TEXT: {
    appearance: ['Reset appearance?', 'Colour scheme, accent, wallpaper, icon style, layout and dock size go back to the Pop!_OS defaults.', 'Reset appearance'],
    dock: ['Reset dock & desktop?', 'The dock goes back to its default apps and the desktop is cleared. Your apps and files are kept.', 'Reset'],
    apps: ['Reset apps?', 'App Store apps and websites you added are removed, and built-in apps you removed come back. SanjivramOS will restart.', 'Reset apps'],
    data: ['Clear app data?', 'Game scores, Terminal history, Sticky Notes, To-Do lists, music links and app usage history will be erased.', 'Clear data'],
    notes: ['Delete all notes?', 'Every note and text file will be permanently deleted.', 'Delete notes'],
    personal: ['Reset personalization?', 'Window, panel, dock, desktop, wallpaper effect, sound, notification and lock screen options go back to their defaults. Widgets, themes and app icons are kept.', 'Reset'],
    setup: ['Run setup again?', 'The setup assistant opens now. Your apps and files are kept.', 'Start setup'],
    factory: ['Factory reset?', 'Everything SanjivramOS has stored in this browser is erased and it restarts like new.', 'Erase everything']
  },
  async run(kind) {
    const [title, msg, ok] = this.TEXT[kind];
    if (!(await Dialog.confirm(title, msg, { okText: ok, danger: kind !== 'setup' }))) return;
    if (kind === 'appearance') {
      ['scheme', 'theme', 'lastDark', 'accent', 'wallpaper', 'customWallpaper', 'iconStyle', 'layout', 'dockSize'].forEach(k => Settings.set(k, DEFAULT_SETTINGS[k]));
      Toast.show('Appearance reset', 'Back to the Pop!_OS look.', 'palette');
    } else if (kind === 'dock') {
      Settings.set('pinned', DEFAULT_SETTINGS.pinned.slice());
      Store.set('desktop.items', []); Desktop.positions = {}; Desktop.save(); Desktop.render();
      Toast.show('Dock & desktop reset', '', 'grid');
    } else if (kind === 'apps') {
      ['store.installed', 'store.removed', 'store.custom'].forEach(k => Store.remove(k));
      location.reload();
    } else if (kind === 'data') {
      ['snake.best', 'ms.level', 'ms.best.easy', 'ms.best.medium', 'ms.best.hard', 'terminal.history', 'music.urls', 'music.volume', 'stickies', 'todos', 'appUsage'].forEach(k => Store.remove(k));
      NotifHistory.length = 0;
      Toast.show('App data cleared', '', 'trash');
    } else if (kind === 'notes') {
      Store.remove('notes'); FS.load(); Bus.emit('fs');
      Toast.show('Notes deleted', 'A fresh Welcome note was created.', 'trash');
    } else if (kind === 'personal') {
      Object.entries(PERSONAL_DEFAULTS).forEach(([k, v]) => { if (JSON.stringify(Settings.get(k)) !== JSON.stringify(v)) Settings.set(k, v); });
      Toast.show('Personalization reset', '', 'restore');
    } else if (kind === 'setup') {
      WM.closeAll(); Setup.show();
    } else if (kind === 'factory') {
      Store.clearAll(); location.reload();
    }
  }
};

    /** Reflect the current settings in the visible controls without rebuilding them. */
    const sync = () => {
      const name = Settings.get('username'), on = (b, v) => b.classList.toggle('on', v);
      $('.su-name', win.body).textContent = name;
      $('.set-user .avatar', win.body).textContent = name.charAt(0).toUpperCase();
      $$('[data-sec]', win.body).forEach(b => on(b, b.dataset.sec === section));
      $$('[data-set-theme]', main).forEach(b => on(b, b.dataset.setTheme === Settings.get('theme')));
      $$('[data-pick-scheme]', main).forEach(b => on(b, b.dataset.pickScheme === Settings.get('scheme')));
      $$('[data-pick-icons]', main).forEach(b => on(b, b.dataset.pickIcons === document.documentElement.dataset.icons));
      $$('[data-pick-layout]', main).forEach(b => on(b, b.dataset.pickLayout === document.documentElement.dataset.layout));
      $$('[data-pick-menu]', main).forEach(b => on(b, b.dataset.pickMenu === (Settings.get('menuStyle') || 'auto')));
      $$('[data-set-str]', main).forEach(b => on(b, String(Settings.get(b.dataset.setStr)) === b.dataset.v));
      $$('[data-set-select-str]', main).forEach(r => { r.value = Settings.get(r.dataset.setSelectStr); });
      $$('[data-set-color]', main).forEach(r => { const v = Settings.get(r.dataset.setColor); r.value = isHex(v) ? v : '#808080'; r.parentElement.classList.toggle('auto', !isHex(v)); });
      $$('[data-set-time]', main).forEach(r => { r.value = Settings.get(r.dataset.setTime) || ''; });
      const cso = customSchemeOpts();
      $$('[data-cscheme]', main).forEach(r => { r.value = cso[r.dataset.cscheme]; });
      $$('[data-cs-base]', main).forEach(b => on(b, b.dataset.csBase === cso.base));
      $$('[data-set-range]', main).forEach(r => { const em = r.parentElement.querySelector('em'); if (em) em.textContent = Settings.get(r.dataset.setRange) + (r.dataset.unit || ''); });
      const c = customOpts();
      $$('[data-cust]', main).forEach(b => on(b, String(c[b.dataset.cust]) === b.dataset.v));
      $$('[data-cust-sw]', main).forEach(b => on(b, !!c[b.dataset.custSw]));
      $$('[data-set-toggle]', main).forEach(b => on(b, !!Settings.get(b.dataset.setToggle)));
      $$('[data-set-dock]', main).forEach(b => on(b, b.dataset.setDock === (Settings.get('dockSize') || 'm')));
      $$('[data-set-range]', main).forEach(r => { r.value = Settings.get(r.dataset.setRange); });
      $$('[data-set-select]', main).forEach(r => { r.value = String(Settings.get(r.dataset.setSelect) || 0); });
      $$('[data-accent]', main).forEach(b => on(b, b.dataset.accent.toLowerCase() === Settings.get('accent').toLowerCase()));
      const custom = $('.accent-custom', main);
      if (custom) { custom.value = Settings.get('accent'); on(custom.parentElement, !ACCENTS.includes(Settings.get('accent'))); }
      $$('[data-wp]', main).forEach(b => on(b, b.dataset.wp === Settings.get('wallpaper')));
      const ct = $('.custom-thumb', main);
      if (ct) ct.style.background = Settings.get('customWallpaper') ? Theme.wallpaperCss('custom') : 'repeating-linear-gradient(45deg, var(--surface-3) 0 10px, var(--surface-2) 10px 20px)';
      const av = $('.acct-av', main); if (av) av.textContent = name.charAt(0).toUpperCase();
      const an = $('.acct-name', main); if (an) an.textContent = name;
      const nc = $('.notif-count', main); if (nc) nc.textContent = `${NotifHistory.length} notification${NotifHistory.length === 1 ? '' : 's'} this session.`;
    };
    const render = () => {
      main.innerHTML = views[section]();
      main.scrollTop = 0;
      const un = $('.un', main); if (un) un.value = Settings.get('username');
      const osn = $('.os-name', main); if (osn) osn.value = Settings.get('osName') || 'SanjivramOS';
      const lmi = $('.lock-msg-in', main); if (lmi) lmi.value = Settings.get('lockMessage') || '';
      const wu = $('.wp-url', main);
      if (wu) { const cw = Settings.get('customWallpaper'); wu.value = isDataUri(cw) ? '' : cw; if (isDataUri(cw)) wu.placeholder = `Current: uploaded image (${shortUrl(cw)}) — paste a new URL to replace`; }
      sync();
    };

    win.body.addEventListener('click', async e => {
      // Only match elements inside this window: <html> itself carries data-* attributes
      // (data-theme, data-scheme, data-icons…), so a bare closest() would match the page root.
      const pick = sel => { const el = e.target.closest(sel); return el && win.body.contains(el) ? el : null; };
      let el;
      if ((el = pick('[data-sec]'))) { section = el.dataset.sec; render(); return; }
      if ((el = pick('[data-pick-scheme]'))) { Theme.setScheme(el.dataset.pickScheme); return; }

/* ---------------- App: Camera ---------------- */
Apps.register({
  id: 'camera', name: 'Camera', icon: 'app-camera', color: 'linear-gradient(135deg,#a5b4fc,#3730a3)',
  width: 760, height: 580, minWidth: 340, singleton: true, keywords: 'webcam photo selfie picture', aliases: ['webcam', 'photo'],
  launch(win) {
    win.body.innerHTML = `<div class="cam"><div class="cam-view"><video autoplay playsinline muted></video><div class="cam-msg">Starting camera… allow access when your browser asks.</div><div class="cam-flash"></div></div>
      <div class="cam-bar"><button class="icon-btn" data-act="mirror" title="Mirror">${svg('reload')}</button><button class="cam-shoot" data-act="shoot" title="Take photo (Space)"></button><div class="cam-thumbs"></div></div></div>`;
    const video = $('video', win.body), msg = $('.cam-msg', win.body), thumbs = $('.cam-thumbs', win.body);
    let stream = null, mirror = true;
    const urls = [];
    video.classList.add('mirror');
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      navigator.mediaDevices.getUserMedia({ video: true, audio: false }).then(st => {
        if (!WM.wins.has(win.id)) { st.getTracks().forEach(t => t.stop()); return; }
        stream = st; video.srcObject = st; msg.hidden = true;
      }).catch(err => { msg.textContent = 'Camera unavailable — ' + (err.name === 'NotAllowedError' ? 'permission was denied.' : err.message || err.name); });
    } else msg.textContent = 'This browser does not support cameras here.';
    const shoot = () => {
      if (!stream) return;
      const c = document.createElement('canvas');
      c.width = video.videoWidth; c.height = video.videoHeight;
      const ctx = c.getContext('2d');
      if (mirror) { ctx.translate(c.width, 0); ctx.scale(-1, 1); }
      ctx.drawImage(video, 0, 0);
      c.toBlob(b => {
        const u = URL.createObjectURL(b); urls.push(u);
        const d = new Date(), name = `photo-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}.png`;
        const a = h(`<a class="cam-thumb" href="${u}" download="${name}" title="Download ${name}"><img src="${u}" alt=""></a>`);
        thumbs.prepend(a);
      }, 'image/png');
      const f = $('.cam-flash', win.body); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
      Sound.beep(1800, 0.05, 'square', 0, 0.05);
    };
    win.body.addEventListener('click', e => {
      const b = e.target.closest('[data-act]'); if (!b) return;
      if (b.dataset.act === 'shoot') shoot();
      if (b.dataset.act === 'mirror') { mirror = !mirror; video.classList.toggle('mirror', mirror); }
    });
    win.onKey = e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); shoot(); } };
    win.onClose = () => { if (stream) stream.getTracks().forEach(t => t.stop()); setTimeout(() => urls.forEach(u => URL.revokeObjectURL(u)), 1000); };
  }
});

/* ---------------- App: Screen Recorder ---------------- */
Apps.register({
  id: 'recorder', name: 'Screen Recorder', icon: 'app-recorder', color: 'linear-gradient(135deg,#fca5a5,#b91c1c)',
  width: 640, height: 520, minWidth: 340, singleton: true, keywords: 'screen record capture video screencast', aliases: ['screenrecord', 'record'],
  launch(win) {
    win.body.innerHTML = `<div class="rec">
      <div class="rec-status"><span class="rec-dot"></span><b class="rec-time">00:00</b><span class="rec-label">Ready to record</span></div>
      <div class="rec-btns"><button class="btn primary rec-start">${svg('record')}Start recording</button><button class="btn rec-stop" disabled>${svg('close')}Stop</button></div>
      <video class="rec-video" controls hidden></video>
      <a class="btn rec-dl" hidden>${svg('download')}Download video</a>
      <p class="set-desc">You choose what to share — a tab, a window or the whole screen. The recording stays on your computer.</p>
    </div>`;
    const q = sel => $(sel, win.body);
    let rec = null, chunks = [], stream = null, t0 = 0, timer = 0, url = null;
    const setState = on => {
      q('.rec-start').disabled = on; q('.rec-stop').disabled = !on;
      win.body.querySelector('.rec').classList.toggle('on', on);
      q('.rec-label').textContent = on ? 'Recording…' : 'Ready to record';
    };
    const stop = () => { if (rec && rec.state !== 'inactive') rec.stop(); if (stream) stream.getTracks().forEach(t => t.stop()); clearInterval(timer); setState(false); };
    q('.rec-start').addEventListener('click', async () => {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) { Toast.show('Not supported', 'This browser cannot record the screen.', 'info'); return; }
      try { stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true }); }
      catch { Toast.show('Recording cancelled', '', 'info', 1800); return; }
      chunks = [];
      rec = new MediaRecorder(stream);
      rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
      rec.onstop = () => {
        const blob = new Blob(chunks, { type: rec.mimeType || 'video/webm' });
        if (url) URL.revokeObjectURL(url);
        url = URL.createObjectURL(blob);
        const v = q('.rec-video'); v.src = url; v.hidden = false;
        const d = new Date(), a = q('.rec-dl');
        a.href = url; a.download = `recording-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.webm`; a.hidden = false;
        Toast.show('Recording saved', 'Preview it or click Download.', 'record');
      };
      stream.getVideoTracks()[0].addEventListener('ended', stop);
      rec.start(1000); t0 = Date.now(); setState(true);
      timer = setInterval(() => { const s2 = Math.floor((Date.now() - t0) / 1000); q('.rec-time').textContent = `${pad(Math.floor(s2 / 60))}:${pad(s2 % 60)}`; }, 500);
    });
    q('.rec-stop').addEventListener('click', stop);
    win.beforeClose = async () => !(rec && rec.state === 'recording') || Dialog.confirm('Stop recording?', 'Closing will stop and discard the current recording.', { okText: 'Stop & close', danger: true });
    win.onClose = () => { stop(); setTimeout(() => url && URL.revokeObjectURL(url), 1000); };
  }
});
