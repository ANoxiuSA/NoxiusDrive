<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ISO Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    
    :root {
      --bg-primary: #1e1e2e;
      --bg-secondary: #181825;
      --bg-tertiary: #11111b;
      --sidebar-bg: #181825;
      --content-bg: #1e1e2e;
      --hover-bg: #313244;
      --selected-bg: #45475a;
      --border: #313244;
      --text-primary: #cdd6f4;
      --text-secondary: #a6adc8;
      --text-muted: #6c7086;
      --accent-blue: #89b4fa;
      --accent-purple: #cba6f7;
      --accent-green: #a6e3a1;
      --accent-red: #f38ba8;
      --accent-yellow: #f9e2af;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow: hidden;
      height: 100vh;
    }

    /* File Manager Layout */
    .file-manager {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* Title Bar */
    .title-bar {
      background: var(--bg-tertiary);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .title-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .window-controls {
      display: flex;
      gap: 0.5rem;
    }

    .window-btn {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      cursor: pointer;
    }

    .window-btn.close { background: #f38ba8; }
    .window-btn.minimize { background: #f9e2af; }
    .window-btn.maximize { background: #a6e3a1; }

    .app-icon {
      font-size: 1.25rem;
      color: var(--accent-blue);
    }

    .app-title {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-primary);
    }

    /* Toolbar */
    .toolbar {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .toolbar-section {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .toolbar-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.875rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .toolbar-btn:hover {
      background: var(--hover-bg);
      color: var(--text-primary);
    }

    .toolbar-btn.active {
      background: var(--accent-blue);
      color: var(--bg-primary);
      border-color: var(--accent-blue);
    }

    .toolbar-divider {
      width: 1px;
      height: 24px;
      background: var(--border);
      margin: 0 0.5rem;
    }

    .search-box {
      flex: 1;
      max-width: 400px;
      position: relative;
    }

    .search-input {
      width: 100%;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 0.5rem 0.75rem 0.5rem 2.5rem;
      border-radius: 6px;
      font-size: 0.875rem;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--accent-blue);
    }

    .search-icon {
      position: absolute;
      left: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    /* Main Content */
    .main-content {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 220px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      padding: 1rem 0.5rem;
      overflow-y: auto;
    }

    .sidebar-section {
      margin-bottom: 1.5rem;
    }

    .sidebar-title {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.5rem 0.75rem;
      margin-bottom: 0.25rem;
    }

    .sidebar-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.625rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--text-secondary);
      font-size: 0.875rem;
    }

    .sidebar-item:hover {
      background: var(--hover-bg);
      color: var(--text-primary);
    }

    .sidebar-item.active {
      background: var(--selected-bg);
      color: var(--text-primary);
    }

    .sidebar-icon {
      width: 20px;
      text-align: center;
      font-size: 1rem;
    }

    .sidebar-badge {
      margin-left: auto;
      background: var(--accent-blue);
      color: var(--bg-primary);
      font-size: 0.7rem;
      padding: 0.125rem 0.5rem;
      border-radius: 12px;
      font-weight: 600;
    }

    /* Content Area */
    .content-area {
      flex: 1;
      background: var(--content-bg);
      overflow-y: auto;
      padding: 1.5rem;
    }

    .breadcrumb-nav {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      font-size: 0.875rem;
      color: var(--text-secondary);
    }

    .breadcrumb-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      transition: color 0.2s;
    }

    .breadcrumb-item:hover {
      color: var(--accent-blue);
    }

    .breadcrumb-item.current {
      color: var(--text-primary);
      font-weight: 500;
    }

    /* File Grid */
    .file-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .file-item {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .file-item:hover {
      background: var(--hover-bg);
      border-color: var(--accent-blue);
      transform: translateY(-2px);
    }

    .file-item.selected {
      background: var(--selected-bg);
      border-color: var(--accent-blue);
    }

    .file-icon {
      font-size: 3rem;
      margin-bottom: 0.75rem;
      color: var(--accent-blue);
    }

    .file-icon.folder { color: var(--accent-yellow); }
    .file-icon.windows { color: var(--accent-blue); }
    .file-icon.linux { color: var(--accent-green); }
    .file-icon.iso { color: var(--accent-purple); }

    .file-name {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 0.25rem;
      word-wrap: break-word;
    }

    .file-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* List View */
    .file-list {
      display: none;
    }

    .file-list.active {
      display: block;
    }

    .list-header {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 1rem;
      padding: 0.75rem 1rem;
      background: var(--bg-secondary);
      border-radius: 6px;
      margin-bottom: 0.5rem;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .list-item {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 1rem;
      padding: 0.875rem 1rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 0.5rem;
      cursor: pointer;
      transition: all 0.2s;
      align-items: center;
    }

    .list-item:hover {
      background: var(--hover-bg);
      border-color: var(--accent-blue);
    }

    .list-item.selected {
      background: var(--selected-bg);
      border-color: var(--accent-blue);
    }

    .list-item-name {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: var(--text-primary);
      font-weight: 500;
    }

    .list-item-icon {
      font-size: 1.5rem;
    }

    .list-item-info {
      color: var(--text-secondary);
      font-size: 0.875rem;
    }

    /* Details Panel */
    .details-panel {
      width: 280px;
      background: var(--sidebar-bg);
      border-left: 1px solid var(--border);
      padding: 1.5rem;
      overflow-y: auto;
    }

    .details-panel.hidden {
      display: none;
    }

    .details-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .details-icon {
      font-size: 4rem;
      color: var(--accent-blue);
      margin-bottom: 1rem;
    }

    .details-title {
      font-weight: 600;
      font-size: 1.1rem;
      color: var(--text-primary);
      margin-bottom: 0.25rem;
    }

    .details-subtitle {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .details-section {
      margin-bottom: 1.5rem;
    }

    .details-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }

    .details-value {
      font-size: 0.875rem;
      color: var(--text-primary);
      margin-bottom: 0.75rem;
    }

    .download-button {
      background: var(--accent-blue);
      color: var(--bg-primary);
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      font-size: 0.875rem;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .download-button:hover {
      background: var(--accent-purple);
      transform: translateY(-1px);
    }

    .download-button:disabled {
      background: var(--border);
      color: var(--text-muted);
      cursor: not-allowed;
      transform: none;
    }

    /* Status Bar */
    .status-bar {
      background: var(--bg-tertiary);
      border-top: 1px solid var(--border);
      padding: 0.5rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .status-left, .status-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .sidebar {
        width: 200px;
      }
      
      .details-panel {
        width: 260px;
      }
    }

    @media (max-width: 768px) {
      .sidebar {
        position: absolute;
        left: -220px;
        height: calc(100vh - 110px);
        z-index: 100;
        transition: left 0.3s;
      }
      
      .sidebar.show {
        left: 0;
      }
      
      .details-panel {
        display: none;
      }
      
      .file-grid {
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      }
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-tertiary);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--hover-bg);
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid var(--bg-primary);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

        </button>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Sidebar -->
      <div class="sidebar">
        <div class="sidebar-section">
          <div class="sidebar-title">Categories</div>

            <span class="sidebar-badge">2</span>
          </div>
          <div class="sidebar-item" data-category="server">
            <i class="fas fa-server sidebar-icon"></i>
            <span>Server</span>
            <span class="sidebar-badge">5</span>
          </div>
        </div>

        <div class="sidebar-section">
          <div class="sidebar-title">Quick Access</div>
          <div class="sidebar-item" data-category="popular">
            <i class="fas fa-fire sidebar-icon"></i>
            <span>Popular</span>
          </div>
          <div class="sidebar-item" data-category="latest">
            <i class="fas fa-star sidebar-icon"></i>
            <span>Latest Releases</span>
          </div>
          <div class="sidebar-item" data-category="lts">
            <i class="fas fa-shield-alt sidebar-icon"></i>
            <span>LTS Versions</span>
          </div>
        </div>
      </div>

      <!-- Content Area -->
      <div class="content-area">
        <div class="breadcrumb-nav">
          <div class="breadcrumb-item">
            <i class="fas fa-home"></i>
            <span>Home</span>
          </div>
          <i class="fas fa-chevron-right" style="font-size: 0.7rem;"></i>
          <div class="breadcrumb-item current">
            <span id="current-location">All Distributions</span>
          </div>
        </div>

        <!-- Grid View -->
        <div class="file-grid" id="file-grid">
          <!-- Items will be populated here -->
        </div>

        <!-- List View -->
        <div class="file-list" id="file-list">
          <div class="list-header">
            <div>Name</div>
            <div>Type</div>
            <div>Size</div>
            <div>Release</div>
          </div>
          <!-- Items will be populated here -->
        </div>
      </div>

      <!-- Details Panel -->
      <div class="details-panel" id="details-panel">
        <div id="details-content">
          <div style="text-align: center; padding: 2rem 0;">
            <i class="fas fa-mouse-pointer" style="font-size: 3rem; color: var(--text-muted); margin-bottom: 1rem;"></i>
            <p style="color: var(--text-muted); font-size: 0.875rem;">Select an item to view details</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar">
      <div class="status-left">
        <span id="item-count">14 items</span>
        <span>•</span>
        <span id="selected-count">None selected</span>
      </div>
      <div class="status-right">
        <span>Ready</span>
      </div>
    </div>
  </div>

          { label: "NVIDIA", url: "https://iso.pop-os.org/22.04/amd64/nvidia/45/pop-os_22.04_amd64_nvidia_45.iso" },
          { label: "Intel/AMD", url: "https://iso.pop-os.org/22.04/amd64/intel/45/pop-os_22.04_amd64_intel_45.iso" }
        ]
      },
      "Zorin OS 17.2": {
        icon: "fab fa-linux",
        color: "linux",
        category: ["linux"],
        type: "Desktop",
        size: "3.3 GB",
        release: "2024",
        description: "Windows-like Linux experience",
        versions: [
          { label: "Core", url: "https://distro.ibiblio.org/zorinos/17/Zorin-OS-17.2-Core-64-bit.iso" },
          { label: "Lite", url: "https://distro.ibiblio.org/zorinos/17/Zorin-OS-17.2-Lite-64-bit.iso" }
        ]
      },
      "CentOS Stream 9": {
        icon: "fab fa-centos",
        color: "linux",
        category: ["linux", "server"],
        type: "Server",
        size: "10.2 GB",
        release: "2024",
        description: "Enterprise Linux for servers",
        versions: [
          { label: "DVD", url: "https://mirror.stream.centos.org/9-stream/BaseOS/x86_64/iso/CentOS-Stream-9-latest-x86_64-dvd1.iso" }
        ]
      },
      "KDE neon": {
        icon: "fab fa-linux",
        color: "linux",
        category: ["linux", "latest"],
        type: "Desktop",
        size: "3.5 GB",
        release: "Rolling",
        description: "Latest KDE Plasma desktop on Ubuntu base",
        versions: [
          { label: "User Edition", url: "https://files.kde.org/neon/images/user/current/neon-user-current.iso" }
        ]
      },
      "Manjaro": {
        icon: "fab fa-linux",
        color: "linux",
        category: ["linux", "popular"],
        type: "Desktop",
        size: "3.6 GB",
        release: "Rolling",
        description: "User-friendly Arch-based distribution",
        versions: [
          { label: "GNOME", url: "https://download.manjaro.org/gnome/24.2.1/manjaro-gnome-24.2.1-minimal-241221-linux612.iso" },
          { label: "KDE", url: "https://download.manjaro.org/kde/24.2.1/manjaro-kde-24.2.1-minimal-241221-linux612.iso" }
        ]
      }
    };

    let selectedItem = null;
    let currentView = 'grid';
    let currentCategory = 'all';

    const fileGrid = document.getElementById('file-grid');
    const fileList = document.getElementById('file-list');
    const detailsPanel = document.getElementById('details-panel');
    const detailsContent = document.getElementById('details-content');
    const searchInput = document.getElementById('search-input');
    const currentLocation = document.getElementById('current-location');
    const itemCount = document.getElementById('item-count');
    const selectedCount = document.getElementById('selected-count');

    // Populate distributions
    function renderDistributions(filter = 'all', searchTerm = '') {
      fileGrid.innerHTML = '';
      fileList.innerHTML = `
        <div class="list-header">
          <div>Name</div>
          <div>Type</div>
          <div>Size</div>
          <div>Release</div>
        </div>
      `;

      let count = 0;
      Object.keys(distributions).forEach(name => {
        const distro = distributions[name];
        
        // Filter by category
        if (filter !== 'all' && !distro.category.includes(filter)) return;
        
        // Filter by search
        if (searchTerm && !name.toLowerCase().includes(searchTerm.toLowerCase())) return;
        
        count++;

        // Grid item
        const gridItem = document.createElement('div');
        gridItem.className = 'file-item';
        gridItem.innerHTML = `
          <i class="${distro.icon} file-icon ${distro.color}"></i>
          <div class="file-name">${name}</div>
          <div class="file-meta">${distro.size}</div>
        `;
        gridItem.addEventListener('click', () => selectItem(name, gridItem));
        fileGrid.appendChild(gridItem);

        // List item
        const listItem = document.createElement('div');
        listItem.className = 'list-item';
        listItem.innerHTML = `
          <div class="list-item-name">
            <i class="${distro.icon} list-item-icon ${distro.color}"></i>
            <span>${name}</span>
          </div>
          <div class="list-item-info">${distro.type}</div>
          <div class="list-item-info">${distro.size}</div>
          <div class="list-item-info">${distro.release}</div>
        `;
        listItem.addEventListener('click', () => selectItem(name, listItem));
        fileList.appendChild(listItem);
      });

      itemCount.textContent = `${count} items`;
    }

    function selectItem(name, element) {
      // Clear previous selection
      document.querySelectorAll('.file-item, .list-item').forEach(item => {
        item.classList.remove('selected');
      });

      element.classList.add('selected');
      selectedItem = distributions[name];
      selectedCount.textContent = '1 selected';

      // Show details
      detailsContent.innerHTML = `
        <div class="details-header">
          <i class="${selectedItem.icon} details-icon ${selectedItem.color}"></i>
          <div class="details-title">${name}</div>
          <div class="details-subtitle">${selectedItem.type}</div>
        </div>

        <div class="details-section">
          <div class="details-label">Description</div>
          <div class="details-value">${selectedItem.description}</div>
        </div>

        <div class="details-section">
          <div class="details-label">Size</div>
          <div class="details-value">${selectedItem.size}</div>
        </div>

        <div class="details-section">
          <div class="details-label">Release</div>
          <div class="details-value">${selectedItem.release}</div>
        </div>

        <div class="details-section">
          <div class="details-label">Available Versions</div>
          <select class="version-select" id="version-selector" style="width: 100%; background: var(--bg-tertiary); border: 1px solid var(--border); color: var(--text-primary); padding: 0.5rem; border-radius: 6px; margin-bottom: 1rem;">
            ${selectedItem.versions.map((v, i) => 
              `<option value="${i}">${v.label}</option>`
            ).join('')}
          </select>
        </div>

        <button class="download-button" id="download-btn">
          <i class="fas fa-download"></i>
          Download ISO
        </button>
      `;

      // Add download handler
      document.getElementById('download-btn').addEventListener('click', function() {
        const versionIndex = document.getElementById('version-selector').value;
        const url = selectedItem.versions[versionIndex].url;
        
        this.innerHTML = '<div class="spinner"></div><span>Starting download...</span>';
        this.disabled = true;

        setTimeout(() => {
          window.location.href = url;
          setTimeout(() => {
            this.innerHTML = '<i class="fas fa-download"></i> Download ISO';
            this.disabled = false;
          }, 2000);
        }, 500);
      });
    }

    // View toggle
    document.getElementById('grid-view-btn').addEventListener('click', function() {
      currentView = 'grid';
      fileGrid.style.display = 'grid';
      fileList.style.display = 'none';
      this.classList.add('active');
      document.getElementById('list-view-btn').classList.remove('active');
    });

    document.getElementById('list-view-btn').addEventListener('click', function() {
      currentView = 'list';
      fileGrid.style.display = 'none';
      fileList.style.display = 'block';
      fileList.classList.add('active');
      this.classList.add('active');
      document.getElementById('grid-view-btn').classList.remove('active');
    });

    // Details toggle
    document.getElementById('details-toggle').addEventListener('click', function() {
      detailsPanel.classList.toggle('hidden');
      this.classList.toggle('active');
    });

    // Category selection
    document.querySelectorAll('.sidebar-item[data-category]').forEach(item => {
      item.addEventListener('click', function() {
        document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
        this.classList.add('active');
        
        currentCategory = this.getAttribute('data-category');
        currentLocation.textContent = this.textContent.trim().replace(/\d+$/, '').trim();
        
        renderDistributions(currentCategory, searchInput.value);
      });
    });

    // Search
    searchInput.addEventListener('input', (e) => {
      renderDistributions(currentCategory, e.target.value);
    });

    // Initial render
    renderDistributions();
  </script>
</body>
</html>
