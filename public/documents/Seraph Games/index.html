<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SeraphGames</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    iframe {
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
      background: #000;
    }

</head>
<body>
  <iframe
    src="https://seraphgames.vercel.app"
    title="SeraphGames"
    loading="eager"
    referrerpolicy="no-referrer"
    allow="fullscreen; gamepad; autoplay"
    allowfullscreen
  ></iframe>
</body>
</html>
